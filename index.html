3c/span>\u003cspan class=\"l\">Actual vs. expected\u003c/span>\u003cspan class=\"modtag\">module\u003c/span>\u003c/a>\u003ca class=\"step\" href=\"Export.dc.html\" onClick=\"{{nav.Export}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003cpath d=\"M5 20V10M12 20V4M19 20v-7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Export to BPT\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"gov\">\u003cb>Governance layer · under every step\u003c/b>\u003ca class=\"step\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 20h16M6 16l9-9 3 3-9 9H6z\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Assumptions &amp; approvals\u003c/span>\u003c/a>\u003c/div>\n\u003cdiv class=\"roadmap\">\u003cb>Next modules\u003c/b>Revenue + admin engines at full depth (Phase 2) · MedEx engine reused for ACO / VBC · employer benefit simulation\u003c/div>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003cdiv class=\"top\">\n\u003cdiv class=\"crumbs\" style=\"flex-direction:column;align-items:flex-start;gap:5px;justify-content:center;min-width:0\">\u003cdiv style=\"display:flex;gap:10px;align-items:center;white-space:nowrap\">\u003cspan style=\"font-weight:600\">Meridian Health Plan\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan>CY2028 bid\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan class=\"illus\">Illustrative · fictional plan, de-identified members\u003c/span>\u003cspan class=\"scope\">Scope · medical expense (Phase 1)\u003c/span>\u003c/div>\u003cdiv style=\"display:flex;gap:6px;align-items:center;white-space:nowrap\">\u003cspan class=\"stamp\">as of 12/31/26 · frozen 2/15/27\u003c/span>\u003cspan class=\"stamp\">v2.3.1 deterministic\u003c/span>\u003ca class=\"stamp\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">register r14 · #7f3ac91e\u003c/a>\u003ca class=\"stamp amber\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">sign-off 10/16\u003c/a>\u003ca class=\"stamp mint\" href=\"Ingest.dc.html\" onClick=\"{{nav.Ingest}}\" style=\"text-decoration:none\">GL gate · passed\u003c/a>\u003c/div>\u003c/div>\n\u003ca class=\"toplink\" href=\"Main.dc.html\" onClick=\"{{nav.Main}}\">Backtest\u003c/a>\n\u003ca class=\"toplink\" href=\"Pipeline.dc.html\" onClick=\"{{nav.Pipeline}}\">Architecture\u003c/a>\n\u003c/div>\n\u003cdiv class=\"content\">\n\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  \u003cdiv>\u003ch1 class=\"h1\">Scenario workbench\u003c/h1>\u003cdiv class=\"sub\">Benefit design is applied to each projected member, not through aggregate continuance-table adjustments: every member's CY2028 utilization is re-simulated under the scenario's benefits and cost sharing, with a utilization response that depends on that member's state, then summed. Move a lever and the members below move with it.\u003c/div>\u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px;align-items:center\">\u003cspan class=\"stamp mint\">turnaround · {{turn}} min\u003c/span>\u003cbutton class=\"btn ghost sm\" onClick=\"{{dup}}\">Duplicate scenario\u003c/button>\u003cbutton class=\"btn sm\" onClick=\"{{cmp}}\">{{cmpT}}\u003c/button>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:280px minmax(0, 1fr) 380px;gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">Scenarios · CY2028\u003c/div>\n    \u003csc-for list=\"{{list}}\" as=\"s\" hint-placeholder-count=\"4\">\n      \u003cdiv class=\"{{s.cls}}\" onClick=\"{{s.pick}}\" style=\"padding:8px 10px;border:1px solid #EDE6DA;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px\">\u003cdiv style=\"display:flex;justify-content:space-between\">\u003cspan class=\"mono\" style=\"font-size:12.5px;color:#5C6B68\">{{s.id}}\u003c/span>\u003cspan class=\"mono\" style=\"font-size:12.5px\">{{s.margin}}\u003c/span>\u003c/div>\u003cspan style=\"font-weight:500;font-size:14px\">{{s.name}}\u003c/span>\u003cspan style=\"font-size:12.5px;color:#5C6B68\">{{s.desc}}\u003c/span>\u003c/div>\n    \u003c/sc-for>\n    \u003cdiv class=\"note\">Scenarios and interventions combine: \"keep dental, fund it with deprescribing + LTSS staging\" is S-03.\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n    \u003cdiv class=\"panel sand\">\n      \u003cdiv class=\"ph\">\u003cspan>Benefit levers · {{curName}}\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">every lever visible, every assumption overridable\u003c/span>\u003c/div>\n      \u003cdiv style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px 24px\">\n        \u003cdiv class=\"lever\">\u003clabel for=\"dental\">Dental annual cap\u003cspan>{{dentalT}}\u003c/span>\u003c/label>\u003cinput id=\"dental\" type=\"range\" min=\"0\" max=\"3000\" step=\"250\" value=\"{{dental}}\" onChange=\"{{set_dental}}\">\u003c/div>\n        \u003cdiv class=\"lever\">\u003clabel for=\"otc\">OTC allowance · per quarter\u003cspan>{{otcT}}\u003c/span>\u003c/label>\u003cinput id=\"otc\" type=\"range\" min=\"0\" max=\"200\" step=\"10\" value=\"{{otc}}\" onChange=\"{{set_otc}}\">\u003c/div>\n        \u003cdiv class=\"lever\">\u003clabel for=\"rides\">Transportation rides · per year\u003cspan>{{ridesT}}\u003c/span>\u003c/label>\u003cinput id=\"rides\" type=\"range\" min=\"0\" max=\"48\" step=\"4\" value=\"{{rides}}\" onChange=\"{{set_rides}}\">\u003c/div>\n        \u003cdiv class=\"lever\">\u003clabel for=\"pbg\">Part B premium giveback · per month\u003cspan>{{pbgT}}\u003c/span>\u003c/label>\u003cinput id=\"pbg\" type=\"range\" min=\"0\" max=\"50\" step=\"5\" value=\"{{pbg}}\" onChange=\"{{set_pbg}}\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\" style=\"flex-grow:1\">\n      \u003cdiv class=\"ph\">\u003cspan>Induced utilization · per cohort, disclosed\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">each factor shows its basis · replace any with yours in one click\u003c/span>\u003c/div>\n      \u003ctable class=\"t\">\u003ctr>\u003cth>Cohort\u003c/th>\u003cth class=\"r\">Members\u003c/th>\u003cth class=\"r\">Dental\u003c/th>\u003cth class=\"r\">OTC\u003c/th>\u003cth class=\"r\">Transport\u003c/th>\u003cth class=\"r\">Induced PMPM\u003c/th>\u003cth class=\"r\">Offset PMPM\u003c/th>\u003cth>Basis\u003c/th>\u003cth>\u003c/th>\u003c/tr>\n      \u003csc-for list=\"{{iu}}\" as=\"r\" hint-placeholder-count=\"5\">\u003ctr>\u003ctd>{{r.n}}\u003c/td>\u003ctd class=\"num\">{{r.m}}\u003c/td>\u003ctd class=\"num\">{{r.d}}\u003c/td>\u003ctd class=\"num\">{{r.o}}\u003c/td>\u003ctd class=\"num\">{{r.t}}\u003c/td>\u003ctd class=\"num neg\">{{r.ind}}\u003c/td>\u003ctd class=\"num pos\">{{r.off}}\u003c/td>\u003ctd>\u003cspan class=\"badge {{r.bCls}}\">{{r.basis}}\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"btn ghost sm\" onClick=\"{{r.swap}}\" style=\"height:24px;font-size:12.5px;white-space:nowrap\">{{r.swapT}}\u003c/button>\u003c/td>\u003c/tr>\u003c/sc-for>\n      \u003c/table>\n      \u003cdiv class=\"note\">Induced utilization = benefit-driven visits and fills beyond baseline; offset = avoided ED / admits from transport and OTC in the cohorts where evidence supports it. Both disclosed, never netted silently. Basis: PLAN = Meridian's own experience from a prior benefit change · BENCH = industry benchmark · MODEL = PMABI cohort model · ACTUARY = your factor (flat 1.00×, logged to the register).\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"ph\">Repriced · {{curName}}\u003c/div>\n      \u003cdiv class=\"kv\">\u003cspan class=\"k\">Supplemental benefit PMPM\u003c/span>\u003cspan class=\"v\">{{benT}}\u003c/span>\u003cspan class=\"k\">Induced utilization PMPM\u003c/span>\u003cspan class=\"v\">{{indT}}\u003c/span>\u003cspan class=\"k\">Offsets PMPM\u003c/span>\u003cspan class=\"v\">{{offT}}\u003c/span>\u003cspan class=\"k\">Net cost vs. filed design\u003c/span>\u003cspan class=\"v\">{{netT}}\u003c/span>\u003cspan class=\"k\">Rebate reallocation\u003c/span>\u003cspan class=\"v\">{{rebT}}\u003c/span>\u003c/div>\n      \u003cdiv style=\"border-top:1px solid #EDE6DA;padding-top:8px;display:flex;justify-content:space-between;align-items:baseline\">\u003cspan>Margin · MedEx view\u003c/span>\u003cspan class=\"big s {{mCls}}\">{{marginT}}\u003c/span>\u003c/div>\n      \u003cdiv style=\"display:flex;justify-content:space-between;font-size:13.5px\">\u003cspan style=\"color:#5C6B68\">vs. second-opinion baseline 2.5%\u003c/span>\u003cspan class=\"mono {{mCls}}\">{{dBps}}\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">TBC check · total beneficiary cost\u003c/div>\n      \u003cdiv class=\"kv\">\u003cspan class=\"k\">TBC Δ vs. CY2027\u003c/span>\u003cspan class=\"v\">{{tbcT}}\u003c/span>\u003cspan class=\"k\">Limit assumption\u003c/span>\u003cspan class=\"v\">$36.00 · [update on CY2028 Final Notice]\u003c/span>\u003cspan class=\"k\">Status\u003c/span>\u003cspan class=\"v {{tbcCls}}\">{{tbcS}}\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003csc-if value=\"{{cmpOn}}\" hint-placeholder-val=\"{{ false }}\">\n    \u003cdiv class=\"panel sand\">\u003cdiv class=\"ph\">Side by side · vs. S-01 filed design\u003c/div>\n      \u003ctable class=\"t\" style=\"background:transparent\">\u003ctr>\u003cth>\u003c/th>\u003cth class=\"r\">S-01\u003c/th>\u003cth class=\"r\">{{curId}}\u003c/th>\u003c/tr>\n        \u003ctr>\u003ctd>Dental cap\u003c/td>\u003ctd class=\"num\">$2,000\u003c/td>\u003ctd class=\"num\">{{dentalT}}\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>OTC / qtr\u003c/td>\u003ctd class=\"num\">$100\u003c/td>\u003ctd class=\"num\">{{otcT}}\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Rides / yr\u003c/td>\u003ctd class=\"num\">24\u003c/td>\u003ctd class=\"num\">{{ridesT}}\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Part B giveback\u003c/td>\u003ctd class=\"num\">$0\u003c/td>\u003ctd class=\"num\">{{pbgT}}\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Margin\u003c/td>\u003ctd class=\"num\">2.5%\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">{{marginT}}\u003c/td>\u003c/tr>\n      \u003c/table>\u003c/div>\n    \u003c/sc-if>\n    \u003cdiv class=\"note\">Scenario margin is on the PMABI second-opinion forecast. To fund a benefit with programs, open the \u003ca href=\"Interventions.dc.html\" onClick=\"{{nav.Interventions}}\">Intervention studio\u003c/a>; committed programs appear on the \u003ca href=\"Bid.dc.html\" onClick=\"{{nav.Bid}}\">Bid comparison\u003c/a>.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"panel\">\n  \u003cdiv class=\"ph\">\u003cspan>Member-level simulation · {{curName}}\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">148,000 members × 12 months, re-simulated · sample of 5, de-identified\u003c/span>\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Member\u003c/th>\u003cth>State that drives the response\u003c/th>\u003cth class=\"r\">Dental visits / yr\u003c/th>\u003cth class=\"r\">Rides used / yr\u003c/th>\u003cth class=\"r\">Member cost share Δ / yr\u003c/th>\u003cth class=\"r\">Plan cost Δ PMPM\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{sim}}\" as=\"m\" hint-placeholder-count=\"5\">\u003ctr>\u003ctd class=\"mono\">{{m.id}}\u003c/td>\u003ctd style=\"font-size:13.5px\">{{m.st}}\u003c/td>\u003ctd class=\"num\">{{m.dv}}\u003c/td>\u003ctd class=\"num\">{{m.rd}}\u003c/td>\u003ctd class=\"num\">{{m.cs}}\u003c/td>\u003ctd class=\"num {{m.cls}}\">{{m.pc}}\u003c/td>\u003c/tr>\u003c/sc-for>\n  \u003c/table>\n  \u003cdiv class=\"note\">A continuance table would apply one average response to everyone. Here a dental cap cut barely moves a member with no recent dental use and sharply changes one mid-treatment; the aggregate is the sum of those differences.\u003c/div>\n\u003c/div>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1280}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\n\nconstructor(p){ super(p); this.state = { cur: 0, cmp: false, act: {}, sc: [\n  { id: 'S-01', name: 'Filed benefit design', desc: 'baseline · as drafted for CY2028', dental: 2000, otc: 100, rides: 24, pbg: 0, prog: 0 },\n  { id: 'S-02', name: 'Dental cap $2,000 → $1,500', desc: 'retrenchment option', dental: 1500, otc: 100, rides: 24, pbg: 0, prog: 0 },\n  { id: 'S-03', name: 'Keep dental, fund with programs', desc: 'deprescribing + LTSS staging offsets', dental: 2000, otc: 100, rides: 24, pbg: 0, prog: 14 },\n  { id: 'S-04', name: 'Drop Part B giveback, add rides', desc: 'shift rebate toward SDoH', dental: 2000, otc: 100, rides: 36, pbg: 0, prog: 0 },\n] }; }\ncalc(sc) {\n  const ben = sc.dental * .19 / 12 + sc.otc * 4 * .85 / 12 + sc.rides * 22 * .30 / 12 + sc.pbg;\n  const base = 2000 * .19 / 12 + 100 * 4 * .85 / 12 + 24 * 22 * .30 / 12;\n  const ind = sc.dental * .0021 + sc.otc * .012 + sc.rides * .04;\n  const indB = 2000 * .0021 + 100 * .012 + 24 * .04;\n  const off = sc.rides * .11 + sc.otc * .02;\n  const offB = 24 * .11 + 100 * .02;\n  const net = (ben - base) + (ind - indB) - (off - offB);\n  const margin = 2.5 - net / 1525.08 * 100 + sc.prog / 100;\n  return { ben, ind, off, net, margin, tbc: (ben - base) * -1 + (sc.pbg) };\n}\n_rv() {\n  const s = this.state, sc = s.sc[s.cur], c = this.calc(sc);\n  const m = v => (v \u003c 0 ? '−' : '') + '$' + Math.abs(v).toFixed(2);\n  const set = k => e => { const arr = s.sc.map((x, i) => i === s.cur ? { ...x, [k]: +e.target.value } : x); this.setState({ sc: arr }); };\n  const iu = [\n    { n: 'LTSS ramp', m: '2,140', dw: .3, ow: 1.4, tw: 1.6, b: 'MODEL' }, { n: 'New-to-plan duals', m: '5,200', dw: .9, ow: 1.2, tw: 1.1, b: 'BENCH' }, { n: 'Polypharmacy + transport', m: '1,900', dw: .4, ow: 1.5, tw: 2.2, b: 'MODEL' }, { n: 'GLP-1 eligible', m: '9,800', dw: 1.1, ow: .9, tw: .5, b: 'PLAN' }, { n: 'Rest of book', m: '128,960', dw: 1.0, ow: 1.0, tw: .6, b: 'PLAN' },\n  ].map(r => s.act[r.n] ? { ...r, dw: 1, ow: 1, tw: 1, b: 'ACTUARY' } : r).map(r => { const d = sc.dental * .0021 * r.dw, o = sc.otc * .012 * r.ow, t = sc.rides * .04 * r.tw; return { ...r, basis: r.b, bCls: r.b === 'ACTUARY' ? 'b3' : r.b === 'MODEL' ? 'b2' : r.b === 'PLAN' ? 'b1' : 'b0', swapT: s.act[r.n] ? 'Restore' : 'Use my factor', swap: () => this.setState({ act: { ...s.act, [r.n]: !s.act[r.n] } }), d: m(d), o: m(o), t: m(t), ind: m(d + o + t), off: m(sc.rides * .11 * r.tw * .6 + sc.otc * .02 * r.ow * .5) }; });\n  const dB = Math.round((c.margin - 2.5) * 100);\n  return {\n    list: s.sc.map((x, i) => ({ ...x, margin: this.calc(x).margin.toFixed(2) + '%', cls: i === s.cur ? 'sel' : '', pick: () => this.setState({ cur: i }) })),\n    curName: sc.id + ' · ' + sc.name, curId: sc.id,\n    dental: sc.dental, dentalT: '$' + sc.dental.toLocaleString(), set_dental: set('dental'),\n    otc: sc.otc, otcT: '$' + sc.otc, set_otc: set('otc'),\n    rides: sc.rides, ridesT: sc.rides + ' rides', set_rides: set('rides'),\n    pbg: sc.pbg, pbgT: '$' + sc.pbg + '/mo', set_pbg: set('pbg'),\n    iu, benT: m(c.ben), indT: m(c.ind), offT: '−' + m(c.off).replace('−', ''), netT: m(c.net) + ' PMPM', rebT: m(-(c.ben - (2000 * .19 / 12 + 100 * 4 * .85 / 12 + 24 * 22 * .30 / 12))) + ' available',\n    marginT: c.margin.toFixed(2) + '%', mCls: c.margin >= 2.5 ? 'pos' : 'neg', dBps: (dB >= 0 ? '+' : '') + dB + ' bps',\n    tbcT: m(c.tbc), tbcS: Math.abs(c.tbc) \u003c= 36 ? 'within limit' : 'EXCEEDS · revise', tbcCls: Math.abs(c.tbc) \u003c= 36 ? 'pos' : 'rust',\n    sim: [['M-509118', 'Dual, 9 meds, transport-insecure', .4, 1.0, .6], ['M-469146', 'Mid-treatment: crown + implant planned', 3.2, .1, 2.4], ['M-306724', 'No dental claim in 3 years', .2, 0, .1], ['M-762213', 'New to plan, LTSS, no vehicle', .6, 1.8, .9], ['M-921549', 'Polypharmacy, rides to pharmacy', 1.1, 1.4, .7]].map(([id, st, dv, rdw, cw]) => {\n      const dd = (sc.dental - 2000) / 1000, dr = (sc.rides - 24) / 12;\n      const visits = Math.max(0, dv * (1 + .35 * dd * Math.min(1, dv))), rides = Math.max(0, rdw * sc.rides / 2);\n      const csd = Math.round(-dd * 420 * cw), pc = (dd * 9.5 * cw + dr * 3.1 * rdw);\n      return { id, st, dv: visits.toFixed(1), rd: rides.toFixed(0), cs: (csd > 0 ? '+$' : csd \u003c 0 ? '−$' : '$') + Math.abs(csd), pc: (pc > 0 ? '+$' : pc \u003c 0 ? '−$' : '$') + Math.abs(pc).toFixed(2), cls: pc > 0 ? 'neg' : pc \u003c 0 ? 'pos' : '' }; }),\n    turn: 4 + s.cur, dup: () => { const n = { ...sc, id: 'S-0' + (s.sc.length + 1), name: sc.name + ' (copy)', desc: 'duplicated · edit levers' }; this.setState({ sc: [...s.sc, n], cur: s.sc.length }); },\n    cmp: () => this.setState({ cmp: !s.cmp }), cmpOn: s.cmp, cmpT: s.cmp ? 'Hide comparison' : 'Compare side by side',\n  };\n}\n\n\n_nav() { const g = this.props.go, o = {}; [\"Main\", \"Ingest\", \"Pipeline\", \"Profiles\", \"Member\", \"Cohorts\", \"Forecast\", \"RxPipeline\", \"DxGap\", \"Scenarios\", \"Interventions\", \"Variance\", \"Bid\", \"Register\", \"Export\"].forEach(k => { o[k] = e => { if (g) { if (e && e.preventDefault) e.preventDefault(); g(k); } }; }); return o; }\nrenderVals() { const v = this._rv(), nav = this._nav(); if (v.cur && v.cur.href) { const k = v.cur.href.replace('.dc.html', ''); v.cur = { ...v.cur, go: nav[k] }; } return { ...v, nav }; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>", "Cohorts.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Cohorts\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;background:#F6F2EB;color:#0F2A24;font-size:14.5px;line-height:1.4}\na{color:#0E7C6B;text-decoration:none}a:hover{color:#0A5A4E}\n*{box-sizing:border-box}\n.serif{font-family:Fraunces,'Source Serif 4',Georgia,serif;font-weight:600}\n.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}\n.rail{width:240px;height:100%;background:#0F2A24;color:#F6F2EB;display:flex;flex-direction:column;padding:20px 0 16px;position:relative;flex-shrink:0}\n.logo{padding:0 20px 18px;border-bottom:1px solid rgba(246,242,235,.12)}\n.logo .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;letter-spacing:.02em;color:#F6F2EB;line-height:1}\n.logo .tag{font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:#7FE0C9;margin-top:6px}\n.steps{position:relative;padding:16px 0 0 20px;flex-grow:1}\n.steps .line{position:absolute;left:31px;top:38px;width:1px;height:440px;background:#7FE0C9;transform-origin:top;animation:flow 2s ease-out 1}\n@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n.step{display:flex;align-items:center;gap:12px;height:44px;color:rgba(246,242,235,.72);position:relative}\n.step:hover{color:#F6F2EB}\n.step .g{width:24px;height:24px;border-radius:12px;border:1px solid rgba(127,224,201,.55);background:#0F2A24;display:flex;align-items:center;justify-content:center;color:#7FE0C9;flex-shrink:0;position:relative;z-index:1}\n.step.done .g{background:# mpm: '$1,650', iv: '$1,400 – $2,000', bps: '+27 bps', usd: '$6.8M', basis: 'Bridge criteria (BMI, CV / renal indication) · no fill on record', owner: 'Pharmacy', sugg: false, why: 'Uptake ramp × 47% 12-month persistence. Bridge price $245 / $50 copay sits outside Part D; year-2 CV offsets modeled separately.', members: [{n:'M-469146',med:'$13.5K',iv:'$10–18K',ev:'RX·LAB·DX×3'},{n:'M-921549',med:'$11K',iv:'$9–15K',ev:'RX·SDOH'},{n:'M-261978',med:'$14K',iv:'$11–19K',ev:'DX×3'},{n:'M-264501',med:'$12K',iv:'$9–17K',ev:'LAB'}] },\n    { name: 'CKD 3b → 4 progression', n: '1,250', pmpm: '$3,300', iv: '$2,700 – $4,300', bps: '+14 bps', usd: '$3.5M', basis: 'eGFR slope ≤ −4 / yr, UACR rising, 2+ labs', owner: 'Care mgmt', sugg: false, why: 'Emergent dialysis starts are the tail; modality education and nephrology follow-up move the probability.', members: [{n:'M-509118',med:'$39K',iv:'$31–53K',ev:'LAB·RX'},{n:'M-676134',med:'$17K',iv:'$14–24K',ev:'LAB·RX'},{n:'M-507175',med:'$19K',iv:'$15–27K',ev:'LAB·SDOH'},{n:'M-414681',med:'$29K',iv:'$22–41K',ev:'LAB·DX×3'}] },\n    { name: 'New-to-plan duals (thin history)', n: '5,200', pmpm: '$2,050', iv: '$1,500 – $3,100', bps: '+19 bps', usd: '$4.8M', basis: 'MMP → D-SNP conversion Jan 2026 · \u003c 12 months claims', owner: 'Enrollment / HRA', sugg: false, why: 'Widest intervals in the book; state Medicaid LTSS history narrows them. First in line for HRA outreach.', members: [{n:'M-762213',med:'$52K',iv:'$38–70K',ev:'DX×1·LTSS'},{n:'M-118182',med:'$9.5K',iv:'$7–18K',ev:'DX×1'},{n:'M-759784',med:'$22K',iv:'$14–38K',ev:'DX×1·SDOH'},{n:'M-450116',med:'$91K',iv:'$64–128K',ev:'DX×3'}] },\n    { name: 'High-cost tail (> $100K)', n: '830', pmpm: '$15,800', iv: '$13,900 – $18,600', bps: '+61 bps', usd: '$15.4M', basis: 'P(annual cost > $100K) ≥ 40%', owner: 'Care mgmt', sugg: false, why: 'Where the filed forecast missed hardest in every backtest vintage.', members: [{n:'M-578458',med:'$82K',iv:'$55–118K',ev:'DX×1·LAB'},{n:'M-450116',med:'$91K',iv:'$64–128K',ev:'DX×3'},{n:'M-414681',med:'$104K',iv:'$78–140K',ev:'LAB·DX×3'},{n:'M-409429',med:'$68K',iv:'$63–75K',ev:'RX·LAB'}] },\n    { name: 'Polypharmacy ≥ 10 meds + transport-insecure ZIP', n: '1,900', pmpm: '$2,700', iv: '$2,200 – $3,500', bps: '+11 bps', usd: '$2.8M', basis: 'Found by the model: interaction of fill count and missed-care proxy', owner: 'Pharmacy', sugg: true, why: 'Not a cohort Meridian tracks today. Avoidable ED and adverse drug events cluster where both signals co-occur.', members: [{n:'M-921549',med:'$11K',iv:'$9–15K',ev:'RX·SDOH'},{n:'M-507175',med:'$19K',iv:'$15–27K',ev:'RX·SDOH'},{n:'M-509118',med:'$39K',iv:'$31–53K',ev:'RX·SDOH'},{n:'M-759784',med:'$22K',iv:'$14–38K',ev:'RX·SDOH'}] },\n  ];\n  const s = this.state;\n  const r = { cohorts: C.map((c, i) => ({ ...c, cls: 'click' + (i === s.c ? ' sel' : ''), pick: () => this.setState({ c: i }) })), show: s.c >= 0, cur: C[Math.max(0, s.c)], close: () => this.setState({ c: -1 }) };\n  for (let i = 0; i \u003c 7; i++) r['c' + i] = s.c === i;\n  const Y = [\n    { label: 'CY2028', note: 'Alzheimer\\'s DMT eligible members sit just under the line this year.', rows: [['High-cost tail (> $100K)', 61, 42, ''], ['High-cost specialty Rx', 52, 34, ''], ['New-to-plan duals', 19, 48, 'Material on uncertainty, not size: thin history'], ['LTSS ramp', 38, 32, ''], ['GLP-1 eligible, not started', 27, 22, ''], ['CKD 3b → 4', 14, 13, ''], ['Polypharmacy + transport-insecure', 11, 9, 'Model-suggested'], ['Alzheimer\\'s DMT eligible', 4, 6, 'Below threshold']] },\n    { label: 'CY2029', note: 'Two cohorts cross the line because of the Rx watchlist, not because of anything in the claims yet.', rows: [['High-cost tail (> $100K)', 64, 44, ''], ['High-cost specialty Rx', 55, 36, ''], ['GLP-1 eligible, not started', 33, 26, 'Indication expansion widens eligibility'], ['Alzheimer\\'s DMT eligible', 22, 30, 'NEW: label change to earlier-stage disease'], ['LTSS ramp', 36, 30, ''], ['Gene therapy eligible (6 members)', 9, 21, 'NEW: one launch, $3.2M exposure, few members'], ['CKD 3b → 4', 15, 13, ''], ['New-to-plan duals', 8, 14, 'Falls below: history now 24 months']] },\n    { label: 'CY2030', note: 'A pathway cohort appears: GLP-1 for sleep apnea brings sleep studies and specialist visits with it.', rows: [['High-cost tail (> $100K)', 66, 47, ''], ['High-cost specialty Rx', 58, 39, ''], ['GLP-1 eligible, not started', 36, 31, ''], ['Alzheimer\\'s DMT eligible', 29, 34, ''], ['GLP-1 for sleep apnea', 16, 19, 'NEW: induced sleep studies + specialist visits'], ['LTSS ramp', 35, 31, ''], ['Gene therapy eligible', 11, 23, ''], ['CKD 3b → 4', 15, 14, '']] },\n  ];\n  const yy = Y[s.y], W = 160;\n  r.years = Y.map((y, i) => ({ label: y.label, on: i === s.y ? 'on' : '', pick: () => this.setState({ y: i }) }));\n  r.yNote = yy.note;\n  r.mat = yy.rows.map(([n, c, u, why]) => { const surf = c >= 10 || u >= 15; const isNew = why.startsWith('NEW'); return { n, cT: '+' + c + ' bps', uT: '±' + u + ' bps', cw: (c / W * 100).toFixed(1) + '%', uw: (u / W * 100).toFixed(1) + '%', st: isNew ? 'newly material' : surf ? 'surfaced' : 'below line', sc: isNew ? 'amber' : surf ? 'mint' : '', why: why.replace('NEW: ', '') }; });\n  return r;\n}\n\n\n_nav() { const g = this.props.go, o = {}; [\"Main\", \"Ingest\", \"Pipeline\", \"Profiles\", \"Member\", \"Cohorts\", \"Forecast\", \"RxPipeline\", \"DxGap\", \"Scenarios\", \"Interventions\", \"Variance\", \"Bid\", \"Register\", \"Export\"].forEach(k => { o[k] = e => { if (g) { if (e && e.preventDefault) e.preventDefault(); g(k); } }; }); return o; }\nrenderVals() { const v = this._rv(), nav = this._nav(); if (v.cur && v.cur.href) { const k = v.cur.href.replace('.dc.html', ''); v.cur = { ...v.cur, go: nav[k] }; } return { ...v, nav }; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>", "Interventions.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Intervention studio\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;background:#F6F2EB;color:#0F2A24;font-size:14.5px;line-height:1.4}\na{color:#0E7C6B;text-decoration:none}a:hover{color:#0A5A4E}\n*{box-sizing:border-box}\n.serif{font-family:Fraunces,'Source Serif 4',Georgia,serif;font-weight:600}\n.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}\n.rail{width:240px;height:100%;background:#0F2A24;color:#F6F2EB;display:flex;flex-direction:column;padding:20px 0 16px;position:relative;flex-shrink:0}\n.logo{padding:0 20px 18px;border-bottom:1px solid rgba(246,242,235,.12)}\n.logo .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;letter-spacing:.02em;color:#F6F2EB;line-height:1}\n.logo .tag{font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:#7FE0C9;margin-top:6px}\n.steps{position:relative;padding:16px 0 0 20px;flex-grow:1}\n.steps .line{position:absolute;left:31px;top:38px;width:1px;height:440px;background:#7FE0C9;transform-origin:top;animation:flow 2s ease-out 1}\n@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n.step{display:flex;align-items:center;gap:12px;height:44px;color:rgba(246,242,235,.72);position:relative}\n.step:hover{color:#F6F2EB}\n.step .g{width:24px;height:24px;border-radius:12px;border:1px solid rgba(127,224,201,.55);background:#0F2A24;display:flex;align-items:center;justify-content:center;color:#7FE0C9;flex-shrink:0;position:relative;z-index:1}\n.step.done .g{background:#0A5A4E;border-color:#0A5A4E;color:#7FE0C9}\n.step.cur{color:#F6F2EB;font-weight:600}\n.step.cur .g{background:#7FE0C9;color:#0F2A24;border-color:#7FE0C9; style=\"font-size:13.5px;color:#5C6B68\">View:\u003c/span>\u003cbutton class=\"tab {{tabOps}}\" onClick=\"{{viewOps}}\">Operator\u003c/button>\u003cbutton class=\"tab {{tabAct}}\" onClick=\"{{viewAct}}\">What the actuary sees\u003c/button>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1fr) 420px;gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"ph\">\u003cspan>1 · Pick a program (selects its cohort)\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">library · cost, reach, effect, evidence, confidence\u003c/span>\u003c/div>\n      \u003ctable class=\"t\">\u003ctr>\u003cth>Program\u003c/th>\u003cth>Target cohort\u003c/th>\u003cth class=\"r\">Members\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth class=\"r\">Cost PMPM\u003c/th>\u003cth class=\"r\">Modeled effect\u003c/th>\u003cth class=\"r\">80% CI\u003c/th>\u003cth>Evidence\u003c/th>\u003cth class=\"r\">Default credit\u003c/th>\u003c/tr>\n      \u003csc-for list=\"{{progs}}\" as=\"p\" hint-placeholder-count=\"7\">\n        \u003ctr class=\"{{p.cls}}\" onClick=\"{{p.pick}}\">\u003ctd style=\"font-weight:500;white-space:normal;max-width:230px\">{{p.name}}\u003cdiv style=\"font-size:12.5px;font-weight:400;color:#5C6B68\">{{p.delivery}}\u003c/div>\u003c/td>\u003ctd style=\"font-size:13px\">{{p.cohort}}\u003c/td>\u003ctd class=\"num\">{{p.n}}\u003c/td>\u003ctd style=\"font-size:12.5px;color:#5C6B68;white-space:normal;max-width:240px\">{{p.mech}}\u003c/td>\u003ctd class=\"num\">{{p.costT}}\u003c/td>\u003ctd class=\"num {{p.ecls}}\" style=\"font-weight:600\">{{p.effT}}\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">{{p.ciT}}\u003c/td>\u003ctd>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;align-items:flex-start\">\u003cspan class=\"badge {{p.tCls}}\">TIER {{p.tier}}\u003c/span>\u003cspan class=\"origin {{p.oCls}}\">{{p.oShort}}\u003c/span>\u003c/div>\u003c/td>\u003ctd class=\"num\">{{p.capT}}\u003c/td>\u003c/tr>\n      \u003c/sc-for>\u003c/table>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);gap:16px\">\n      \u003cdiv class=\"panel sand\">\n        \u003cdiv class=\"ph\">2 · Set reach, engagement, adherence · {{cur.short}}\u003c/div>\n        \u003cdiv class=\"lever\">\u003clabel for=\"reach\">Reach · lower bound, used for credit\u003cspan>{{reachT}} \u003cspan style=\"color:#5C6B68\">(range {{reachR}})\u003c/span>\u003c/span>\u003c/label>\u003cinput id=\"reach\" type=\"range\" min=\"10\" max=\"100\" step=\"5\" value=\"{{reach}}\" onChange=\"{{set_reach}}\">\u003c/div>\n        \u003cdiv class=\"lever\">\u003clabel for=\"eng\">Engagement · lower bound, used for credit\u003cspan>{{engT}} \u003cspan style=\"color:#5C6B68\">(range {{engR}})\u003c/span>\u003c/span>\u003c/label>\u003cinput id=\"eng\" type=\"range\" min=\"10\" max=\"100\" step=\"5\" value=\"{{eng}}\" onChange=\"{{set_eng}}\">\u003c/div>\n        \u003cdiv class=\"lever\">\u003clabel for=\"adh\">Adherence at 12 months\u003cspan>{{adhT}}\u003c/span>\u003c/label>\u003cinput id=\"adh\" type=\"range\" min=\"10\" max=\"100\" step=\"5\" value=\"{{adh}}\" onChange=\"{{set_adh}}\">\u003c/div>\n        \u003cdiv class=\"lever\" style=\"border-top:1px solid #D9CFBF;padding-top:8px\">\u003clabel for=\"cred\">Credit in bid · share of modeled effect\u003cspan>{{credT}} \u003cspan style=\"color:#5C6B68\">(Tier {{cur.tier}} cap {{cur.capT}})\u003c/span>\u003c/span>\u003c/label>\u003cinput id=\"cred\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{cred}}\" onChange=\"{{set_cred}}\">\u003c/div>\n        \u003csc-if value=\"{{overCap}}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv style=\"font-size:13.5px;color:#B5482D;font-weight:500\">Above the Tier {{cur.tier}} cap of {{cur.capT}}. A warning is logged to the register; the certifying actuary must accept it.\u003c/div>\u003c/sc-if>\n        \u003cdiv class=\"note\">Credited = lower-bound reach × lower-bound engagement × median effect × credit. Widen any range and the credited value falls.\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"panel\">\n        \u003cdiv class=\"ph\">\u003cspan>3 · Model re-forecasts the cohort\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">statistical engine · not the agent\u003c/span>\u003c/div>\n        \u003cdiv class=\"kv\">\u003cspan class=\"k\">Gross medical impact\u003c/span>\u003cspan class=\"v pos\">{{grossT}}\u003c/span>\u003cspan class=\"k\">Program / vendor cost\u003c/span>\u003cspan class=\"v neg\">{{costT}} · admin expense unless QI-qualified\u003c/span>\u003cspan class=\"k\">Ramp\u003c/span>\u003cspan class=\"v\">{{cur.ramp}}\u003c/span>\u003cspan class=\"k\">Net, modeled\u003c/span>\u003cspan class=\"v\">{{netT}}\u003c/span>\u003cspan class=\"k\">80% interval\u003c/span>\u003cspan class=\"v\">{{ciT}}\u003c/span>\u003cspan class=\"k\">Credited in bid\u003c/span>\u003cspan class=\"v\" style=\"font-weight:600\">{{credNetT}}\u003c/span>\u003cspan class=\"k\">Upside, outside bid\u003c/span>\u003cspan class=\"v\">{{upT}}\u003c/span>\u003cspan class=\"k\">Cohort PMPM after\u003c/span>\u003cspan class=\"v\">{{pmpmT}}\u003c/span>\u003cspan class=\"k\">RAF accuracy\u003c/span>\u003cspan class=\"v\">{{rafT}}\u003c/span>\u003c/div>\n        \u003cdiv style=\"display:flex;gap:8px;align-items:center;margin-top:4px\">\u003cbutton class=\"btn sm\" onClick=\"{{commit}}\">Commit to bid as disclosed assumption\u003c/button>\u003cbutton class=\"btn ghost sm\" onClick=\"{{zero}}\">Zero it\u003c/button>\u003c/div>\n        \u003csc-if value=\"{{cur.committed}}\" hint-placeholder-val=\"{{ true }}\">\u003cspan class=\"commit\">{{cur.stamp}}\u003c/span>\u003c/sc-if>\n      \u003c/div>\n    \u003c/div>\n    \u003csc-if value=\"{{cur.agent}}\" hint-placeholder-val=\"{{ true }}\">\n    \u003cdiv class=\"panel ink\">\n      \u003cdiv class=\"ph\">\u003cspan>Agent transparency · {{cur.short}} · AI subtype only\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0;color:#7FE0C9\">required on every agent program\u003c/span>\u003c/div>\n      \u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr);gap:16px;font-size:13.5px\">\n        \u003cdiv>\u003cdiv class=\"ph\" style=\"margin-bottom:4px\">Sample transcript excerpt (fictional)\u003c/div>\u003cdiv class=\"mono\" style=\"font-size:12.5px;line-height:1.5;white-space:pre-line;color:#F6F2EB;opacity:.9\">{{cur.transcript}}\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"ph\" style=\"margin-bottom:4px\">Escalation &amp; operations\u003c/div>\u003cdiv class=\"kv\" style=\"color:#F6F2EB;grid-template-columns:110px 1fr\">\u003cspan class=\"k\" style=\"color:#7FE0C9\">Escalates to\u003c/span>\u003cspan>{{cur.esc}}\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Languages\u003c/span>\u003cspan>English · Spanish · Vietnamese · Haitian Creole\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Hours\u003c/span>\u003cspan>8a–8p member local · voicemail otherwise\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Consent / TCPA\u003c/span>\u003cspan>Prior express consent on file; opt-out honored on first request; call logs retained\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Review queue\u003c/span>\u003cspan>Every call summarized → nurse review within 24h · {{cur.queue}}\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"ph\" style=\"margin-bottom:4px\">What the agent never does\u003c/div>\u003cdiv style=\"line-height:1.6;color:#F6F2EB\">No diagnosis · No benefit or coverage decisions · No dollar figures · No PHI to third-party services outside the BAA · No clinical advice beyond scripted reminders · Discloses it is an automated assistant on every call\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003c/sc-if>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"ph\">\u003cspan>Waterfall · filed → second opinion → + credited\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">margin · MedEx view\u003c/span>\u003c/div>\n      \u003csvg width=\"380\" height=\"200\" viewBox=\"0 0 380 200\" style=\"display:block\">\n        \u003cline x1=\"30\" x2=\"370\" y1=\"170\" y2=\"170\" stroke=\"#5C6B68\" stroke-opacity=\".4\">\u003c/line>\n        \u003crect x=\"40\" y=\"{{wf.y1}}\" width=\"60\" height=\"{{wf.h1}}\" fill=\"#D99A2B\">\u003c/rect>\u003ctext x=\"70\" y=\"186\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">Filed 3.1%\u003c/text>\n        \u003crect x=\"120\" y=\"{{wf.y2}}\" width=\"60\" height=\"{{wf.h2}}\" fill=\"#0E7C6B\">\u003c/rect>\u003ctext x=\"150\" y=\"186\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">−60 bps\u003c/text>\n        \u003crect x=\"200\" y=\"{{wf.y3}}\" width=\"60\" height=\"{{wf.h3}}\" fill=\"#7FE0C9\">\u003c/rect>\u003ctext x=\"230\" y=\"186\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">{{wf.l3}}\u003c/text>\n        \u003crect x=\"280\" y=\"{{wf.y4}}\" width=\"60\" height=\"{{wf.h4}}\" fill=\"#0F2A24\">\u003c/rect>\u003ctext x=\"310\" y=\"186\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">{{wf.l4}}\u003c/text>\n        \u003ctext x=\"70\" y=\"{{wf.t1}}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0F2A24\" font-family=\"IBM Plex Mono,Menlo,monospace\">3.1%\u003c/text>\n        \u003ctext x=\"150\" y=\"{{wf.t2}}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0F2A24\" font-family=\"IBM Plex Mono,Menlo,monospace\">2.5%\u003c/text>\n        \u003ctext x=\"310\" y=\"{{wf.t4}}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0F2A24\" font-family=\"IBM Plex Mono,Menlo,monospace\">{{wf.l4b}}\u003c/text>\n      \u003c/svg>\n      \u003cdiv class=\"note\">Ties exactly to the \u003ca href=\"Bid.dc.html\" onClick=\"{{nav.Bid}}\">Bid comparison\u003c/a>: credited net = \u003cspan class=\"mono\">{{totT}}\u003c/span> ({{totUsd}}). Modeled {{modT}}; the rest is shown as upside outside the bid.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel sand\">\n      \u003cdiv class=\"ph\">\u003cspan>Program evidence card · {{cur.short}}\u003c/span>\u003cspan class=\"badge {{cur.tCls}}\">TIER {{cur.tier}}\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv\" style=\"grid-template-columns:120px minmax(0,1fr)\">\u003cspan class=\"k\">Effect estimate\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.ev.src}}\u003c/span>\u003cspan class=\"k\">Measured on\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.ev.pop}}\u003c/span>\u003cspan class=\"k\">How it differs\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.ev.diff}}\u003c/span>\u003cspan class=\"k\">Measured by\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.ev.who}} · {{cur.ev.date}}\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv\" style=\"grid-template-columns:120px minmax(0,1fr)\">\u003cspan class=\"k\">Origin\u003c/span>\u003cspan style=\"font-size:13.5px\">\u003cspan class=\"origin {{cur.oCls}}\">{{cur.oShort}}\u003c/span> {{cur.oText}}\u003c/span>\u003c/div>\n      \u003cdiv style=\"border-top:1px solid #D9CFBF;padding-top:8px;display:flex;flex-direction:column;gap:4px\">\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\">\u003cspan class=\"ph\" style=\"margin:0\">Operating commitment\u003c/span>\u003cspan class=\"stamp amber\" style=\"font-size:11px\">new workflow · not current practice\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv\" style=\"grid-template-columns:120px minmax(0,1fr)\">\u003cspan class=\"k\">Responsible\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.org}}\u003c/span>\u003cspan class=\"k\">Target\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.target}}\u003c/span>\u003cspan class=\"k\">Measured by\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.measure}}\u003c/span>\u003c/div>\u003c/div>\n      \u003csc-if value=\"{{cur.weak}}\" hint-placeholder-val=\"{{ true }}\">\u003cdiv style=\"font-size:13.5px;font-weight:600;color:#8a5f14\">{{cur.weakT}}\u003c/div>\u003c/sc-if>\n      \u003ca class=\"btn ghost sm\" href=\"Variance.dc.html\" onClick=\"{{nav.Variance}}\" style=\"align-self:flex-start\">After the bid locks · variance tracker \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\n    \u003c/div>\n    \u003csc-if value=\"{{isOps}}\" hint-placeholder-val=\"{{ true }}\">\n    \u003cdiv class=\"panel\" style=\"flex-grow:1\">\n      \u003cdiv class=\"ph\">\u003cspan>Committed to bid · {{nCommitted}} programs\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">tracked actual vs. assumed monthly\u003c/span>\u003c/div>\n      \u003ctable class=\"t\">\u003ctr>\u003cth>Program\u003c/th>\u003cth>Tier\u003c/th>\u003cth class=\"r\">Modeled\u003c/th>\u003cth class=\"r\">Credited\u003c/th>\u003cth>Reviewer\u003c/th>\u003c/tr>\n      \u003csc-for list=\"{{committed}}\" as=\"c\" hint-placeholder-count=\"6\">\u003ctr class=\"click\" onClick=\"{{c.pick}}\">\u003ctd style=\"white-space:normal\">{{c.short}}\u003c/td>\u003ctd>\u003cspan class=\"badge {{c.tCls}}\">{{c.tier}} · {{c.credT}}\u003c/span>\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">{{c.netT}}\u003c/td>\u003ctd class=\"num {{c.ecls}}\" style=\"font-weight:600\">{{c.cNetT}}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">{{c.rev}}\u003c/td>\u003c/tr>\u003c/sc-for>\n      \u003ctr>\u003ctd style=\"font-weight:600\">Credited to bid\u003c/td>\u003ctd>\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">{{modT}}\u003c/td>\u003ctd class=\"num pos\" style=\"font-weight:600\">{{totT}}\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n      \u003c/table>\n      \u003cdiv class=\"note\">Tier D programs (diagnosis confirmation) carry 0% in the bid and appear only as upside. Each credited program gets a monthly assumed-vs-observed line in the \u003ca href=\"Variance.dc.html\" onClick=\"{{nav.Variance}}\">Program variance tracker\u003c/a>.\u003c/div>\n    \u003c/div>\n    \u003c/sc-if>\n    \u003csc-if value=\"{{isAct}}\" hint-placeholder-val=\"{{ false }}\">\n    \u003cdiv class=\"panel sand\" style=\"flex-grow:1\">\n      \u003cdiv class=\"ph\">Assumption memo · lines as they appear in the desk-review pack\u003c/div>\n      \u003cdiv class=\"mono\" style=\"font-size:13px;line-height:1.7;white-space:pre-line\">{{memo}}\u003c/div>\n      \u003cdiv class=\"note\">Interventions are assumptions with evidence tiers and intervals, never guaranteed savings. The certifying actuary may haircut or zero any line; PMABI is an input to actuarial judgment.\u003c/div>\n    \u003c/div>\n    \u003c/sc-if>\n  \u003c/div>\n\u003c/div>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1400}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\n\nconstructor(p){ super(p);\n  const P = this.progs();\n  const CAP = { A: 80, B: 50, C: 25, D: 0 };\n  this.state = { cur: 2, view: 'ops', reach: 80, eng: 60, adh: 70, cred: 50, committed: P.map(p => ({ id: p.id, bps: p.base, reach: 80, eng: 60, adh: 70, cred: CAP[p.tier] })) };\n}\nprogs() { return [\n  { id: 'hra', \"delivery\": \"AI outreach agent · vendor\", \"origin\": \"vendor\", \"oText\": \"Vendor read-out applied as given\", \"ramp\": \"3 months to full reach\", \"org\": \"Enrollment team with the outreach vendor\", \"target\": \"HRA completion 80% by month 6\", \"measure\": \"HRA completion in the 834 cohort vs. a matched, not-yet-contacted group\", tier: 'C', ev: {\"src\": \"Vendor pilot, 2 plans, 6 months (n = 1,180)\", \"pop\": \"Dual-eligible MA members in two Southeast D-SNPs\", \"diff\": \"Shorter follow-up; no Haitian Creole calls in pilot\", \"who\": \"Vendor read-out\", \"date\": \"Jun 2026\"}, name: 'AI outreach agent: HRA and welcome calls', short: 'HRA agent · new-to-plan duals', cohort: 'New-to-plan duals', n: 5200, mech: 'Voice/text agent completes HRAs, confirms meds, identifies LTSS need early; warm-transfers to a nurse for clinical judgment; every call documented', cost: 4.10, base: -6, basis: 'HRA completion 35% → 80%; earlier LTSS staging', agent: true, rev: 'J. Alvarez', esc: 'RN care manager (warm transfer) · social worker for LTSS need', queue: '38 in queue', transcript: 'Agent: Hi, this is Meridian\\'s automated assistant calling about your health assessment — it\\'s okay to say stop at any time. Am I speaking with the member on file?\\nMember: Yes.\\nAgent: Thank you. I\\'ll ask a few questions about daily activities. Do you get help at home with bathing or dressing?\\nMember: My daughter helps, but she works now.\\nAgent: Understood — I\\'m noting that you may need more support at home. A nurse will call you within two days to talk through options. [flag: LTSS-need · escalate]' },\n  { id: 'glp', \"delivery\": \"AI outreach agent · vendor + pharmacy\", \"origin\": \"vendor\", \"oText\": \"Vendor pilot result applied as given\", \"ramp\": \"4 months\", \"org\": \"Pharmacy department with the outreach vendor\", \"target\": \"Persistence 58% at 12 months\", \"measure\": \"Proportion of days covered from PBM fills vs. matched non-contacted starters\", tier: 'C', ev: {\"src\": \"Vendor pilot, 9 months (n = 640 GLP-1 starters)\", \"pop\": \"Commercial + MA mix, one Midwest plan\", \"diff\": \"Mostly under-65; no Bridge pricing in effect\", \"who\": \"Vendor read-out\", \"date\": \"Apr 2026\"}, name: 'AI outreach agent: GLP-1 start and persistence', short: 'GLP-1 persistence agent', cohort: 'GLP-1 eligible + started', n: 9800, mech: 'Monthly check-ins on side effects, refills, titration; escalates to pharmacist; feeds persistence back into the Rx pipeline model', cost: 2.60, base: -4, basis: 'Persistence 47% → 58%; cost up year 1, avoided CV events net −4 bps in year 2', agent: true, rev: 'R. Patel, PharmD', esc: 'Pharmacist (side effects, titration) · PCP office for refills', queue: '112 in queue', transcript: 'Agent: This is Meridian\\'s automated check-in — say stop anytime. Since your last refill, have you had nausea that kept you from taking your dose?\\nMember: A little the first week.\\nAgent: That\\'s common early on. Your refill is due in 6 days; would a reminder text help?\\nMember: Yes.\\nAgent: Done. I\\'ve also noted the nausea for your pharmacist to review. [flag: side-effect · pharmacist review]' },\n  { id: 'dep', \"delivery\": \"Internal pharmacy team · agent schedules only\", \"origin\": \"derived\", \"oText\": \"From Meridian Rx evidence: adverse-drug-event ED visits in this cohort × share pharmacist review removes in published trials\", \"ramp\": \"6 months\", \"org\": \"Pharmacy department\", \"target\": \"70% of the cohort reviewed; 1.4 fewer medications each\", \"measure\": \"ED visits for adverse drug events vs. the cohort's own 2025 rate, trend-adjusted\", tier: 'B', ev: {\"src\": \"Published deprescribing RCTs + one peer MA plan\", \"pop\": \"MA members ≥10 meds, pharmacist-led review\", \"diff\": \"Peer plan had no transport-insecure targeting\", \"who\": \"Peer plan actuarial study\", \"date\": \"2025\"}, name: 'Polypharmacy deprescribing review', short: 'Deprescribing review', cohort: '≥10 meds + transport-insecure', n: 1900, mech: 'Pharmacist-led review, ranked and reason-coded from Rx evidence; agent schedules and reminds', cost: 6.80, base: -9, basis: 'Pilot read-out Q3 2027 (planned); literature ADE reduction', agent: true, rev: 'R. Patel, PharmD', esc: 'Pharmacist conducts the review; agent only schedules', queue: '17 in queue', transcript: 'Agent: Hello, this is Meridian\\'s automated scheduling assistant. Your pharmacist would like a 20-minute call to go over your medications. Would Tuesday at 10 or Thursday at 2 work?\\nMember: Thursday.\\nAgent: Thursday at 2, confirmed. I\\'ll text a reminder the day before. [no clinical content]' },\n  { id: 'ckd', \"delivery\": \"Existing kidney-care vendor\", \"origin\": \"derived\", \"oText\": \"From Meridian claims: avoidable ED visits and emergent dialysis starts in CKD 3b–4, × the share removed in two prior program cycles\", \"ramp\": \"2 months\", \"org\": \"Care management with the kidney-care vendor\", \"target\": \"No more than 3 emergent dialysis starts\", \"measure\": \"Emergent starts and ED visits vs. a matched non-enrolled group\", tier: 'A', ev: {\"src\": \"Meridian's own CKD care-management program, CY2024–CY2026\", \"pop\": \"Meridian CKD 3b–4 members vs. matched non-enrolled group\", \"diff\": \"Same plan, same cohort definition; scaled to 1,250 members\", \"who\": \"Meridian actuarial + clinical analytics\", \"date\": \"Feb 2027\"}, name: 'CKD progression program', short: 'CKD progression program', cohort: 'CKD 3b → 4', n: 1250, mech: 'Nephrology referral, home labs, dialysis-modality education before crash starts; agent handles scheduling and lab reminders', cost: 9.40, base: -5, basis: 'Fewer emergent dialysis starts; nephrology co-management evidence', agent: true, rev: 'Dr. K. Mbeki', esc: 'Nephrology nurse navigator', queue: '9 in queue', transcript: 'Agent: This is Meridian\\'s automated assistant with a reminder: your home kidney lab kit arrives Monday. Would you like the courier to call first?\\nMember: Yes please.\\nAgent: Noted. Your nephrology visit is March 4; a ride is booked. [flag: none]' },\n  { id: 'trn', \"delivery\": \"Internal care management · ride vendor\", \"origin\": \"derived\", \"oText\": \"From Meridian claims: missed-visit → ED linkage, 2024–26\", \"ramp\": \"2 months\", \"org\": \"Care management\", \"target\": \"Missed nephrology and PCP visits down 30%\", \"measure\": \"No-show rate and avoidable ED in target ZIPs vs. comparable ZIPs\", tier: 'C', ev: {\"src\": \"Meridian 2024–26 missed-visit → ED linkage; ride program pilot, 2 counties\", \"pop\": \"Meridian members in 2 of 11 counties\", \"diff\": \"Pilot counties more urban than the target ZIPs\", \"who\": \"Meridian care management\", \"date\": \"Nov 2026\"}, name: 'Transport and SDoH concierge', short: 'Transport concierge', cohort: 'Transport-insecure ZIPs', n: 3400, mech: 'Ride benefit routed by the agent to members projected to miss care; reduces avoidable ED', cost: 3.20, base: -3, basis: 'Missed-visit → ED linkage in Meridian claims 2024–26', agent: true, rev: 'M. Osei, RN', esc: 'Member services for benefit questions', queue: '24 in queue', transcript: 'Agent: Hi, this is Meridian\\'s automated ride assistant. You have a nephrology visit Thursday at 2. Would you like a ride booked?\\nMember: Yes.\\nAgent: Pickup at 1:15, confirmed. Reply STOP to end these messages.' },\n  { id: 'onc', \"delivery\": \"Existing navigation vendor\", \"origin\": \"vendor\", \"oText\": \"Vendor-asserted site-of-care savings\", \"ramp\": \"1 month\", \"org\": \"Oncology vendor\", \"target\": \"Site-of-care steering at least 55%\", \"measure\": \"Share of infusions at lower-cost sites, from claims\", tier: 'B', ev: {\"src\": \"Published navigation studies; site-of-care price differentials\", \"pop\": \"Medicare FFS and MA oncology patients\", \"diff\": \"Workup-in-progress targeting not studied directly\", \"who\": \"Literature review · PMABI\", \"date\": \"2026\"}, name: 'Oncology navigation', short: 'Oncology navigation', cohort: 'Workup-in-progress', n: 410, mech: 'Navigator assignment before first chemo claim; site-of-care steering', cost: 41.00, base: -4, basis: 'Site-of-care differential; navigator programs literature', agent: false, rev: 'Dr. A. Lindqvist', esc: '', queue: '', transcript: '' },\n  { id: 'dxc', \"delivery\": \"Clinic scheduling · AI agent books visits\", \"origin\": \"derived\", \"oText\": \"Model only: linked-encounter scheduling × confirmation rate; no observed outcomes\", \"ramp\": \"6 months\", \"org\": \"Risk adjustment team with clinics\", \"target\": \"2,000 linked encounters completed\", \"measure\": \"Confirmed diagnoses in linked encounters, clinician-attested\", tier: 'D', ev: {\"src\": \"Modeled only: linked-encounter scheduling × confirmation rate\", \"pop\": \"No observed outcomes yet\", \"diff\": \"New program under CY2027 source rules\", \"who\": \"PMABI model\", \"date\": \"—\"}, name: 'Diagnosis confirmation outreach', short: 'Dx confirmation · linked encounter', cohort: 'Payment-eligible suspected (2,900)', n: 2900, mech: 'Agent schedules the linked encounter (AWV or video) so the diagnosis is documented in a compliant source under CY2027 rules; clinician confirms', cost: 2.10, base: 9, basis: 'RAF +0.9% on affected members · revenue side of the bid', agent: true, rev: 'J. Alvarez', esc: 'Clinic scheduling desk; clinician confirms or rejects', queue: '61 in queue', transcript: 'Agent: This is Meridian\\'s automated assistant. Your annual wellness visit is due; your doctor has asked to see you by video or in person. Do you prefer video?\\nMember: In person.\\nAgent: I have March 12 at 9:30 at Harlan Family Medicine. Shall I book it?\\nMember: Yes.\\nAgent: Booked. [no diagnosis discussed]' },\n]; }\ncalc(p, reach, eng, adh) {\n  const f = (reach / 80) * (eng / 60) * (adh / 70);\n  const net = Math.round(p.base * f * 10) / 10;\n  const costBps = p.cost * p.n * 12 / 2.52e9 * 1e4;\n  return { net, gross: net - (p.base > 0 ? -costBps : costBps) * Math.sign(p.base), costBps, lo: Math.round(net * .45 * 10) / 10, hi: Math.round(net * 1.45 * 10) / 10 };\n}\n_rv() {\n  const s = this.state, P = this.progs(), CAP = { A: 80, B: 50, C: 25, D: 0 }, TC = { A: 'b3', B: 'b2', C: 'b1', D: 'b0' };\n  P.forEach(p => { p.oShort = p.origin === 'vendor' ? 'VENDOR-ASSERTED' : 'DERIVED · MERIDIAN DATA'; p.oCls = p.origin === 'vendor' ? '' : 'an'; p.cap = CAP[p.tier]; p.capT = CAP[p.tier] + '%'; p.tCls = TC[p.tier]; });\n  const cur = P[s.cur];\n  const sg = v => (v > 0 ? '+' : v \u003c 0 ? '−' : '') + Math.abs(v).toFixed(1) + ' bps';\n  const c = this.calc(cur, s.reach, s.eng, s.adh);\n  const cm = id => s.committed.find(x => x.id === id);\n  const progs = P.map((p, i) => { const k = this.calc(p, 80, 60, 70); return { ...p, cls: 'click' + (i === s.cur ? ' sel' : ''), pick: () => { const e = cm(p.id); this.setState({ cur: i, reach: e ? e.reach : 80, eng: e ? e.eng : 60, adh: e ? e.adh : 70, cred: e ? e.cred : p.cap }); }, n: p.n.toLocaleString(), costT: '$' + p.cost.toFixed(2), effT: sg(p.base), ecls: p.base \u003c 0 ? 'pos' : 'neg', ciT: sg(k.lo) + ' to ' + sg(k.hi) }; });\n  const committed = s.committed.map(e => { const p = P.find(x => x.id === e.id); const k = this.calc(p, e.reach, e.eng, e.adh); const cn = k.net * e.cred / 100; return { ...p, credT: e.cred + '%', cNet: cn, cNetT: sg(cn), ecls: cn \u003c 0 ? 'pos' : cn > 0 ? 'neg' : '', netT: sg(k.net), ecls: k.net \u003c 0 ? 'pos' : 'neg', ciT: sg(k.lo) + ' to ' + sg(k.hi), net: k.net, lo: k.lo, hi: k.hi, pick: () => { const i = P.findIndex(x => x.id === e.id); this.setState({ cur: i, reach: e.reach, eng: e.eng, adh: e.adh, cred: e.cred }); } }; });\n  // expense programs reduce cost (negative), dx confirmation adds revenue (positive): margin recovered = |expense| + revenue\n  const tot = committed.reduce((a, x) => a + Math.abs(x.cNet), 0), mod = committed.reduce((a, x) => a + Math.abs(x.net), 0);\n  const lo = committed.reduce((a, x) => a + Math.abs(x.lo), 0), hi = committed.reduce((a, x) => a + Math.abs(x.hi), 0);\n  const curC = cm(cur.id);\n  const curK = curC ? this.calc(cur, curC.reach, curC.eng, curC.adh) : null;\n  const H = 40, base = 170; // px per 1% margin\n  const m3 = 2.5 + tot / 100;\n  const wf = { y1: base - 3.1 * H, h1: 3.1 * H, y2: base - 3.1 * H, h2: .6 * H, y3: base - m3 * H, h3: tot / 100 * H, y4: base - m3 * H, h4: m3 * H, l3: '+' + tot.toFixed(0) + ' bps', l4: 'Result', l4b: m3.toFixed(1) + '%', t1: base - 3.1 * H - 6, t2: base - 2.5 * H - 6, t4: base - m3 * H - 6 };\n  const memo = committed.map(x => `${x.short} [Tier ${x.tier}]: modeled ${sg(x.net)}, credited ${x.credT} = ${sg(x.cNet)}, 80% interval ${sg(x.lo)} to ${sg(x.hi)}, reviewer: ${x.rev}`).join('\\n') + `\\n\\nCare-management offset credited (expense side): −${committed.filter(x => x.cNet \u003c 0).reduce((a, x) => a + Math.abs(x.cNet), 0).toFixed(1)} bps. Diagnosis confirmation (Tier D): 0 bps in bid; +${committed.filter(x => x.net > 0).reduce((a, x) => a + x.net, 0).toFixed(0)} bps shown as upside only. Modeled total +${mod.toFixed(0)} bps; credited +${tot.toFixed(0)} bps. All lines subject to actuarial haircut; none guaranteed.`;\n  const lv = k => e => this.setState({ [k]: +e.target.value });\n  return {\n    progs, committed, nCommitted: committed.length,\n    cur: { ...cur, committed: !!curC, weak: cur.tier === 'C' || cur.tier === 'D', weakT: cur.tier === 'D' ? 'Modeled only; no observed outcomes. 0% in the bid, shown as upside.' : 'Pilot evidence; not yet observed on this plan.', stamp: curC ? `COMMITTED · credited ${sg(curK.net * curC.cred / 100)} (Tier ${cur.tier} · ${curC.cred}%) · 80% CI ${sg(curK.lo)} to ${sg(curK.hi)} · reviewer: ${cur.rev}` : '' },\n    reach: s.reach, reachT: s.reach + '%', reachR: s.reach + '–' + Math.min(100, s.reach + 15) + '%', engR: s.eng + '–' + Math.min(100, s.eng + 15) + '%', cred: s.cred, credT: s.cred + '%', set_cred: lv('cred'), overCap: s.cred > cur.cap, credNetT: sg(c.net * s.cred / 100), upT: sg(c.net * (1 - s.cred / 100)), set_reach: lv('reach'), eng: s.eng, engT: s.eng + '%', set_eng: lv('eng'), adh: s.adh, adhT: s.adh + '%', set_adh: lv('adh'),\n    grossT: sg(cur.base \u003c 0 ? c.net - c.costBps : c.net + c.costBps), costT: '+' + c.costBps.toFixed(1) + ' bps ($' + cur.cost.toFixed(2) + ' PMPM)', netT: sg(c.net), ciT: sg(c.lo) + ' to ' + sg(c.hi),\n    pmpmT: cur.id === 'dxc' ? 'n/a · revenue' : '$' + Math.round(1525 * (1 + c.net / 100 / 4)).toLocaleString() + ' (cohort blended)', rafT: cur.id === 'dxc' ? '+0.9% on affected if confirmed' : cur.id === 'hra' ? 'improves (HRA + earlier dx capture)' : 'no change',\n    commit: () => { const rest = s.committed.filter(x => x.id !== cur.id); this.setState({ committed: [...rest, { id: cur.id, bps: c.net, reach: s.reach, eng: s.eng, adh: s.adh, cred: s.cred }] }); },\n    zero: () => this.setState({ committed: s.committed.filter(x => x.id !== cur.id) }),\n    wf, modT: '+' + mod.toFixed(0) + ' bps', totT: '+' + tot.toFixed(0) + ' bps', totUsd: '≈ $' + (tot * .252).toFixed(1) + 'M', totCi: '+' + lo.toFixed(0) + ' to +' + hi.toFixed(0),\n    isOps: s.view === 'ops', isAct: s.view === 'act', tabOps: s.view === 'ops' ? 'on' : '', tabAct: s.view === 'act' ? 'on' : '', viewOps: () => this.setState({ view: 'ops' }), viewAct: () => this.setState({ view: 'act' }), memo,\n  };\n}\n\n\n_nav() { const g = this.props.go, o = {}; [\"Main\", \"Ingest\", \"Pipeline\", \"Profiles\", \"Member\", \"Cohorts\", \"Forecast\", \"RxPipeline\", \"DxGap\", \"Scenarios\", \"Interventions\", \"Variance\", \"Bid\", \"Register\", \"Export\"].forEach(k => { o[k] = e => { if (g) { if (e && e.preventDefault) e.preventDefault(); g(k); } }; }); return o; }\nrenderVals() { const v = this._rv(), nav = this._nav(); if (v.cur && v.cur.href) { const k = v.cur.href.replace('.dc.html', ''); v.cur = { ...v.cur, go: nav[k] }; } return { ...v, nav }; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>", "Export.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Export to BPT\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;background:#F6F2EB;color:#0F2A24;font-size:14.5px;line-height:1.4}\na{color:#0E7C6B;text-decoration:none}a:hover{color:#0A5A4E}\n*{box-sizing:border-box}\n.serif{font-family:Fraunces,'Source Serif 4',Georgia,serif;font-weight:600}\n.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}\n.rail{width:240px;height:100%;background:#0F2A24;color:#F6F2EB;display:flex;flex-direction:column;padding:20px 0 16px;position:relative;flex-shrink:0}\n.logo{padding:0 20px 18px;border-bottom:1px solid rgba(246,242,235,.12)}\n.logo .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;letter-spacing:.02em;color:#F6F2EB;line-height:1}\n.logo .tag{font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:#7FE0C9;margin-top:6px}\n.steps{position:relative;padding:16px 0 0 20px;flex-grow:1}\n.steps .line{position:absolute;left:31px;top:38px;width:1px;height:440px;background:#7FE0C9;transform-origin:top;animation:flow 2s ease-out 1}\n@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n.step{display:flex;align-items:center;gap:12px;height:44px;color:rgba(246,242,235,.72);position:relative}\n.step:hover{color:#F6F2EB}\n.step .g{width:24px;height:24px;border-radius:12px;border:1px solid rgba(127,224,201,.55);background:#0F2A24;display:flex;align-items:center;justify-content:center;color:#7FE0C9;flex-shrink:0;position:relative;z-index:1}\n.step.done .g{background:#0A5A4E;border-color:#0A5A4E;color:#7FE0C9}\n.step.cur{color:#F6F2EB;font-weight:600}\n.step.cur .g{background:#7FE0C9;color:#0F2A24;border-color:#7FE0C9;box-shadow:0 0 0 5px rgba(127,224,201,.2 le=\"display:flex;gap:10px;align-items:center;white-space:nowrap\">\u003cspan style=\"font-weight:600\">Meridian Health Plan\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan>CY2028 bid\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan class=\"illus\">Illustrative · fictional plan, de-identified members\u003c/span>\u003cspan class=\"scope\">Scope · medical expense (Phase 1)\u003c/span>\u003c/div>\u003cdiv style=\"display:flex;gap:6px;align-items:center;white-space:nowrap\">\u003cspan class=\"stamp\">as of 12/31/26 · frozen 2/15/27\u003c/span>\u003cspan class=\"stamp\">v2.3.1 deterministic\u003c/span>\u003ca class=\"stamp\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">register r14 · #7f3ac91e\u003c/a>\u003ca class=\"stamp amber\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">sign-off 10/16\u003c/a>\u003ca class=\"stamp mint\" href=\"Ingest.dc.html\" onClick=\"{{nav.Ingest}}\" style=\"text-decoration:none\">GL gate · passed\u003c/a>\u003c/div>\u003c/div>\n\u003ca class=\"toplink\" href=\"Main.dc.html\" onClick=\"{{nav.Main}}\">Backtest\u003c/a>\n\u003ca class=\"toplink\" href=\"Pipeline.dc.html\" onClick=\"{{nav.Pipeline}}\">Architecture\u003c/a>\n\u003c/div>\n\u003cdiv class=\"content\">\n\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  \u003cdiv>\u003ch1 class=\"h1\">Rx pipeline\u003c/h1>\u003cdiv class=\"sub\">Launches, indication expansions and coverage decisions (public data only), each mapped to eligible members and priced as a care pathway: the drug, plus the visits, tests and follow-up it brings, minus the events it avoids. Click a signal for its pathway, price basis and eligible members.\u003c/div>\u003c/div>\n  \u003cdiv style=\"display:flex;gap:16px\">\u003cdiv class=\"panel\" style=\"padding:8px 14px\">\u003cdiv class=\"ph\">Watchlist · trend impact\u003c/div>\u003cdiv class=\"big s neg\">{{totBps}}\u003c/div>\u003c/div>\u003cdiv class=\"panel\" style=\"padding:8px 14px\">\u003cdiv class=\"ph\">Persistence assumption\u003c/div>\u003cdiv class=\"big s\">{{persT}}\u003c/div>\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1fr) 340px;gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Watchlist · CY2028 exposure\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click a signal → eligible members and ramp\u003c/span>\u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>Signal\u003c/th>\u003cth>Source (public)\u003c/th>\u003cth>Status\u003c/th>\u003cth class=\"r\">Eligible members\u003c/th>\u003cth class=\"r\">Uptake @12 mo\u003c/th>\u003cth class=\"r\">Part D phase\u003c/th>\u003cth>Price basis\u003c/th>\u003cth class=\"r\">Exposure\u003c/th>\u003cth class=\"r\">Trend bps\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{drugs}}\" as=\"d\" hint-placeholder-count=\"5\">\n      \u003ctr class=\"{{d.cls}}\" onClick=\"{{d.pick}}\">\u003ctd>\u003cspan style=\"font-weight:500\">{{d.name}}\u003c/span>\u003cdiv style=\"font-size:12.5px;color:#5C6B68\">{{d.kind}}\u003c/div>\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">{{d.src}}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">{{d.status}}\u003c/td>\u003ctd class=\"num\">{{d.n}}\u003c/td>\u003ctd class=\"num\">{{d.uptake}}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px;text-align:right\">{{d.phase}}\u003c/td>\u003ctd>\u003cspan class=\"origin {{d.pbCls}}\">{{d.pb}}\u003c/span>\u003c/td>\u003ctd class=\"num\">{{d.usd}}\u003c/td>\u003ctd class=\"num {{d.bcls}}\" style=\"font-weight:600\">{{d.bps}}\u003c/td>\u003c/tr>\n    \u003c/sc-for>\u003c/table>\n    \u003cdiv class=\"foot\">\u003cspan>We price the pipeline as it stands; we do not predict FDA approvals. GLP-1 Bridge (Jul 2026 – Dec 2027): $245 negotiated, $50 copay, outside the Part D benefit and payment flow; 2027 premiums return to the normal framework.\u003c/span>\u003cspan class=\"mono\">signals refreshed weekly · no PHI\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv class=\"panel sand\">\n      \u003cdiv class=\"ph\">Formulary / UM levers · repriced same-day\u003c/div>\n      \u003cdiv class=\"lever\">\u003clabel for=\"pa\">Prior-authorization strictness\u003cspan>{{paT}}\u003c/span>\u003c/label>\u003cinput id=\"pa\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{pa}}\" onChange=\"{{setPa}}\">\u003c/div>\n      \u003cdiv class=\"lever\">\u003clabel for=\"pe\">12-month persistence assumption\u003cspan>{{persT}}\u003c/span>\u003c/label>\u003cinput id=\"pe\" type=\"range\" min=\"30\" max=\"70\" step=\"1\" value=\"{{pers}}\" onChange=\"{{setPers}}\">\u003c/div>\n      \u003cdiv class=\"lever\">\u003clabel for=\"st\">Step therapy on indication expansions\u003cspan>{{stT}}\u003c/span>\u003c/label>\u003cinput id=\"st\" type=\"range\" min=\"0\" max=\"1\" step=\"1\" value=\"{{st}}\" onChange=\"{{setSt}}\">\u003c/div>\n      \u003cdiv class=\"kv\" style=\"margin-top:6px\">\u003cspan class=\"k\">Watchlist impact\u003c/span>\u003cspan class=\"v\">{{totBps}}\u003c/span>\u003cspan class=\"k\">vs. default levers\u003c/span>\u003cspan class=\"v\">{{deltaT}}\u003c/span>\u003cspan class=\"k\">Induced-util. disclosed\u003c/span>\u003cspan class=\"v\">per cohort · \u003ca href=\"Scenarios.dc.html\" onClick=\"{{nav.Scenarios}}\">workbench\u003c/a>\u003c/span>\u003c/div>\n      \u003cdiv class=\"note\">Every lever is visible and overridable; the engine reprices the eligible cohort, not a blended factor.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Part D phase · CY2028 assumption\u003c/div>\u003cdiv class=\"kv\">\u003cspan class=\"k\">OOP cap\u003c/span>\u003cspan class=\"v\">$2,400 (2027) · [CY2028 per Final Notice]\u003c/span>\u003cspan class=\"k\">Plan liability\u003c/span>\u003cspan class=\"v\">concentrated in catastrophic phase\u003c/span>\u003cspan class=\"k\">Members projected to reach cap\u003c/span>\u003cspan class=\"v\">11,240 · 80% 9,900 – 12,700\u003c/span>\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003csc-if value=\"{{show}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv class=\"drill\" style=\"width:520px\">\n  \u003cdiv class=\"dh\">\u003cdiv>\u003cdiv class=\"ph\">{{cur.kind}}\u003c/div>\u003cdiv class=\"dt\">{{cur.name}}\u003c/div>\u003c/div>\u003cbutton class=\"xbtn\" aria-label=\"Close\" onClick=\"{{close}}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cspan class=\"k\">Signal source\u003c/span>\u003cspan class=\"v\">{{cur.src}}\u003c/span>\u003cspan class=\"k\">Agent reason code\u003c/span>\u003cspan class=\"v\">{{cur.rc}}\u003c/span>\u003cspan class=\"k\">Eligibility criteria\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.crit}}\u003c/span>\u003cspan class=\"k\">Trend impact\u003c/span>\u003cspan class=\"v\">{{cur.bps}} · {{cur.usd}} · 80% {{cur.iv}}\u003c/span>\u003c/div>\n  \u003cdiv class=\"ph\">Care-pathway cost · what the eligible cohort adds, bps\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Component\u003c/th>\u003cth>Type\u003c/th>\u003cth class=\"r\">bps\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{cur.epRows}}\" as=\"x\" hint-placeholder-count=\"5\">\u003ctr>\u003ctd>{{x.n}}\u003c/td>\u003ctd style=\"font-size:13px;color:#5C6B68\">{{x.t}}\u003c/td>\u003ctd class=\"num {{x.cls}}\">{{x.vT}}\u003c/td>\u003c/tr>\u003c/sc-for>\n    \u003ctr>\u003ctd style=\"font-weight:600\">Pathway total\u003c/td>\u003ctd>\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">{{cur.epTot}}\u003c/td>\u003c/tr>\n  \u003c/table>\n  \u003cdiv class=\"ph\">Price assumption · {{cur.nt.conf}} confidence\u003c/div>\n  \u003cdiv class=\"kv\">\u003cspan class=\"k\">Basis\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.nt.basis}}\u003c/span>\u003cspan class=\"k\">Comparable class\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.nt.cls}}\u003c/span>\u003cspan class=\"k\">List / expected net\u003c/span>\u003cspan class=\"v\">{{cur.nt.price}}\u003c/span>\u003cspan class=\"k\">Range\u003c/span>\u003cspan class=\"v\">{{cur.nt.range}}\u003c/span>\u003cspan class=\"k\">Source\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.nt.src}}\u003c/span>\u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px;align-items:center\">\u003clabel for=\"ovp\" style=\"font-size:13.5px;color:#5C6B68\">Plan override, net per year\u003c/label>\u003cinput id=\"ovp\" type=\"text\" placeholder=\"{{cur.nt.ph}}\" style=\"width:130px;font-family:'IBM Plex Mono',Menlo,monospace;font-size:13px;border:1px solid #5C6B68;border-radius:3px;padding:4px 6px\">\u003cspan class=\"note\">logged to the register\u003c/span>\u003c/div>\n  \u003cdiv class=\"ph\">Uptake ramp × persistence\u003c/div>\n  \u003csvg width=\"440\" height=\"140\" viewBox=\"0 0 440 140\" style=\"display:block\">\n\u003cline x1=\"36\" x2=\"430\" y1=\"120\" y2=\"120\" stroke=\"#5C6B68\" stroke-opacity=\".4\">\u003c/line>\u003cline x1=\"36\" x2=\"36\" y1=\"8\" y2=\"120\" stroke=\"#5C6B68\" stroke-opacity=\".4\">\u003c/line>\n\u003ctext x=\"6\" y=\"14\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">100%\u003c/text>\u003ctext x=\"14\" y=\"122\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">0\u003c/text>\n\u003cpath d=\"M36 120 C 90 110, 130 70, 200 48 S 340 28, 430 26\" fill=\"none\" stroke=\"#0E7C6B\" stroke-width=\"2\">\u003c/path>\n\u003cpath d=\"M36 8 C 100 10, 150 50, 220 66 S 360 66, 430 68\" fill=\"none\" stroke=\"#D99A2B\" stroke-width=\"2\" stroke-dasharray=\"5 3\">\u003c/path>\n\u003ctext x=\"250\" y=\"42\" font-size=\"10\" fill=\"#0A5A4E\" font-family=\"IBM Plex Mono,Menlo,monospace\">uptake (cumulative starts)\u003c/text>\n\u003ctext x=\"250\" y=\"86\" font-size=\"10\" fill=\"#8a5f14\" font-family=\"IBM Plex Mono,Menlo,monospace\">persistence · 47% at 12 mo\u003c/text>\n\u003ctext x=\"36\" y=\"134\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">m0\u003c/text>\u003ctext x=\"230\" y=\"134\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">m12\u003c/text>\u003ctext x=\"416\" y=\"134\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">m24\u003c/text>\n\u003c/svg>\n  \u003cdiv class=\"ph\">Eligible members · highest projected effect (fictional)\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Member\u003c/th>\u003cth class=\"r\">P(start)\u003c/th>\u003cth class=\"r\">Δ cost if persists\u003c/th>\u003cth>Evidence\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{cur.members}}\" as=\"m\" hint-placeholder-count=\"4\">\u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">{{m.n}}\u003c/a>\u003c/td>\u003ctd class=\"num\">{{m.p}}\u003c/td>\u003ctd class=\"num\">{{m.d}}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12px\">{{m.ev}}\u003c/td>\u003c/tr>\u003c/sc-for>\n  \u003c/table>\n  \u003cdiv class=\"note\">Clinical criteria applied to member profiles produce an auditable, member-level eligible cohort per drug and indication. Your actuaries can inspect exactly who is in — and why.\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1280}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\n\nconstructor(p){ super(p); this.state = { d: -1, pa: 40, pers: 47, st: 0 }; }\n_rv() {\n  const s = this.state;\n  const D = [\n    { name: 'GLP-1 · heart-failure (HFpEF) indication expansion', kind: 'indication expansion', src: 'FDA label · Q3 2026', status: 'approved', n: 4100, uptake: .22, phase: 'Bridge → Part D 2028', base: 12, ep: [['Drug, net of rebates', 11.0, 'drug'], ['PCP and cardiology visits', 1.4, 'induced'], ['Endocrinology and nutrition support', 0.8, 'induced'], ['Monitoring labs', 0.3, 'induced'], ['Heart-failure admissions avoided', -1.5, 'avoided']], nt: { basis: 'Observed: Meridian GLP-1 net cost, 2024–26', cls: 'GLP-1 receptor agonists', price: '$5,400 / yr expected net', range: '$4,300 – $6,900', conf: 'medium', src: 'Meridian PBM history; Bridge $245/mo through Dec 2027, Part D from 2028', ph: '$5,400' }, pb: 'observed', pbCls: 'an', rc: 'RC-SIG-GLP-03', crit: 'BMI ≥ 30 with HFpEF diagnosis on ≥2 claims; no GLP-1 fill in 24 mo.', iv: '+8 to +17 bps', members: [{n:'M-469146',p:'61%',d:'+$4.2K',ev:'RX·LAB·DX×3'},{n:'M-261978',p:'48%',d:'+$4.0K',ev:'DX×3'},{n:'M-921549',p:'44%',d:'+$3.9K',ev:'RX·SDOH'},{n:'M-264501',p:'37%',d:'+$3.8K',ev:'LAB'}] },\n    { name: 'GLP-1 · CKD indication expansion', kind: 'indication expansion', src: 'FDA label · Q1 2027 (pending)', status: 'tracking', n: 2900, uptake: .18, phase: 'Bridge → Part D 2028', base: 9, ep: [['Drug, net of rebates', 8.2, 'drug'], ['Nephrology and endocrinology visits', 0.9, 'induced'], ['Nutrition support', 0.4, 'induced'], ['eGFR / UACR monitoring', 0.3, 'induced'], ['Dialysis starts avoided', -0.8, 'avoided']], nt: { basis: 'Observed class cost, new indication', cls: 'GLP-1 receptor agonists', price: '$5,400 / yr expected net', range: '$4,300 – $6,900', conf: 'medium', src: 'Meridian PBM history; label pending, approval not assumed beyond the watchlist probability', ph: '$5,400' }, pb: 'observed', pbCls: 'an', rc: 'RC-SIG-GLP-04', crit: 'T2DM with CKD 3a–4 (eGFR 15–59) and UACR ≥ 30.', iv: '+5 to +13 bps', members: [{n:'M-509118',p:'34%',d:'+$3.6K',ev:'RX·LAB'},{n:'M-676134',p:'52%',d:'+$3.9K',ev:'LAB·RX'},{n:'M-507175',p:'41%',d:'+$3.7K',ev:'LAB·SDOH'},{n:'M-414681',p:'29%',d:'+$3.5K',ev:'LAB·DX×3'}] },\n    { name: 'Alzheimer\\'s DMT · maintenance-dosing label change', kind: 'label change · Part B infusion', src: 'FDA label · CMS NCD', status: 'approved', n: 620, uptake: .15, phase: 'Part B', base: 6, ep: [['Infusion drug (Part B)', 3.6, 'drug'], ['Infusion administration', 0.9, 'induced'], ['MRI monitoring for ARIA', 1.0, 'induced'], ['Amyloid PET / biomarker testing', 0.7, 'induced'], ['Neurology visits', 0.4, 'induced'], ['LTSS onset delayed', -0.6, 'avoided']], nt: { basis: 'No mature experience: priced from a market basket', cls: 'Anti-amyloid monoclonal antibodies (2 products)', price: '$26,500 WAC · $24,000 expected net', range: '$19,000 – $28,000', conf: 'low', src: 'Public WAC, CMS NCD coverage-with-evidence, ASP files', ph: '$24,000' }, pb: 'market basket', pbCls: '', rc: 'RC-SIG-ADT-02', crit: 'MCI or mild dementia dx with confirmed amyloid status; infusion-capable site within 40 mi.', iv: '+3 to +9 bps', members: [{n:'M-306724',p:'22%',d:'+$26K',ev:'DX×3'},{n:'M-762213',p:'9%',d:'+$26K',ev:'DX×1'},{n:'M-761647',p:'18%',d:'+$26K',ev:'DX×3'}] },\n    { name: 'Biosimilar entry · anti-IL-12/23 class', kind: 'biosimilar · cost-reducing', src: 'FDA approval · launch Q2 2027', status: 'approved', n: 1140, uptake: .55, phase: 'catastrophic', base: -4, ep: [['Drug, switch to biosimilar', -4.2, 'drug'], ['Switching visit', 0.2, 'induced']], nt: { basis: 'Comparable: reference product net cost', cls: 'Anti-IL-12/23 biologics', price: 'reference $38,000 net · biosimilar 35–55% lower', range: '$17,000 – $25,000', conf: 'medium', src: 'Meridian PBM history for the reference product; launch pricing announcements', ph: '$21,000' }, pb: 'comparable', pbCls: 'an', rc: 'RC-SIG-BIO-07', crit: 'Active fills of reference product; formulary preference assumed.', iv: '−2 to −6 bps', members: [{n:'M-730250',p:'70%',d:'−$9.1K',ev:'RX·DX×3'},{n:'M-409429',p:'66%',d:'−$9.1K',ev:'RX·LAB'},{n:'M-388829',p:'58%',d:'−$9.1K',ev:'RX'}] },\n    { name: 'Gene therapy · single-administration (6 eligible)', kind: 'launch · one-time high cost', src: 'FDA approval · 2025', status: 'covered', n: 6, uptake: .33, phase: 'Part B / inpatient', base: 13, ep: [['One-time therapy', 11.8, 'drug'], ['Pre-treatment workup and inpatient conditioning', 1.6, 'induced'], ['Long-term follow-up', 0.4, 'induced'], ['Crisis admissions avoided', -0.8, 'avoided']], nt: { basis: 'No experience: outcomes-based agreement assumed', cls: 'Single-administration gene therapies', price: '$2.2M list · $1.9M expected net with warranty', range: '$1.6M – $2.3M', conf: 'low', src: 'Public list price; CMS cell and gene therapy access model terms', ph: '$1,900,000' }, pb: 'market basket', pbCls: '', rc: 'RC-SIG-CGT-01', crit: 'Confirmed genotype and severity criteria; transplant-ineligible.', iv: '+4 to +26 bps', members: [{n:'[member 1 of 6]',p:'40%',d:'+$2.1M',ev:'DX×3·LAB'},{n:'[member 2 of 6]',p:'35%',d:'+$2.1M',ev:'DX×3'},{n:'[member 3 of 6]',p:'30%',d:'+$2.1M',ev:'DX×3'}] },\n  ];\n  const paF = 1 - .5 * (s.pa / 100), persF = s.pers / 47, stF = s.st ? .85 : 1;\n  let tot = 0;\n  const def0 = D.reduce((a, d) => a + (d.base \u003c 0 ? d.base : d.base * .8), 0);\n  const drugs = D.map((d, i) => {\n    const adj = d.base \u003c 0 ? d.base : d.base * paF * persF * (d.kind.includes('indication') ? stF : 1);\n    tot += adj;\n    const usd = Math.round(Math.abs(adj) * 0.252 * 10) / 10;\n    const epRows = d.ep.map(([n, v, t]) => ({ n, t, vT: (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1), cls: v \u003c 0 ? 'pos' : '' }));\n    return { ...d, epRows, epTot: (d.base >= 0 ? '+' : '−') + Math.abs(d.base).toFixed(1) + ' at default levers', cls: 'click' + (i === s.d ? ' sel' : ''), pick: () => this.setState({ d: i }), n: d.n.toLocaleString(), uptake: Math.round(d.uptake * 100) + '%', bps: (adj >= 0 ? '+' : '−') + Math.abs(adj).toFixed(1), bcls: adj >= 0 ? 'neg' : 'pos', usd: (adj >= 0 ? '+' : '−') + '$' + usd + 'M' };\n  });\n  const sg = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) +
