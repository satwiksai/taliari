\u003c/div>\n\u003cdiv class=\"roadmap\">\u003cb>Next modules\u003c/b>Revenue + admin engines at full depth (Phase 2) · MedEx engine reused for ACO / VBC · employer benefit simulation\u003c/div>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003cdiv class=\"top\">\n\u003cdiv class=\"crumbs\" style=\"flex-direction:column;align-items:flex-start;gap:5px;justify-content:center;min-width:0\">\u003cdiv style=\"display:flex;gap:10px;align-items:center;white-space:nowrap\">\u003cspan style=\"font-weight:600\">Meridian Health Plan\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan>CY2028 bid\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan class=\"illus\">Illustrative · fictional plan, de-identified members\u003c/span>\u003cspan class=\"scope\">Scope · medical expense (Phase 1)\u003c/span>\u003c/div>\u003cdiv style=\"display:flex;gap:6px;align-items:center;white-space:nowrap\">\u003cspan class=\"stamp\">as of 12/31/26 · frozen 2/15/27\u003c/span>\u003cspan class=\"stamp\">v2.3.1 deterministic\u003c/span>\u003ca class=\"stamp\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">register r14 · #7f3ac91e\u003c/a>\u003ca class=\"stamp amber\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">sign-off 10/16\u003c/a>\u003ca class=\"stamp mint\" href=\"Ingest.dc.html\" onClick=\"{{nav.Ingest}}\" style=\"text-decoration:none\">GL gate · passed\u003c/a>\u003c/div>\u003c/div>\n\u003ca class=\"toplink\" href=\"Main.dc.html\" onClick=\"{{nav.Main}}\">Backtest\u003c/a>\n\u003ca class=\"toplink\" href=\"Pipeline.dc.html\" onClick=\"{{nav.Pipeline}}\">Architecture\u003c/a>\n\u003c/div>\n\u003cdiv class=\"content\">\n\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  \u003cdiv>\u003ch1 class=\"h1\">Member-month profiles\u003c/h1>\u003cdiv class=\"sub\">The member-month state the whole forecast is built from. Each member's CY2028 cost is a distribution, never a point. Thin or missing history widens the range rather than making a member look healthy: no evidence of disease is not evidence of no disease.\u003c/div>\u003c/div>\n  \u003cdiv class=\"legend\">\u003cspan>Range bar:\u003c/span>\u003cspan>\u003ci style=\"background:#0E7C6B;opacity:.18\">\u003c/i>95%\u003c/span>\u003cspan>\u003ci style=\"background:#0E7C6B;opacity:.35\">\u003c/i>80%\u003c/span>\u003cspan>\u003ci style=\"background:#0E7C6B;opacity:.6\">\u003c/i>50%\u003c/span>\u003cspan>\u003ci style=\"background:#0F2A24;width:2px\">\u003c/i>median\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1fr) 380px;gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv style=\"display:flex;gap:12px;align-items:center\">\n      \u003clabel for=\"q\" style=\"display:flex;align-items:center;gap:8px;border:1px solid #5C6B68;border-radius:4px;padding:0 10px;height:34px;flex-grow:1;background:#FFFFFF\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\">\u003c/circle>\u003cpath d=\"M20 20l-3.5-3.5\">\u003c/path>\u003c/svg>\u003cinput id=\"q\" type=\"text\" placeholder=\"Search member ID, cohort, condition\" value=\"{{q}}\" onChange=\"{{setQ}}\" style=\"border:none;outline:none;font-family:inherit;font-size:14.5px;flex-grow:1;background:transparent;color:#0F2A24\">\u003c/label>\n      \u003cspan class=\"mono\" style=\"font-size:12.5px;color:#5C6B68\">showing {{n}} of 148,000 · sorted by projected median\u003c/span>\n    \u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>Member ID\u003c/th>\u003cth>Age\u003c/th>\u003cth>Dual\u003c/th>\u003cth>History\u003c/th>\u003cth>Cohorts\u003c/th>\u003cth style=\"width:160px\">Projected CY2028 cost · 95 / 80 / 50%\u003c/th>\u003cth class=\"r\">Median\u003c/th>\u003cth>Confidence\u003c/th>\u003cth>Evidence\u003c/th>\u003cth>\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{rows}}\" as=\"m\" hint-placeholder-count=\"8\">\n      \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\" style=\"font-weight:500;color:#0F2A24;text-decoration:underline dotted\">{{m.name}}\u003c/a>\u003c/td>\u003ctd class=\"mono\">{{m.as}}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">{{m.dual}}\u003c/td>\u003ctd style=\"white-space:nowrap\">\u003cspan class=\"mono\" style=\"font-size:12.5px\">{{m.histT}}\u003c/span>\u003csc-if value=\"{{m.isNew}}\" hint-placeholder-val=\"{{ false }}\"> \u003cspan class=\"badge\" style=\"border-color:#B5482D;color:#B5482D\">NEW\u003c/span>\u003c/sc-if>\u003c/td>\u003ctd style=\"font-size:13px;color:#5C6B68;white-space:normal\">{{m.coh}}\u003c/td>\u003ctd>\u003csvg width=\"150\" height=\"14\" viewBox=\"0 0 150 14\" style=\"display:block\">\u003crect x=\"{{m.x95}}\" y=\"4\" width=\"{{m.w95}}\" height=\"6\" fill=\"#0E7C6B\" fill-opacity=\".18\">\u003c/rect>\u003crect x=\"{{m.x80}}\" y=\"3\" width=\"{{m.w80}}\" height=\"8\" fill=\"#0E7C6B\" fill-opacity=\".35\">\u003c/rect>\u003crect x=\"{{m.x50}}\" y=\"2\" width=\"{{m.w50}}\" height=\"10\" fill=\"#0E7C6B\" fill-opacity=\".6\">\u003c/rect>\u003crect x=\"{{m.mx}}\" y=\"0\" width=\"2\" height=\"14\" fill=\"#0F2A24\">\u003c/rect>\u003c/svg>\u003cdiv style=\"display:flex;justify-content:space-between;font-size:10.5px;color:#5C6B68\" class=\"mono\">\u003cspan>{{m.loT}}\u003c/span>\u003cspan>{{m.hiT}}\u003c/span>\u003c/div>\u003c/td>\u003ctd class=\"num\">{{m.medT}}\u003c/td>\u003ctd>\u003cspan class=\"tier\" style=\"color:{{m.tierCol}}\">{{m.tierT}}\u003c/span>\u003c/td>\u003ctd>\u003cdiv style=\"display:flex;gap:4px\">\u003csc-for list=\"{{m.badges}}\" as=\"b\" hint-placeholder-count=\"3\">\u003cspan class=\"badge b{{b.s}}\">{{b.l}}\u003c/span>\u003c/sc-for>\u003c/div>\u003c/td>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\" aria-label=\"Open profile\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/td>\u003c/tr>\n    \u003c/sc-for>\u003c/table>\n    \u003cdiv class=\"foot\">\u003cspan>Click a member → evidence chain. Cohort labels describe clinical or benefit status, never demographics.\u003c/span>\u003cspan class=\"mono\">scale $0 – $150K\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv class=\"panel sand\">\u003cdiv class=\"ph\">Confidence follows evidence\u003c/div>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:6px\">\u003cspan class=\"badge b3\">RX\u003c/span> \u003cspan class=\"badge b3\">LAB\u003c/span> \u003cspan class=\"badge b2\">DX×3\u003c/span> \u003cspan class=\"badge b1\">DX×1\u003c/span> \u003cspan class=\"badge b0\">SDOH\u003c/span>\u003c/div>\n      \u003cdiv class=\"note\">Badge fill darkens with evidence strength. Pharmacy fills are the most honest data a plan has; labs add the most; a single diagnosis on one claim earns the least.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Confidence tiers · book\u003c/div>\n      \u003ctable class=\"t\">\u003ctr>\u003cth>Tier\u003c/th>\u003cth class=\"r\">Members\u003c/th>\u003cth class=\"r\">Share\u003c/th>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"tier\" style=\"color:#0A5A4E\">HIGH\u003c/span> · Rx + labs\u003c/td>\u003ctd class=\"num\">71,040\u003c/td>\u003ctd class=\"num\">48%\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"tier\" style=\"color:#8a5f14\">MED\u003c/span> · repeated dx\u003c/td>\u003ctd class=\"num\">55,500\u003c/td>\u003ctd class=\"num\">37.5%\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"tier\" style=\"color:#B5482D\">LOW\u003c/span> · thin history\u003c/td>\u003ctd class=\"num\">21,460\u003c/td>\u003ctd class=\"num\">14.5%\u003c/td>\u003c/tr>\n      \u003c/table>\n      \u003cdiv class=\"note\">Low-tier members widen their interval rather than shrink it, and are first in line for HRA outreach.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">New-member pathway · 5,200 members\u003c/div>\n      \u003cdiv class=\"note\" style=\"color:#0F2A24\">Under 12 months of claims, so the forecast switches method: prior-plan HCCs from the MA risk-score history, state Medicaid LTSS records and any HRA or in-home assessment. Intervals widen with each missing source.\u003c/div>\n      \u003ctable class=\"t\">\u003ctr>\u003cth>Signal available\u003c/th>\u003cth class=\"r\">Members\u003c/th>\u003cth class=\"r\">80% width\u003c/th>\u003c/tr>\n        \u003ctr>\u003ctd>Prior HCCs + LTSS + HRA\u003c/td>\u003ctd class=\"num\">1,460\u003c/td>\u003ctd class=\"num\">±24%\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Prior HCCs only\u003c/td>\u003ctd class=\"num\">2,910\u003c/td>\u003ctd class=\"num\">±41%\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Nothing yet\u003c/td>\u003ctd class=\"num\">830\u003c/td>\u003ctd class=\"num\">±68%\u003c/td>\u003c/tr>\u003c/table>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">\u003cspan>Chart-chase priority\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">value of information\u003c/span>\u003c/div>\n      \u003ctable class=\"t\">\u003ctr>\u003cth>Member\u003c/th>\u003cth>Next record\u003c/th>\u003cth class=\"r\">Narrows\u003c/th>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-762213\u003c/a>\u003c/td>\u003ctd style=\"font-size:13px\">In-home assessment\u003c/td>\u003ctd class=\"num\">$44K → $19K\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-118182\u003c/a>\u003c/td>\u003ctd style=\"font-size:13px\">Prior-plan chart\u003c/td>\u003ctd class=\"num\">$31K → $15K\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-581930\u003c/a>\u003c/td>\u003ctd style=\"font-size:13px\">Rx history (external)\u003c/td>\u003ctd class=\"num\">$18K → $9K\u003c/td>\u003c/tr>\u003c/table>\n      \u003cdiv class=\"note\">Ranked by how much one more record narrows the interval, times how much the member moves the forecast. 3,900 new members are not worth chasing.\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1280}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\n\nrb(lo, med, hi, mn, mx, W) {\n  const s = v => Math.round((v - mn) / (mx - mn) * W);\n  const l80 = med - (med - lo) * .7, h80 = med + (hi - med) * .7;\n  const l50 = med - (med - lo) * .35, h50 = med + (hi - med) * .35;\n  return { x95: s(lo), w95: s(hi) - s(lo), x80: s(l80), w80: s(h80) - s(l80), x50: s(l50), w50: s(h50) - s(l50), mx: s(med) };\n}\nfmt$(v) { return v >= 1000 ? '$' + Math.round(v / 1000) + 'K' : '$' + v; }\n\nconstructor(p){ super(p); this.state = { q: '' }; }\n_rv() {\n  const M = [{\"name\": \"M-509118\", \"as\": \"74F\", \"dual\": \"dual\", \"coh\": \"LTSS ramp · CKD 3b→4 · polypharmacy\", \"lo\": 28000, \"med\": 39000, \"hi\": 61000, \"tier\": \"high\", \"badges\": [{\"l\": \"RX\", \"s\": 3}, {\"l\": \"LAB\", \"s\": 3}, {\"l\": \"DX×3\", \"s\": 2}, {\"l\": \"SDOH\", \"s\": 1}], \"histT\": \"60 mo\", \"isNew\": false}, {\"name\": \"M-469146\", \"as\": \"68M\", \"dual\": \"non-dual\", \"coh\": \"GLP-1 eligible · HFpEF\", \"lo\": 9000, \"med\": 13500, \"hi\": 21000, \"tier\": \"med\", \"badges\": [{\"l\": \"RX\", \"s\": 2}, {\"l\": \"LAB\", \"s\": 2}, {\"l\": \"DX×3\", \"s\": 2}], \"histT\": \"60 mo\", \"isNew\": false}, {\"name\": \"M-762213\", \"as\": \"81F\", \"dual\": \"dual\", \"coh\": \"New-to-plan dual · LTSS prior\", \"lo\": 34000, \"med\": 52000, \"hi\": 78000, \"tier\": \"low\", \"badges\": [{\"l\": \"DX×1\", \"s\": 1}, {\"l\": \"SDOH\", \"s\": 1}, {\"l\": \"LTSS\", \"s\": 2}], \"histT\": \"12 mo · prior HCC\", \"isNew\": true}, {\"name\": \"M-578458\", \"as\": \"71M\", \"dual\": \"non-dual\", \"coh\": \"High-cost tail · oncology workup\", \"lo\": 45000, \"med\": 82000, \"hi\": 140000, \"tier\": \"low\", \"badges\": [{\"l\": \"DX×1\", \"s\": 1}, {\"l\": \"LAB\", \"s\": 2}], \"histT\": \"60 mo\", \"isNew\": false}, {\"name\": \"M-730250\", \"as\": \"77F\", \"dual\": \"dual\", \"coh\": \"High-cost specialty Rx\", \"lo\": 38000, \"med\": 44000, \"hi\": 52000, \"tier\": \"high\", \"badges\": [{\"l\": \"RX\", \"s\": 3}, {\"l\": \"DX×3\", \"s\": 2}], \"histT\": \"60 mo\", \"isNew\": false}, {\"name\": \"M-676134\", \"as\": \"66M\", \"dual\": \"non-dual\", \"coh\": \"CKD 3b→4\", \"lo\": 12000, \"med\": 17000, \"hi\": 29000, \"tier\": \"med\", \"badges\": [{\"l\": \"LAB\", \"s\": 3}, {\"l\": \"RX\", \"s\": 2}, {\"l\": \"DX×3\", \"s\": 2}], \"histT\": \"60 mo\", \"isNew\": false}, {\"name\": \"M-921549\", \"as\": \"70F\", \"dual\": \"dual\", \"coh\": \"GLP-1 eligible · polypharmacy\", \"lo\": 8000, \"med\": 11000, \"hi\": 19000, \"tier\": \"med\", \"badges\": [{\"l\": \"RX\", \"s\": 3}, {\"l\": \"DX×1\", \"s\": 1}, {\"l\": \"SDOH\", \"s\": 2}], \"histT\": \"60 mo\", \"isNew\": false}, {\"name\": \"M-306724\", \"as\": \"83M\", \"dual\": \"non-dual\", \"coh\": \"LTSS ramp\", \"lo\": 22000, \"med\": 31000, \"hi\": 49000, \"tier\": \"med\", \"badges\": [{\"l\": \"DX×3\", \"s\": 2}, {\"l\": \"LTSS\", \"s\": 2}, {\"l\": \"SDOH\", \"s\": 1}], \"histT\": \"60 mo\", \"isNew\": false}, {\"name\": \"M-118182\", \"as\": \"72F\", \"dual\": \"dual\", \"coh\": \"New-to-plan dual\", \"lo\": 6000, \"med\": 9500, \"hi\": 24000, \"tier\": \"low\", \"badges\": [{\"l\": \"DX×1\", \"s\": 1}, {\"l\": \"SDOH\", \"s\": 1}], \"histT\": \"9 mo · prior HCC\", \"isNew\": true}, {\"name\": \"M-409429\", \"as\": c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Population forecast\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;background:#F6F2EB;color:#0F2A24;font-size:14.5px;line-height:1.4}\na{color:#0E7C6B;text-decoration:none}a:hover{color:#0A5A4E}\n*{box-sizing:border-box}\n.serif{font-family:Fraunces,'Source Serif 4',Georgia,serif;font-weight:600}\n.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}\n.rail{width:240px;height:100%;background:#0F2A24;color:#F6F2EB;display:flex;flex-direction:column;padding:20px 0 16px;position:relative;flex-shrink:0}\n.logo{padding:0 20px 18px;border-bottom:1px solid rgba(246,242,235,.12)}\n.logo .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;letter-spacing:.02em;color:#F6F2EB;line-height:1}\n.logo .tag{font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:#7FE0C9;margin-top:6px}\n.steps{position:relative;padding:16px 0 0 20px;flex-grow:1}\n.steps .line{position:absolute;left:31px;top:38px;width:1px;height:440px;background:#7FE0C9;transform-origin:top;animation:flow 2s ease-out 1}\n@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n.step{display:flex;align-items:center;gap:12px;height:44px;color:rgba(246,242,235,.72);position:relative}\n.step:hover{color:#F6F2EB}\n.step .g{width:24px;height:24px;border-radius:12px;border:1px solid rgba(127,224,201,.55);background:#0F2A24;display:flex;align-items:center;justify-content:center;color:#7FE0C9;flex-shrink:0;position:relative;z-index:1}\n.step.done .g{background:#0A5A4E;border-c "{{nav.Ingest}}\">Ledger reconciliation →\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\n\u003csc-if value=\"{{isCat}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.9fr) minmax(0, 1fr);gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Service-category table · BPT Worksheet 1 structure\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click a category → cohort decomposition\u003c/span>\u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>Service category\u003c/th>\u003cth class=\"r\">Base PMPM\u003c/th>\u003cth class=\"r\">Filed trend\u003c/th>\u003cth class=\"r\">Filed PMPM\u003c/th>\u003cth class=\"r\">PMABI trend\u003c/th>\u003cth class=\"r\">PMABI PMPM\u003c/th>\u003cth class=\"r\">80% interval\u003c/th>\u003cth class=\"r\">Δ bps\u003c/th>\u003cth>Credibility\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{cats}}\" as=\"c\" hint-placeholder-count=\"7\">\n      \u003ctr class=\"{{c.cls}}\" onClick=\"{{c.pick}}\">\u003ctd style=\"font-weight:500\">{{c.name}}\u003c/td>\u003ctd class=\"num\">{{c.base}}\u003c/td>\u003ctd class=\"num\">{{c.ft}}\u003c/td>\u003ctd class=\"num\">{{c.fp}}\u003c/td>\u003ctd class=\"num\">{{c.ct}}\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">{{c.cp}}\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">{{c.iv}}\u003c/td>\u003ctd class=\"num {{c.dcls}}\">{{c.d}}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">{{c.cred}}\u003c/td>\u003c/tr>\n    \u003c/sc-for>\n    \u003ctr>\u003ctd style=\"font-weight:600\">Total\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">$1,420.00\u003c/td>\u003ctd class=\"num\">6.8%\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">$1,516.56\u003c/td>\u003ctd class=\"num\">7.4%\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">$1,525.08\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">$1,518 – $1,534\u003c/td>\u003ctd class=\"num neg\" style=\"font-weight:600\">+60\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">book: full\u003c/td>\u003c/tr>\n    \u003c/table>\n    \u003cdiv class=\"foot\">\u003cspan>Δ bps = (PMABI − filed) ÷ filed, in bps of the category. Each category rebuilds from member-months; the filed column is Meridian's CY2028 draft assumption as provided.\u003c/span>\u003cspan class=\"mono\">v2.3.1 · deterministic\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"ph\">Where the 60 bps sits · by category, bps of total PMPM\u003c/div>\n      \u003csc-for list=\"{{cats}}\" as=\"c\" hint-placeholder-count=\"7\">\n        \u003cdiv style=\"display:flex;align-items:center;gap:10px;font-size:13.5px\">\u003cspan style=\"width:130px;color:#5C6B68\">{{c.name}}\u003c/span>\u003cdiv style=\"flex-grow:1;height:12px;background:#EDE6DA;position:relative\">\u003cdiv style=\"position:absolute;left:0;top:0;height:12px;background:{{c.barCol}};width:{{c.barW}}\">\u003c/div>\u003c/div>\u003cspan class=\"mono\" style=\"width:48px;text-align:right\">{{c.tot}}\u003c/span>\u003c/div>\n      \u003c/sc-for>\n      \u003cdiv class=\"note\">Part D and LTSS carry two thirds of the gap: GLP-1 uptake with 47% persistence, specialty catastrophic-phase liability, and the LTSS ramp in converted D-SNP members.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel sand\">\n      \u003cdiv class=\"ph\">Credibility · ASOP 25 · blended toward your manual rate\u003c/div>\n      \u003ctable class=\"t\" style=\"background:transparent\">\u003ctr>\u003cth>PBP\u003c/th>\u003cth class=\"r\">Member-months\u003c/th>\u003cth class=\"r\">Weight\u003c/th>\u003cth>Blend\u003c/th>\u003c/tr>\n        \u003ctr>\u003ctd>001 · HMO\u003c/td>\u003ctd class=\"num\">1,156,800\u003c/td>\u003ctd class=\"num\">100%\u003c/td>\u003ctd>\u003cdiv style=\"height:8px;background:#0E7C6B;width:100%\">\u003c/div>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>002 · D-SNP\u003c/td>\u003ctd class=\"num\">456,000\u003c/td>\u003ctd class=\"num\">100%\u003c/td>\u003ctd>\u003cdiv style=\"height:8px;background:#0E7C6B;width:100%\">\u003c/div>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>003 · PPO\u003c/td>\u003ctd class=\"num\">138,000\u003c/td>\u003ctd class=\"num\">87%\u003c/td>\u003ctd>\u003cdiv style=\"display:flex;height:8px\">\u003cdiv style=\"background:#0E7C6B;width:87%\">\u003c/div>\u003cdiv style=\"background:#D99A2B;width:13%\">\u003c/div>\u003c/div>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>004 · C-SNP (new)\u003c/td>\u003ctd class=\"num\">23,520\u003c/td>\u003ctd class=\"num\">62%\u003c/td>\u003ctd>\u003cdiv style=\"display:flex;height:8px\">\u003cdiv style=\"background:#0E7C6B;width:62%\">\u003c/div>\u003cdiv style=\"background:#D99A2B;width:38%\">\u003c/div>\u003c/div>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>005 · I-SNP pilot\u003c/td>\u003ctd class=\"num\">1,680\u003c/td>\u003ctd class=\"num\">18%\u003c/td>\u003ctd>\u003cdiv style=\"display:flex;height:8px\">\u003cdiv style=\"background:#0E7C6B;width:18%\">\u003c/div>\u003cdiv style=\"background:#D99A2B;width:82%\">\u003c/div>\u003c/div>\u003c/td>\u003c/tr>\n      \u003c/table>\n      \u003cdiv class=\"note\">Teal = member-month build, amber = actuary's manual rate. \"On your small PBPs we defer to your manual rate; we only move the number where the data earns it.\"\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\n\u003csc-if value=\"{{isBuilt}}\" hint-placeholder-val=\"{{ true }}\">\n\u003cdiv class=\"panel\">\n  \u003cdiv class=\"ph\">\u003cspan>Forecast hierarchy · what is computed where\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">member level is the unit of computation\u003c/span>\u003c/div>\n  \u003cdiv style=\"display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:10px\">\n    \u003csc-for list=\"{{hier}}\" as=\"h\" hint-placeholder-count=\"5\">\n    \u003cdiv style=\"border:1px solid #5C6B68;border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:{{h.bg}};color:{{h.fg}}\">\u003cspan class=\"mono\" style=\"font-size:12px;letter-spacing:.06em;opacity:.8\">{{h.step}}\u003c/span>\u003cspan style=\"font-weight:600;font-size:15px\">{{h.t}}\u003c/span>\u003cspan class=\"mono\" style=\"font-size:13px\">{{h.n}}\u003c/span>\u003cspan style=\"font-size:13.5px;line-height:1.4;opacity:.9\">{{h.d}}\u003c/span>\u003c/div>\n    \u003c/sc-for>\n  \u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr);gap:16px\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Double-counting check · drivers add to the total\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">CY2028 PMPM\u003c/span>\u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>Driver (each dollar in exactly one)\u003c/th>\u003cth class=\"r\">PMPM\u003c/th>\u003cth class=\"r\">Share\u003c/th>\u003cth>Members carrying it\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>Baseline utilization\u003c/td>\u003ctd class=\"num\">$1,108.40\u003c/td>\u003ctd class=\"num\">72.7%\u003c/td>\u003ctd style=\"font-size:13.5px\">all 148,000\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Chronic progression (CKD, HF, diabetes complications)\u003c/td>\u003ctd class=\"num\">$142.60\u003c/td>\u003ctd class=\"num\">9.4%\u003c/td>\u003ctd style=\"font-size:13.5px\">31,400\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Rx pathway (drug + induced − avoided)\u003c/td>\u003ctd class=\"num\">$151.30\u003c/td>\u003ctd class=\"num\">9.9%\u003c/td>\u003ctd style=\"font-size:13.5px\">44,800\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>LTSS onset and expansion\u003c/td>\u003ctd class=\"num\">$78.90\u003c/td>\u003ctd class=\"num\">5.2%\u003c/td>\u003ctd style=\"font-size:13.5px\">6,900\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Acute and high-cost events\u003c/td>\u003ctd class=\"num\">$43.88\u003c/td>\u003ctd class=\"num\">2.9%\u003c/td>\u003ctd style=\"font-size:13.5px\">simulated, any member\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd style=\"font-weight:600\">Population forecast\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">$1,525.08\u003c/td>\u003ctd class=\"num\">100%\u003c/td>\u003ctd style=\"font-size:13.5px\">= sum of member forecasts\u003c/td>\u003c/tr>\n    \u003c/table>\n    \u003cdiv class=\"note\">Cohorts are overlapping lenses for reading the forecast, not separate forecasts. That is why cohort contributions on the Cost drivers screen are never added together.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">Where each assumption comes from · three layers\u003c/div>\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\n      \u003cdiv style=\"display:flex;gap:10px;align-items:center\">\u003cspan class=\"layer pub\" style=\"width:150px\">Public baseline\u003c/span>\u003cspan style=\"font-size:14px\">41 assumptions from public data: CMS rates and rules, FDA labels, published evidence. Same starting point for every client.\u003c/span>\u003c/div>\n      \u003cdiv style=\"display:flex;gap:10px;align-items:center\">\u003cspan class=\"layer cli\" style=\"width:150px\">Meridian layer\u003c/span>\u003cspan style=\"font-size:14px\">23 assumptions from Meridian's own data and judgment: trend study, completion, credibility, prices. Isolated; never pooled across clients.\u003c/span>\u003c/div>\n      \u003cdiv style=\"display:flex;gap:10px;align-items:center\">\u003cspan class=\"layer scn\" style=\"width:150px\">Scenario override\u003c/span>\u003cspan style=\"font-size:14px\">3 overrides that belong to one scenario only (S-03 induced utilization, credited interventions).\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"note\">The product works with the public baseline plus one plan's own data. It never needs another plan's data.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{isUnc}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.3fr) minmax(0, 1fr);gap:16px\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Population CY2028 PMPM · 10,000 simulated years\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">built from 148,000 member distributions\u003c/span>\u003c/div>\n    \u003cdiv style=\"display:flex;gap:3px;align-items:flex-end;height:200px;border-bottom:1px solid #5C6B68;position:relative\">\u003csc-for list=\"{{hist}}\" as=\"h\" hint-placeholder-count=\"31\">\u003cdiv style=\"flex:1;height:{{h.h}};background:{{h.c}}\">\u003c/div>\u003c/sc-for>\u003c/div>\n    \u003cdiv style=\"display:flex;justify-content:space-between\" class=\"mono\">\u003cspan style=\"font-size:12.5px;color:#5C6B68\">$1,508\u003c/span>\u003cspan style=\"font-size:12.5px\">80%: $1,518 – $1,534 · median $1,525.08\u003c/span>\u003cspan style=\"font-size:12.5px;color:#5C6B68\">$1,542\u003c/span>\u003c/div>\n    \u003cdiv class=\"note\">The interval is derived, not added: each member's distribution is sampled, recombined and summed. Individual members stay highly variable (a typical member's 80% range is ±45%); most of that cancels across 148,000 members, but not in the tail.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">What drives the width · share of variance\u003c/div>\n    \u003csc-for list=\"{{vc}}\" as=\"v\" hint-placeholder-count=\"6\">\u003cdiv style=\"display:flex;align-items:center;gap:10px;font-size:14px\">\u003cspan style=\"width:200px\">{{v.n}}\u003c/span>\u003cdiv style=\"flex-grow:1;height:12px;background:#EDE6DA\">\u003cdiv style=\"height:12px;background:#0E7C6B;width:{{v.w}}\">\u003c/div>\u003c/div>\u003cspan class=\"mono\" style=\"width:44px;text-align:right\">{{v.p}}\u003c/span>\u003c/div>\u003c/sc-for>\n    \u003cdiv class=\"note\">New members with thin history contribute 14% of the width from 3.5% of members. The chart-chase list on Member-month state targets exactly them.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{isTie}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.7fr) minmax(0, 1fr);gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Tie-out · filed base period vs. PMABI ingested base period · same claims\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click a line → its explanation\u003c/span>\u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>BPT service category\u003c/th>\u003cth class=\"r\">Filed base PMPM\u003c/th>\u003cth class=\"r\">PMABI base PMPM\u003c/th>\u003cth class=\"r\">Variance $\u003c/th>\u003cth class=\"r\">bps\u003c/th>\u003cth>Explanation\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{tie}}\" as=\"r\" hint-placeholder-count=\"7\">\n      \u003ctr class=\"{{r.cls}}\" onClick=\"{{r.pick}}\">\u003ctd style=\"font-weight:500\">{{r.cat}}\u003c/td>\u003ctd class=\"num\">{{r.f}}\u003c/td>\u003ctd class=\"num\">{{r.p}}\u003c/td>\u003ctd class=\"num\">{{r.v}}\u003c/td>\u003ctd class=\"num\" style=\"{{r.bstyle}}\">{{r.b}}\u003c/td>\u003ctd style=\"font-size:13px\">{{r.why}}\u003c/td>\u003ctd>\u003cspan class=\"stamp {{r.sc}}\" style=\"font-size:11.5px\">{{r.st}}\u003c/span>\u003c/td>\u003c/tr>\n    \u003c/sc-for>\n    \u003ctr>\u003ctd style=\"font-weight:600\">Total\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">$1,419.70\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">$1,420.10\u003c/td>\u003ctd class=\"num\">+$0.40\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">+3\u003c/td>\u003ctd style=\"font-size:13px\">net of the lines above\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n    \u003c/table>\n    \u003cdiv class=\"foot\">\u003cspan>Rule: no line above 25 bps without a written explanation accepted by the actuary. A line that cannot be explained shows amber; it is never hidden.\u003c/span>\u003cspan class=\"mono\">base period CY2026 · paid thru Feb 2027\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"panel sand\">\n    \u003cdiv class=\"ph\">Explanation · {{tr.cat}}\u003c/div>\n    \u003cdiv class=\"kv\">\u003cspan class=\"k\">Filed base\u003c/span>\u003cspan class=\"v\">{{tr.f}}\u003c/span>\u003cspan class=\"k\">PMABI base\u003c/span>\u003cspan class=\"v\">{{tr.p}}\u003c/span>\u003cspan class=\"k\">Variance\u003c/span>\u003cspan class=\"v\">{{tr.v}} · {{tr.b}} bps\u003c/span>\u003cspan class=\"k\">Reason code\u003c/span>\u003cspan class=\"v\">{{tr.rc}}\u003c/span>\u003cspan class=\"k\">Status\u003c/span>\u003cspan class=\"v\">{{tr.st}}\u003c/span>\u003c/div>\n    \u003cdiv class=\"note\" style=\"color:#0F2A24\">{{tr.long}}\u003c/div>\n    \u003csc-if value=\"{{tr.pending}}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv style=\"display:flex;gap:8px\">\u003cbutton class=\"btn sm\" onClick=\"{{accept}}\">Accept explanation\u003c/button>\u003ca class=\"btn ghost sm\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\">Open in register\u003c/a>\u003c/div>\u003c/sc-if>\n    \u003cdiv class=\"note\">The member-level build has to reconcile to your own base period before any projection is believed. Then, and only then, read the trend decomposition.\u003c/div>\n    \u003cbutton class=\"btn ghost sm\" onClick=\"{{v1}}\" style=\"align-self:flex-start\">Next · trend decomposition \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{isDec}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr);gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Trend layers · each with an owner, a source and an interval\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">override · haircut · zero\u003c/span>\u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>Trend layer\u003c/th>\u003cth>Owner\u003c/th>\u003cth>Assumption layer\u003c/th>\u003cth>Source\u003c/th>\u003cth class=\"r\">Interval\u003c/th>\u003cth class=\"r\">bps\u003c/th>\u003cth>Controls\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{layers}}\" as=\"l\" hint-placeholder-count=\"9\">\n      \u003ctr>\u003ctd style=\"font-weight:500;padding-left:{{l.ind}}\">{{l.n}}\u003c/td>\u003ctd style=\"font-size:13px\">{{l.own}}\u003c/td>\u003ctd>\u003cspan class=\"layer {{l.lc}}\">{{l.lt}}\u003c/span>\u003c/td>\u003ctd style=\"font-size:12.5px;color:#5C6B68\">{{l.src}}\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">{{l.iv}}\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">{{l.valT}}\u003csc-if value=\"{{l.changed}}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv style=\"font-size:11.5px;color:#8a5f14;font-weight:400\">model {{l.baseT}}\u003c/div>\u003c/sc-if>\u003c/td>\n      \u003ctd>\u003csc-if value=\"{{l.ctl}}\" hint-placeholder-val=\"{{ true }}\">\u003cdiv style=\"display:flex;gap:4px;align-items:center\">\u003cbutton class=\"tab {{l.oOn}}\" onClick=\"{{l.ovr}}\" style=\"padding:3px 7px;font-size:12.5px\">Override\u003c/button>\u003cbutton class=\"tab {{l.hOn}}\" onClick=\"{{l.hc}}\" style=\"padding:3px 7px;font-size:12.5px\">Haircut 50%\u003c/button>\u003cbutton class=\"tab {{l.zOn}}\" onClick=\"{{l.zero}}\" style=\"padding:3px 7px;font-size:12.5px\">Zero\u003c/button>\u003c/div>\u003csc-if value=\"{{l.oShow}}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv style=\"display:flex;gap:6px;align-items:center;margin-top:4px\">\u003clabel for=\"ov-{{l.k}}\" style=\"font-size:12.5px;color:#5C6B68\">Actuary value, bps\u003c/label>\u003cinput id=\"ov-{{l.k}}\" type=\"number\" value=\"{{l.ov}}\" onChange=\"{{l.setOv}}\" style=\"width:64px;font-family:'IBM Plex Mono',Menlo,monospace;font-size:13.5px;border:1px solid #5C6B68;border-radius:3px;padding:2px 4px\">\u003c/div>\u003c/sc-if>\u003c/sc-if>\u003csc-if value=\"{{l.note}}\" hint-placeholder-val=\"{{ false }}\">\u003cspan style=\"font-size:12.5px;color:#5C6B68\">{{l.noteT}}\u003c/span>\u003c/sc-if>\u003c/td>\u003c/tr>\n    \u003c/sc-for>\n    \u003c/table>\n    \u003cdiv class=\"note\">The first two layers are yours: PMABI pre-fills policy shocks from public sources with a citation and a date, and you own the value. \"Your trend study stays your trend study. We are telling you what is underneath it.\"\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"ph\">\u003cspan>Waterfall · base-period PMPM → projected CY2028\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">bps of trend\u003c/span>\u003c/div>\n      \u003cdiv style=\"position:relative;height:250px;display:flex;gap:6px;align-items:stretch;border-bottom:1px solid #5C6B68\">\n        \u003csc-for list=\"{{wf}}\" as=\"w\" hint-placeholder-count=\"9\">\n        \u003cdiv style=\"flex:1;position:relative;min-width:0\">\n          \u003cdiv style=\"position:absolute;left:4px;right:4px;bottom:{{w.b}};height:{{w.h}};background:{{w.c}}\">\u003c/div>\n          \u003cdiv class=\"mono\" style=\"position:absolute;left:0;right:0;bottom:{{w.lb}};text-align:center;font-size:12px\">{{w.v}}\u003c/div>\n        \u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003cdiv style=\"display:flex;gap:6px\">\n        \u003csc-for list=\"{{wf}}\" as=\"w\" hint-placeholder-count=\"9\">\u003cdiv style=\"flex:1;font-size:11.5px;color:#5C6B68;text-align:center;line-height:1.2;min-width:0\">{{w.n}}\u003c/div>\u003c/sc-for>\n      \u003c/div>\n      \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:#0F2A24\">\u003c/i>actuary-owned\u003c/span>\u003cspan>\u003ci style=\"background:#0E7C6B\">\u003c/i>PMABI-contributed\u003c/span>\u003cspan>\u003ci style=\"background:#7FE0C9\">\u003c/i>interventions, credited\u003c/span>\u003cspan>\u003ci style=\"background:#5C6B68\">\u003c/i>subtotal / result\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel ink\">\n      \u003cdiv class=\"ph\">\u003cspan>What moves downstream\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0;color:#7FE0C9\">live\u003c/span>\u003c/div>\n      \u003cdiv class=\"kv\" style=\"color:#F6F2EB;grid-template-columns:200px 1fr\">\u003cspan class=\"k\" style=\"color:#7FE0C9\">Trend before interventions\u003c/span>\u003cspan class=\"v\">{{preT}} · {{prePmpm}}\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Trend after credited interventions\u003c/span>\u003cspan class=\"v\">{{postT}} · {{postPmpm}}\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Bid · margin, MedEx view\u003c/span>\u003cspan class=\"v\" style=\"font-weight:600\">{{marginT}} \u003cspan style=\"font-weight:400;opacity:.7\">(was 2.6%)\u003c/span>\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Filed draft, for reference\u003c/span>\u003cspan class=\"v\">6.8% blended · not decomposed\u003c/span>\u003c/div>\n      \u003csc-if value=\"{{hasLog}}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv class=\"mono\" style=\"font-size:12.5px;line-height:1.6;white-space:pre-line;color:#F6F2EB;border-top:1px solid rgba(246,242,235,.2);padding-top:8px\">{{logT}}\u003c/div>\u003c/sc-if>\n      \u003cdiv class=\"note\" style=\"color:#F6F2EB;opacity:.8\">Try it: haircut the LTSS ramp by 50% and watch the trend and the bid margin move. Every change writes to the assumption register and the audit log.\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{show}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv class=\"drill\" style=\"width:500px\">\n  \u003cdiv class=\"dh\">\u003cdiv>\u003cdiv class=\"ph\">Cohort decomposition\u003c/div>\u003cdiv class=\"dt\">{{cur.name}} · {{cur.d}} bps\u003c/div>\u003c/div>\u003cbutton class=\"xbtn\" aria-label=\"Close\" onClick=\"{{close}}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cspan class=\"k\">Filed PMPM\u003c/span>\u003cspan class=\"v\">{{cur.fp}}\u003c/span>\u003cspan class=\"k\">PMABI PMPM\u003c/span>\u003cspan class=\"v\">{{cur.cp}} · 80% {{cur.iv}}\u003c/span>\u003cspan class=\"k\">Method\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.method}}\u003c/span>\u003c/div>\n  \u003cdiv class=\"ph\">Which cohorts move this category\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Cohort\u003c/th>\u003cth class=\"r\">Members\u003c/th>\u003cth class=\"r\">bps of category\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{cur.rows}}\" as=\"r\" hint-placeholder-count=\"4\">\u003ctr>\u003ctd>\u003ca href=\"Cohorts.dc.html\" onClick=\"{{nav.Cohorts}}\">{{r.n}}\u003c/a>\u003c/td>\u003ctd class=\"num\">{{r.m}}\u003c/td>\u003ctd class=\"num {{r.cls}}\">{{r.b}}\u003c/td>\u003c/tr>\u003c/sc-for>\n  \u003c/table>\n  \u003cdiv class=\"note\">{{cur.note}}\u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px\">\u003ca class=\"btn sm\" href=\"Cohorts.dc.html\" onClick=\"{{nav.Cohorts}}\">Open cohorts \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003ca class=\"btn ghost sm\" href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">Drill to a member\u003c/a>\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1280}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\n\nconstructor(p){ super(p); this.state = { c: -1, tab: 3, tr: 4, acc: false, L: {} }; }\n_rv() {\n  const C = [\n    { name: 'Inpatient', base: 418.6, ft: 7.0, ct: 7.4, w: .02, cred: 'full', method: 'Admission probability × LOS × unit cost per member-month; DRG mix from 5-yr history.', rows: [{n:'High-cost tail',m:'830',b:'+22'},{n:'LTSS ramp',m:'2,140',b:'+9'},{n:'CKD 3b → 4',m:'1,250',b:'+6'},{n:'Rest of book',m:'143,780',b:'+0'}], note: 'Emergent dialysis starts and oncology admissions drive the tail; both are member-identifiable.' },\n    { name: 'Outpatient', base: 293.0, ft: 6.0, ct: 6.2, w: .03, cred: 'full', method: 'Visit-type frequencies by profile × site-of-care mix × contracted rates.', rows: [{n:'High-cost tail',m:'830',b:'+10'},{n:'Polypharmacy + transport',m:'1,900',b:'+6'},{n:'Rest of book',m:'145,270',b:'+3'}], note: 'Avoidable ED among transport-insecure members is the largest controllable piece.' },\n    { name: 'Professional', base: 265.3, ft: 5.5, ct: 5.6, w: .03, cred: 'full', method: 'E&M and specialist visit rates by condition profile.', rows: [{n:'CKD 3b → 4',m:'1,250',b:'+4'},{n:'GLP-1 eligible',m:'9,800',b:'+3'},{n:'Rest of book',m:'136,950',b:'+2'}], note: 'Near the filed assumption; difference is nephrology and endocrinology follow-up frequency.' },\n    { name: 'Part B drugs', base: 72.7, ft: 8.0, ct: 8.6, w: .07, cred: 'full', method: 'J-code exposure by condition; oncology and Alzheimer\\'s DMT infusion ramps from the Rx pipeline.', rows: [{n:'Oncology workup-in-progress',m:'410',b:'+31'},{n:'Alzheimer\\'s DMT eligible',m:'620',b:'+18'},{n:'Rest of book',m:'146,970',b:'+6'}], note: 'Thin claims history; priced from eligible members and public uptake curves, not =\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Intervention scenarios\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"Bid.dc.html\" onClick=\"{{nav.Bid}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Bid · second opinion\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"Variance.dc.html\" onClick=\"{{nav.Variance}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Actual vs. expected\u003c/span>\u003cspan class=\"modtag\">module\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"Export.dc.html\" onClick=\"{{nav.Export}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Export to BPT\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"gov\">\u003cb>Governance layer · under every step\u003c/b>\u003ca class=\"step done\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Assumptions &amp; approvals\u003c/span>\u003c/a>\u003c/div>\n\u003cdiv class=\"roadmap\">\u003cb>Next modules\u003c/b>Revenue + admin engines at full depth (Phase 2) · MedEx engine reused for ACO / VBC · employer benefit simulation\u003c/div>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003cdiv class=\"top\">\n\u003cdiv class=\"crumbs\" style=\"flex-direction:column;align-items:flex-start;gap:5px;justify-content:center;min-width:0\">\u003cdiv style=\"display:flex;gap:10px;align-items:center;white-space:nowrap\">\u003cspan style=\"font-weight:600\">Meridian Health Plan\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan>CY2028 bid\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan class=\"illus\">Illustrative · fictional plan, de-identified members\u003c/span>\u003cspan class=\"scope\">Scope · medical expense (Phase 1)\u003c/span>\u003c/div>\u003cdiv style=\"display:flex;gap:6px;align-items:center;white-space:nowrap\">\u003cspan class=\"stamp\">as of 12/31/26 · frozen 2/15/27\u003c/span>\u003cspan class=\"stamp\">v2.3.1 deterministic\u003c/span>\u003ca class=\"stamp\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">register r14 · #7f3ac91e\u003c/a>\u003ca class=\"stamp amber\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">sign-off 10/16\u003c/a>\u003ca class=\"stamp mint\" href=\"Ingest.dc.html\" onClick=\"{{nav.Ingest}}\" style=\"text-decoration:none\">GL gate · passed\u003c/a>\u003c/div>\u003c/div>\n\u003ca class=\"toplink\" href=\"Main.dc.html\" onClick=\"{{nav.Main}}\">Backtest\u003c/a>\n\u003ca class=\"toplink\" href=\"Pipeline.dc.html\" onClick=\"{{nav.Pipeline}}\">Architecture\u003c/a>\n\u003c/div>\n\u003cdiv class=\"content\">\n\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  \u003cdiv>\u003ch1 class=\"h1\">Backtest read-out\u003c/h1>\u003cdiv class=\"sub\">Filed forecast vs. PMABI second opinion vs. actual PMPM for three past bid years, scored blind at each year's freeze date. Click a vintage for its calibration by cost decile, open its protocol card to see how the test was run, or click a tail count to list the $100K+ members.\u003c/div>\u003c/div>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:#D99A2B\">\u003c/i>Filed forecast\u003c/span>\u003cspan>\u003ci style=\"background:#0E7C6B\">\u003c/i>PMABI\u003c/span>\u003cspan>\u003ci style=\"background:#0F2A24\">\u003c/i>Actual\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:16px\">\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Filed PMPM error · 3-vintage avg\u003c/div>\u003cdiv class=\"big neg\">+163 bps\u003c/div>\u003cdiv class=\"note\">Aggregate miss vs. realized PMPM. At $2.52B of premium, 100 bps ≈ \u003cspan class=\"mono\">$25.2M\u003c/span>.\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">PMABI PMPM error · 3-vintage avg\u003c/div>\u003cdiv class=\"big pos\">+17 bps\u003c/div>\u003cdiv class=\"note\">Absolute error 30 bps; sign alternates across vintages, no systematic bias.\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">$100K+ tail · members missed by filed\u003c/div>\u003cdiv class=\"big\">275\u003c/div>\u003cdiv class=\"note\">Filed under-counted the tail in every vintage; PMABI within 2–12%.\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Interval coverage · 90% intervals\u003c/div>\u003cdiv class=\"big\">90%\u003c/div>\u003cdiv class=\"note\">88 / 91 / 90% of outcomes fell inside the stated 90% interval.\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"panel\">\n  \u003cdiv class=\"ph\">\u003cspan>Scorecard · beyond whether the mean got closer\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">3 vintages · out of sample\u003c/span>\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Measure\u003c/th>\u003cth class=\"r\">Filed\u003c/th>\u003cth class=\"r\">PMABI\u003c/th>\u003cth>What it tells the actuary\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>Bias · mean error\u003c/td>\u003ctd class=\"num neg\">+163 bps\u003c/td>\u003ctd class=\"num pos\">+17 bps\u003c/td>\u003ctd style=\"font-size:13.5px\">No systematic under-pricing; sign alternates across vintages\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Mean absolute error · aggregate PMPM\u003c/td>\u003ctd class=\"num neg\">163 bps\u003c/td>\u003ctd class=\"num pos\">30 bps\u003c/td>\u003ctd style=\"font-size:13.5px\">Size of the miss, whichever direction\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Residual variance · high-cost cohorts\u003c/td>\u003ctd class=\"num\">baseline\u003c/td>\u003ctd class=\"num pos\">−38%\u003c/td>\u003ctd style=\"font-size:13.5px\">Less volatility left unexplained where bids break\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Interval calibration · 50 / 80 / 90%\u003c/td>\u003ctd class=\"num\">no intervals\u003c/td>\u003ctd class=\"num pos\">49 / 79 / 90%\u003c/td>\u003ctd style=\"font-size:13.5px\">Stated ranges contain the outcome as often as they claim to\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Member-level absolute % error\u003c/td>\u003ctd class=\"num\">not member-level\u003c/td>\u003ctd class=\"num\">41%\u003c/td>\u003ctd style=\"font-size:13.5px\">Individual members stay unpredictable; that is why every member is a range\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>$100K+ tail · count error\u003c/td>\u003ctd class=\"num neg\">−16%\u003c/td>\u003ctd class=\"num pos\">−4%\u003c/td>\u003ctd style=\"font-size:13.5px\">Tail performance, where filed missed hardest\u003c/td>\u003c/tr>\n  \u003c/table>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr);gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Trend ledger · filed vs. PMABI vs. actual\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click a vintage → calibration · protocol → how it was run\u003c/span>\u003c/div>\n    \u003ctable class=\"t\">\n      \u003ctr>\u003cth>Vintage\u003c/th>\u003cth class=\"r\">Filed PMPM\u003c/th>\u003cth class=\"r\">PMABI\u003c/th>\u003cth class=\"r\">Actual\u003c/th>\u003cth class=\"r\">Filed miss\u003c/th>\u003cth class=\"r\">PMABI err\u003c/th>\u003cth class=\"r\">Tail $100K+ filed → actual\u003c/th>\u003cth class=\"r\">Coverage\u003c/th>\u003cth>Protocol\u003c/th>\u003c/tr>\n      \u003csc-for list=\"{{vintages}}\" as=\"v\" hint-placeholder-count=\"3\">\n      \u003ctr class=\"{{v.cls}}\" onClick=\"{{v.pick}}\">\u003ctd>\u003cspan style=\"font-weight:600\">{{v.name}}\u003c/span>\u003cdiv style=\"font-size:12.5px;color:#5C6B68\">{{v.note}}\u003c/div>\u003c/td>\u003ctd class=\"num\">{{v.filed}}\u003c/td>\u003ctd class=\"num\">{{v.chal}}\u003c/td>\u003ctd class=\"num\">{{v.actual}}\u003c/td>\u003ctd class=\"num neg\">{{v.fErr}}\u003c/td>\u003ctd class=\"num pos\">{{v.cErr}}\u003c/td>\u003ctd class=\"num\">\u003ca href=\"#tail\" onClick=\"{{v.tail}}\" style=\"text-decoration:underline dotted\">{{v.tailTxt}}\u003c/a>\u003c/td>\u003ctd class=\"num\">{{v.cov}}\u003c/td>\u003ctd>\u003cbutton class=\"btn ghost sm\" onClick=\"{{v.proto}}\" aria-label=\"Open protocol card for {{v.name}}\">Card\u003c/button>\u003c/td>\u003c/tr>\n      \u003c/sc-for>\n    \u003c/table>\n    \u003cdiv class=\"note\">Errors are (forecast − actual) ÷ actual in bps of PMPM. \"Miss\" = realized PMPM exceeded the filed assumption. Backtest figures are illustrative; the pilot's success criterion (beat or match the filed forecast) is a contract term, not a product claim. PMABI runs in parallel with your bid process and consultant as an independent second opinion; it does not replace them.\u003c/div> seTail}}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cdiv class=\"note\">Members whose realized annual cost exceeded $100K. Column shows whether each forecast placed the member in the tail before the year began.\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Member ID\u003c/th>\u003cth class=\"r\">Realized\u003c/th>\u003cth class=\"r\">Filed\u003c/th>\u003cth class=\"r\">PMABI\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-414681, 79M\u003c/a>\u003c/td>\u003ctd class=\"num\">$212K\u003c/td>\u003ctd class=\"num neg\">no\u003c/td>\u003ctd class=\"num pos\">yes\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-388829, 71F\u003c/a>\u003c/td>\u003ctd class=\"num\">$168K\u003c/td>\u003ctd class=\"num neg\">no\u003c/td>\u003ctd class=\"num pos\">yes\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-451641, 66M\u003c/a>\u003c/td>\u003ctd class=\"num\">$154K\u003c/td>\u003ctd class=\"num pos\">yes\u003c/td>\u003ctd class=\"num pos\">yes\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-761647, 84F\u003c/a>\u003c/td>\u003ctd class=\"num\">$141K\u003c/td>\u003ctd class=\"num neg\">no\u003c/td>\u003ctd class=\"num pos\">yes\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-759784, 77F\u003c/a>\u003c/td>\u003ctd class=\"num\">$128K\u003c/td>\u003ctd class=\"num neg\">no\u003c/td>\u003ctd class=\"num neg\">no\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">M-261978, 69M\u003c/a>\u003c/td>\u003ctd class=\"num\">$117K\u003c/td>\u003ctd class=\"num pos\">yes\u0 run-out); completion factors by service category', prov: 'final', hash: '#5e03c4a8', cnote: 'LTSS ramp concentrated in D-SNP members; filed trend factor priced the average member.' },\n    { name: 'CY2026', note: 'GLP-1 inflection', filed: '$1,381', chal: '$1,402', actual: '$1,398', fErr: '+120 bps', cErr: '+30 bps', tailTxt: '780 → 812', cov: '90% of 90%', pt: 796, asof: 'Dec 31 2024', frz: 'Feb 15 2025', train: 'CY2020–CY2023', hold: 'CY2024', ro: 'Claims paid through Feb 28 2027 (2 months run-out); completion factors applied · provisional until Jun 30 2027', prov: 'provisional · run-out incomplete', hash: '#91fd2a36', cnote: 'Rx trend left the trendline; eligible-member uptake ramps kept PMABI inside 30 bps.' },\n  ];\n  const s = this.state;\n  return {\n    vintages: V.map((v, i) => ({ ...v, cls: 'click' + (i === s.v ? ' sel' : ''), pick: () => this.setState({ v: i }), tail: (e) => { e.preventDefault(); e.stopPropagation(); this.setState({ v: i, tail: true, proto: false }); }, proto: (e) => { e.stopPropagation(); this.setState({ v: i, proto: true, tail: false }); } })),\n    v0: s.v === 0, v1: s.v === 1, v2: s.v === 2,\n    curName: V[s.v].name, curNote: V[s.v].cnote, tailTxt: V[s.v].tailTxt.split('→')[1].trim(),\n    showTail: s.tail, closeTail: () => this.setState({ tail: false, proto: false }),\n    showProto: s.proto, pc: (() => { const v = V[s.v], act = +v.tailTxt.split('→')[1].trim(), fil = +v.tailTxt.split('→')[0].trim(); return { name: v.name, hash: v.hash, prov: v.prov, provCls: v.prov === 'final' ? 'mint' : 'amber', rows: [\n      { f: 'Vintage', v: v.name + ' bid · data as of ' + v.asof + ' · frozen ' + v.frz, q: 'Was the model given data the bid team did not have?' },\n      { f: 'Out-of-sample', v: 'Trained on ' + v.train + ' experience; no ' + v.hold + ' outcomes in training; features frozen at the as-of date', q: 'Leakage is the first thing they will try to find' },\n      { f: 'Run-out', v: v.ro, q: 'Did you compare to incurred or paid?' },\n      { f: 'Comparison basis', v: 'Incurred PMPM by BPT service category, same PBP set as the filed bid', q: 'Apples to apples with the BPT, or a different cut?' },\n      { f: 'Population', v: 'Same member set the bid priced; new-to-plan members shown separately with manual-rate blend', q: 'Did you cherry-pick continuing members?' },\n      { f: 'Error', v: 'Filed ' + v.fErr + '; PMABI ' + v.cErr + '; by category and by decile (chart)', q: 'Where was the miss, and did you miss the same places?' },\n      { f: 'Interval coverage', v: '90% interval contained actual in ' + v.cov.split(' ')[0] + ' of cohorts', q: 'Are your intervals honest?' },\n      { f: 'Tail', v: '$100K+ members: filed ' + fil + ', PMABI ' + v.pt + ', actual ' + act, q: 'The tail is where bids break' },\n      { f: 'Re-run hash', v: 'Identical result on re-run · ' + v.hash, q: 'Deterministic, auditable' } ] }; })(),\n  };\n}\n\n\n_nav() { const g = this.props.go, o = {}; [\"Main\", \"Ingest\", \"Pipeline\", \"Profiles\", \"Member\", \"Cohorts\", \"Forecast\", \"RxPipeline\", \"DxGap\", \"Scenarios\", \"Interventions\", \"Variance\", \"Bid\", \"Register\", \"Export\"].forEach(k => { o[k] = e => { if (g) { if (e && e.preventDefault) e.preventDefault(); g(k); } }; }); return o; }\nrenderVals() { const v = this._rv(), nav = this._nav(); if (v.cur && v.cur.href) { const k = v.cur.href.replace('.dc.html', ''); v.cur = { ...v.cur, go: nav[k] }; } return { ...v, nav }; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>", "Pipeline.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Pipeline overview\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;f dth=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Probabilistic forecast\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"DxGap.dc.html\" onClick=\"{{nav.DxGap}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Revenue &amp; risk adj.\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"Scenarios.dc.html\" onClick=\"{{nav.Scenarios}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Benefit scenarios\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"Interventions.dc.html\" onClick=\"{{nav.Interventions}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Intervention scenarios\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"Bid.dc.html\" onClick=\"{{nav.Bid}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Bid · second opinion\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"Variance.dc.html\" onClick=\"{{nav.Variance}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Actual vs. expected\u003c/span>\u003cspan class=\"modtag\">module\u003c/span>\u003c/a>\u003ca class=\"step done\" href=\"Export.dc.html\" onClick=\"{{nav.Export}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Export to BPT\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"gov\">\u003cb>Governance layer · under every step\u003c/b>\u003ca class=\"step done\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l5 5L20 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Assumptions &amp; approvals\u003c/span>\u003c/a>\u003c/div>\n\u003cdiv class=\"roadmap\">\u003cb>Next modules\u003c/b>Revenue + admin engines at full depth (Phase 2) · MedEx engine reused for ACO / VBC · employer benefit simulation\u003c/div>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003cdiv class=\"top\">\n\u003cdiv class=\"crumbs\" style=\"flex-direction:column;align-items:flex-start;gap:5px;justify-content:center;min-width:0\">\u003cdiv style=\"display:flex;gap:10px;align-items:center;white-space:nowrap\">\u003cspan style=\"font-weight:600\">Meridian Health Plan\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan>CY2028 bid\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan class=\"illus\">Illustrative · fictional plan, de-identified members\u003c/span>\u003cspan class=\"scope\">Scope · medical expense (Phase 1)\u003c/span>\u003c/div>\u003cdiv style=\"display:flex;gap:6px;align-items:center;white-space:nowrap\">\u003cspan class=\"stamp\">as of 12/31/26 · frozen 2/15/27\u003c/span>\u003cspan class=\"stamp\">v2.3.1 deterministic\u003c/span>\u003ca class=\"stamp\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">register r14 · #7f3ac91e\u003c/a>\u003ca class=\"stamp amber\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">sign-off 10/16\u003c/a>\u003ca class=\"stamp mint\" href=\"Ingest.dc.html\" onClick=\"{{nav.Ingest}}\" style=\"text-decoration:none\">GL gate · passed\u003c/a>\u003c/div>\u003c/div>\n\u003ca class=\"toplink\" href=\"Main.dc.html\" onClick=\"{{nav.Main}}\">Backtest\u003c/a>\n\u003ca class=\"toplink\" href=\"Pipeline.dc.html\" onClick=\"{{nav.Pipeline}}\">Architecture\u003c/a>\n\u003c/div>\n\u003cdiv class=\"content\">\n\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  \u003cdiv>\u003ch1 class=\"h1\">Pipeline overview\u003c/h1>\u003cdiv class=\"sub\">The visible architecture: data is reconciled and gated, members are forecast as distributions, and the population number feeds revenue, scenarios and the bid. One governance layer sits under all of it.\u003c/div>\u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-end\">\u003cdiv style=\"display:flex;gap:6px\">\u003cbutton class=\"tab {{tMap}}\" onClick=\"{{vMap}}\">Pipeline map\u003c/button>\u003cbutton class=\"tab {{tCal}}\" onClick=\"{{vCal}}\">Bid calendar overlay\u003c/button>\u003c/div>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:#0E7C6B\">\u003c/i>Statistical model\u003c/span>\u003cspan>\u003ci style=\"background:#FFFFFF;border:1px solid #5C6B68\">\u003c/i>LLM agent\u003c/span>\u003cspan>\u003ci style=\"background:#0F2A24\">\u003c/i>Gate or sign-off\u003c/span>\u003cspan>\u003ci style=\"border-top:1.5px dashed #D99A2B;height:0\">\u003c/i>PHI / BAA boundary\u003c/span>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003csc-if value=\"{{isMap}}\" hint-placeholder-val=\"{{ true }}\">\n\u003cdiv class=\"panel\" style=\"gap:14px\">\n  \u003cdiv class=\"ph\">\u003cspan>An explainable actuarial forecasting system, with AI inside\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click any stage\u003c/span>\u003c/div>\n  \u003csc-for list=\"{{rows}}\" as=\"row\" hint-placeholder-count=\"2\">\n  \u003cdiv style=\"display:flex;gap:8px;align-items:stretch\">\n    \u003csc-for list=\"{{row.items}}\" as=\"st\" hint-placeholder-count=\"5\">\n      \u003ca href=\"{{st.href}}\" onClick=\"{{st.go}}\" style=\"flex:1;min-width:0;border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-decoration:none;background:{{st.bg}};color:{{st.fg}};border:1px solid {{st.bd}}\">\u003cspan class=\"mono\" style=\"font-size:11.5px;opacity:.8\">{{st.no}} · {{st.kind}}\u003c/span>\u003cspan style=\"font-weight:600;font-size:15px;line-height:1.2\">{{st.t}}\u003c/span>\u003cspan style=\"font-size:13px;line-height:1.35;opacity:.9\">{{st.d}}\u003c/span>\u003c/a>\n    \u003c/sc-for>\n  \u003c/div>\n  \u003c/sc-for>\n  \u003cdiv class=\"mod3\">\n    \u003cdiv class=\"modc on\">\u003cspan style=\"font-weight:600;font-size:15px\">Medical expense engine\u003c/span>\u003cspan class=\"stamp mint\" style=\"font-size:11px;align-self:flex-start\">modeled · Phase 1\u003c/span>\u003cspan style=\"font-size:13.5px\">Member-level forecast and benefit simulation. Reusable outside MA for ACO and value-based contracts.\u003c/span>\u003c/div>\n    \u003cdiv class=\"modc\">\u003cspan style=\"font-weight:600;font-size:15px\">Revenue &amp; risk-adjustment engine\u003c/span>\u003cspan class=\"stamp\" style=\"font-size:11px;align-self:flex-start\">represented · Phase 2\u003c/span>\u003cspan style=\"font-size:13.5px\">Risk scores, CMS rules and revenue, driven by the same members and assumptions.\u003c/span>\u003c/div>\n    \u003cdiv class=\"modc\">\u003cspan style=\"font-weight:600;font-size:15px\">Administrative expense engine\u003c/span>\u003cspan class=\"stamp\" style=\"font-size:11px;align-self:flex-start\">represented · Phase 2\u003c/span>\u003cspan style=\"font-size:13.5px\">Admin load and program or vendor fees from intervention scenarios.\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"text-align:center;font-size:13px;color:#5C6B68\">three separate engines, one shared member, scenario and assumption layer: an intervention moves all three consistently\u003c/div>\n  \u003ca href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"background:#0F2A24;color:#F6F2EB;border-radius:4px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none\">\n    \u003cspan class=\"mono\" style=\"font-size:12px;letter-spacing:.08em;color:#7FE0C9;text-transform:uppercase\">Assumption &amp; governance layer · under every stage\u003c/span>\n    \u003cspan style=\"font-size:14px\">Source and provenance · owner · reviewer and approval · public baseline → Meridian → scenario override · confidence and interval · effective period · model impact · actual vs. expected\u003c/span>\n  \u003c/a>\n  \u003cdiv style=\"font-size:13.5px;color:#0A5A4E;font-style:italic\">Statistical models set every dollar. AI agents extract evidence from records and track public signals; they never set a number. PMABI runs beside the plan's bid process and consultant as a second opinion, not a replacement.\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{isCal}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"height:430px;border:1px solid #5C6B68;border-radius:4px;background:#FFFFFF;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n  \u003cdiv style=\"display:flex;justify-content:space-between;align-items:baseline\">\u003cdiv class=\"ph\" style=\"margin:0\">CY2028 bid cycle · plan milestones above the line, PMABI runs below\u003c/div>\u003cspan class=\"mono\" style=\"font-size:12.5px;color:#5C6B68\">runs beside the critical path, never on it\u003c/span>\u003c/div>\n  \u003cdiv style=\"display:grid;grid-template-columns:repeat(8, minmax(0, 1fr));gap:0;flex-grow:1\">\n    \u003csc-for list=\"{{cal}}\" as=\"c\" hint-placeholder-count=\"8\">\n    \u003cdiv style=\"display:flex;flex-direction:column;border-left:1px solid #EDE6DA;padding:0 8px;min-width:0\">\n      \u003cdiv class=\"mono\" style=\"font-size:12px;color:#5C6B68;height:30px;line-height:1.3\">{{c.when}}\u003c/div>\n      \u003cdiv style=\"height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding-bottom:8px\">\u003cspan style=\"font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a5f14\">{{c.kind}}\u003c/span>\u003cspan style=\"font-size:14px;font-weight:600;line-height:1.25\">{{c.plan}}\u003c/span>\u003c/div>\n      \u003cdiv style=\"height:3px;background:{{c.bar}};margin:0 -8px\">\u003c/div>\n      \u003cdiv style=\"padding-top:10px;display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-size:13.5px;line-height:1.35\">{{c.pm}}\u003c/span>\u003cspan class=\"stamp {{c.tc}}\" style=\"align-self:flex-start;font-size:11.5px\">{{c.turn}}\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003c/sc-for>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;gap:16px;align-items:center;border-top:1px solid #EDE6DA;padding-top:8px;font-size:13.5px\">\n    \u003cspan style=\"font-weight:600\">Work added vs. removed\u003c/span>\n    \u003cspan>Manual cohort cuts \u003cspan class=\"mono\">60 → 6 h\u003c/span>\u003c/span>\u003cspan class=\"dot\" style=\"color:#5C6B68\">·\u003c/span>\n    \u003cspan>Scenario turns \u003cspan class=\"mono\">3 × 2 wks → 30 × minutes\u003c/span>\u003c/span>\u003cspan class=\"dot\" style=\"color:#5C6B68\">·\u003c/span>\n    \u003cspan>Desk-review responses \u003cspan class=\"mono\">~40 → 8 h\u003c/span>\u003c/span>\u003cspan class=\"dot\" style=\"color:#5C6B68\">·\u003c/span>\n    \u003cspan>Added: register review \u003cspan class=\"mono\">+12 h\u003c/span>\u003c/span>\n    \u003cspan class=\"illus\" style=\"margin-left:auto\">illustrative · replace with Meridian's own estimate\u003c/span>\n  \u003c/div>\n\u003c/div>\n\u003cdiv style=\"font-size:14px;color:#0A5A4E;font-style:italic\">\"Nothing here is on your critical path. By the time the Rate Announcement lands, the only thing that changes is the rate.\"\u003c/div>\n\u003c/sc-if>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:16px;flex-grow:1\">\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">What statistical stages do\u003c/div>\u003cdiv class=\"note\" style=\"color:#0F2A24\">Build member-month profiles from claims, fills and labs; fit cost distributions; aggregate to cohorts and service categories; credibility-blend small PBPs; reconcile to ledger; reprice scenarios. Every output is a range with a stated interval. Same inputs + same version = same numbers.\u003c/div>\u003cdiv>\u003cspan class=\"stamp\">v2.3.1 · deterministic · seed 20261231\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">What agents do — and never do\u003c/div>\u003cdiv class=\"note\" style=\"color:#0F2A24\">Extract conditions and evidence from charts with reason codes and citations; track FDA launches, indication expansions and CMS policy from public sources; contact members for HRAs, refills and scheduling with a human escalation path.\u003cbr>\u003cbr>\u003cb>Never:\u003c/b> produce a dollar figure, make a diagnosis, decide a benefit, or send PHI to a third-party service outside the BAA.\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel ink\">\u003cdiv class=\"ph\">Reads\u003c/div>\u003cdiv class=\"note\" style=\"color:#F6F2EB\">Ingest is read-only, secure transfer, no core-system integration. Chart access via Datavant under Meridian's existing BAA. External signal agents see public data only. Human review queue on every agent finding. Full methodology and ASOP 23/25/41/56 mapping in the desk-review pack.\u003c/div>\u003cdiv style=\"display:flex;gap:8px\">\u003ca class=\"btn sm\" href=\"Main.dc.html\" onClick=\"{{nav.Main}}\">Start the walkthrough \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003ca class=\"btn sm ghost\" href=\"Export.dc.html\" onClick=\"{{nav.Export}}\" style=\"color:#F6F2EB;border-color:#7FE0C9\">Methodology memo\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1280}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\nconstructor(p){ super(p); this.state = { v: 'map' }; }\n_rv(){\n  const C = [\n    { when: 'Oct–Dec 2026', kind: 'data', plan: 'Base-period data closes; trend study begins', pm: 'Ingest, reconcile, backtest prior vintages; first member-level projection', turn: 'weeks · one-time setup', tc: '', bar: '#5C6B68' },\n    { when: 'Late Jan – early Feb 2027', kind: 'CMS', plan: 'Advance Notice', pm: 'Policy-shock pre-fill updated from the Notice; preliminary cohort and Rx read-out', turn: 'days', tc: '', bar: '#D99A2B' },\n    { when: 'First week Apr 2027', kind: 'CMS', plan: 'Rate Announcement (final)', pm: 'Re-run with final rates, V28 phase-in, Part D parameters; register refreshed', turn: 'hours', tc: 'mint', bar: '#D99A2B' },\n    { when: 'Apr – May 2027', kind: 'pricing', plan: 'Benefit design iterations; TBC checks', pm: 'Scenario turns; intervention credits set and haircut; register reviewed', turn: 'minutes / scenario', tc: 'mint', bar: '#0E7C6B' },\n    { when: 'Late May 2027', kind: 'actuary', plan: 'Actuarial certification; internal sign-off', pm: 'Methodology memo, BPT worksheet exports, desk-review pack', turn: 'same day', tc: 'mint', bar: '#0F2A24' },\n    { when: 'First Mon Jun 2027', kind: 'CMS', plan: 'Bid submission', pm: 'Register frozen; hash recorded', turn: '—', tc: '', bar: '#D99A2B' },\n    { when: 'Jun – Sep 2027', kind: 'CMS', plan: 'Desk review and audit questions', pm: 'Desk-review pack answers from the register and audit log', turn: 'hours', tc: 'mint', bar: '#D99A2B' },\n    { when: 'CY2028', kind: 'contract year', plan: 'Bid locked', pm: 'Program variance tracker runs monthly', turn: 'monthly', tc: '', bar: '#5C6B68' },\n  ];\n  const v = this.state.v;\n  const T = (no, t, d, href, kind) => ({ no, t, d, href, kind, bg: kind === 'gate' ? '#0F2A24' : kind === 'AI agents' ? '#FFFFFF' : '#0E7C6B', fg: kind === 'AI agents' ? '#0F2A24' : '#F6F2EB', bd: kind === 'AI agents' ? '#5C6B68' : 'transparent' });\n  const ST = [T(1, 'Source data', 'Claims, 834, PBM, charts, ADT; availability treated as a constraint', 'Ingest', 'statistical'), T(2, 'Reconciliation + data gate', 'Population and period checks; bridge to the general ledger', 'Ingest', 'gate'), T(3, 'Member-month state', 'Clinical, cost and data-completeness state per member', 'Profiles', 'statistical'), T(4, 'Clinical and cost drivers', 'Chronic progression, LTSS, Rx pathways; evidence read by agents', 'Cohorts', 'AI agents'), T(5, 'Probabilistic member forecast', 'Each member a distribution, drivers recombined', 'Forecast', 'statistical'),\n    T(6, 'Population forecast', 'Sum of members, by BPT category, with derived intervals', 'Forecast', 'statistical'), T(7, 'MA revenue + risk adjustment', 'Risk scores and revenue from the same members', 'DxGap', 'statistical'), T(8, 'Benefit + intervention scenarios', 'Simulated member by member', 'Scenarios', 'statistical'), T(9, 'Bid second opinion', 'Layer-by-layer comparison the actuary signs', 'Bid', 'gate'), T(10, 'Actual vs. expected', 'Recalibration; optional module', 'Variance', 'statistical')];\n  const nv = this._nav();\n  const rows = [ST.slice(0, 5), ST.slice(5)].map(items => ({ items: items.map(x => ({ ...x, go: nv[x.href], href: x.href + '.dc.html' })) }));\n  return { rows, cal: C, isMap: v === 'map', isCal: v === 'cal', tMap: v === 'map' ? 'on' : '', tCal: v === 'cal' ? 'on' : '', vMap: () => this.setState({ v: 'map' }), vCal: () => this.setState({ v: 'cal' }) };\n}\n\n_nav() { const g = this.props.go, o = {}; [\"Main\", \"Ingest\", \"Pipeline\", \"Profiles\", \"Member\", \"Cohorts\", \"Forecast\", \"RxPipeline\", \"DxGap\", \"Scenarios\", \"Interventions\", \"Variance\", \"Bid\", \"Register\", \"Export\"].forEach(k => { o[k] = e => { if (g) { if (e && e.preventDefault) e.preventDefault(); g(k); } }; }); return o; }\nrenderVals() { const v = this._rv(), nav = this._nav(); if (v.cur && v.cur.href) { const k = v.cur.href.replace('.dc.html', ''); v.cur = { ...v.cur, go: nav[k] }; } return { ...v, nav }; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>", "Scenarios.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Scenario workbench\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;background:#F6F2EB;color:#0F2A24;font-size:14.5px;line-height:1.4}\na{color:#0E7C6B;text-decoration:none}a:hover{color:#0A5A4E}\n*{box-sizing:border-box}\n.serif{font-family:Fraunces,'Source Serif 4',Georgia,serif;font-weight:600}\n.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}\n.rail{width:240px;height:100%;background:#0F2A24;color:#F6F2EB;display:flex;flex-direction:column;padding:20px 0 16px;position:relative;flex-shrink:0}\n.logo{padding:0 20px 18px;border-bottom:1px solid rgba(246,242,235,.12)}\n.logo .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;letter-spacing:.02em;color:#F6F2EB;line-height:1}\n.logo .tag{font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:#7FE0C9;margin-top:6px}\n.steps{position:relative;padding:16px 0 0 20px;flex-grow:1}\n.steps .line{position:absolute;left:31px;top:38px;width:1px;height:440px;background:#7FE0C9;transform-origin:top;animation:flow 2s ease-out 1}\n@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n.step{display:flex;align-items:center;gap:12px;height:44px;color:rgba(246,242,235,.72);position:relative}\n.step:hover{color:#F6F2EB}\n.step .g{width:24px;height:24px;border-radius:12px;border:1px solid rgba(127,224,201,.55);background:#0F2A24;display:flex;align-items:center;justify-content:center;color:#7FE0C9;flex-shrink:0;position:relative;z-index:1}\n.step.done .g{background:#0A5A4E;border-color:#0A5A4E;color:#7FE0C9}\n.step.cur{color:#F6F2EB;font-weight:600}\n.step.cur .g{background:#7FE0C9;color:#0F2A24;border-color:#7FE0C9;box-shadow:0 0 0 5px rgba(127,224,201,.22)}\n.step .l{font-size:14px}\n.phi{height:22px;margin:0 16px 0 0;border-top:1px dashed #D99A2B;padding-top:3px;box-sizing:border-box;display:flex;align-items:flex-start}\n.phi span{font-family:'IBM Plex Mono',Menlo,monospace;font-size:9px;letter-spacing:.06em;color:#D99A2B;text-transform:uppercase;line-height:1.3;background:#0F2A24;position:relative;z-index:1;padding-right:4px}\n.roadmap{padding:12px 20px 0;border-top:1px solid rgba(246,242,235,.12);font-size:12px;color:rgba(246,242,235,.38);line-height:1.5}\n.roadmap b{font-weight:500;color:rgba(246,242,235,.5);display:bloc
