<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMABI · Precision Bid Intelligence — clickable prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

body{margin:0;font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;background:#F6F2EB;color:#0F2A24;font-size:13px;line-height:1.35}
a{color:#0E7C6B;text-decoration:none}a:hover{color:#0A5A4E}
*{box-sizing:border-box}
.serif{font-family:Fraunces,'Source Serif 4',Georgia,serif;font-weight:600}
.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.rail{width:240px;height:100%;background:#0F2A24;color:#F6F2EB;display:flex;flex-direction:column;padding:20px 0 16px;position:relative;flex-shrink:0}
.logo{padding:0 20px 18px;border-bottom:1px solid rgba(246,242,235,.12)}
.logo .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;letter-spacing:.02em;color:#F6F2EB;line-height:1}
.logo .tag{font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:#7FE0C9;margin-top:6px}
.steps{position:relative;padding:16px 0 0 20px;flex-grow:1}
.steps .line{position:absolute;left:31px;top:38px;width:1px;height:418px;background:#7FE0C9;transform-origin:top;animation:flow 2s ease-out 1}
@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.step{display:flex;align-items:center;gap:12px;height:44px;color:rgba(246,242,235,.72);position:relative}
.step:hover{color:#F6F2EB}
.step .g{width:24px;height:24px;border-radius:12px;border:1px solid rgba(127,224,201,.55);background:#0F2A24;display:flex;align-items:center;justify-content:center;color:#7FE0C9;flex-shrink:0;position:relative;z-index:1}
.step.done .g{background:#0A5A4E;border-color:#0A5A4E;color:#7FE0C9}
.step.cur{color:#F6F2EB;font-weight:600}
.step.cur .g{background:#7FE0C9;color:#0F2A24;border-color:#7FE0C9;box-shadow:0 0 0 5px rgba(127,224,201,.22)}
.step .l{font-size:13px}
.phi{height:22px;margin:0 16px 0 0;border-top:1px dashed #D99A2B;padding-top:3px;box-sizing:border-box;display:flex;align-items:flex-start}
.phi span{font-family:'IBM Plex Mono',Menlo,monospace;font-size:9px;letter-spacing:.06em;color:#D99A2B;text-transform:uppercase;line-height:1.3;background:#0F2A24;position:relative;z-index:1;padding-right:4px}
.roadmap{padding:12px 20px 0;border-top:1px solid rgba(246,242,235,.12);font-size:11px;color:rgba(246,242,235,.38);line-height:1.5}
.roadmap b{font-weight:500;color:rgba(246,242,235,.5);display:block;font-family:'IBM Plex Mono',Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.top{height:56px;background:#F6F2EB;border-bottom:1px solid #5C6B68;display:flex;align-items:center;padding:0 32px;gap:20px;flex-shrink:0}
.top .crumbs{font-size:13px;color:#0F2A24;display:flex;gap:10px;align-items:center;flex-grow:1;white-space:nowrap;min-width:0}
.toplink{white-space:nowrap}
.top .crumbs .dot{color:#5C6B68}
.stamp{font-family:'IBM Plex Mono',Menlo,monospace;font-size:11px;letter-spacing:.04em;border:1px solid #0F2A24;padding:3px 8px;border-radius:4px;color:#0F2A24}
.stamp.mint{border-color:#0E7C6B;color:#0E7C6B}
.stamp.amber{border-color:#D99A2B;color:#8a5f14}
.illus{font-size:11px;color:#5C6B68;font-style:italic;max-width:190px;line-height:1.2}
.toplink{font-size:12px;color:#0E7C6B;border:1px solid #0E7C6B;border-radius:4px;padding:4px 10px;font-weight:500}
.main{flex-grow:1;display:flex;flex-direction:column;min-width:0;height:100%}
.content{padding:20px 32px 24px;flex-grow:1;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:28px;line-height:1.1;margin:0;color:#0F2A24}
.sub{font-size:13px;color:#5C6B68;margin-top:4px}
.panel{background:#FFFFFF;border:1px solid #5C6B68;border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.panel.sand{background:#EDE6DA}
.panel.ink{background:#0F2A24;color:#F6F2EB;border-color:#0F2A24}
.ph{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5C6B68;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.panel.ink .ph{color:#7FE0C9}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big.s{font-size:24px}
.t{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto}
.t th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5C6B68;font-weight:500;height:30px;border-bottom:1px solid #5C6B68;padding:0 6px;white-space:normal;line-height:1.2;vertical-align:bottom;padding-bottom:4px}
.t td{height:32px;padding:2px 6px;border-bottom:1px solid #EDE6DA;white-space:normal;vertical-align:middle;line-height:1.25}
.t td.num,.t td.mono{white-space:nowrap}
.t tr:nth-child(even) td{background:#FAF7F1}
.t .r,.t th.r{text-align:right}
.t .num{font-family:'IBM Plex Mono',Menlo,monospace;font-variant-numeric:tabular-nums;text-align:right}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#E6F2EE}
.t tr.sel td{background:#E0F0EB;box-shadow:inset 3px 0 0 #0E7C6B}
.pos{color:#0E7C6B}.neg{color:#8a5f14}.rust{color:#B5482D}
.badge{font-family:'IBM Plex Mono',Menlo,monospace;font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid #0F2A24;display:inline-block;line-height:1.3}
.b3{background:#0F2A24;color:#F6F2EB}.b2{background:#0E7C6B;color:#F6F2EB;border-color:#0E7C6B}.b1{background:#7FE0C9;color:#0F2A24;border-color:#7FE0C9}.b0{background:#EDE6DA;color:#5C6B68;border-color:#EDE6DA}
.tier{font-family:'IBM Plex Mono',Menlo,monospace;font-size:10.5px;letter-spacing:.04em}
.drill{position:absolute;top:0;right:0;bottom:0;width:460px;background:#FFFFFF;border-left:1px solid #5C6B68;padding:18px 20px;display:flex;flex-direction:column;gap:12px;animation:slide .28s ease-out 1;z-index:5;overflow:auto}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.drill .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drill .dt{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;line-height:1.15}
.xbtn{background:none;border:1px solid #5C6B68;border-radius:4px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#0F2A24;cursor:pointer;flex-shrink:0}
.btn{background:#0E7C6B;color:#F6F2EB;border:1px solid #0E7C6B;border-radius:4px;padding:0 14px;height:34px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:#0A5A4E;color:#F6F2EB}
.btn.ghost{background:transparent;color:#0F2A24;border-color:#0F2A24}
.btn.ghost:hover{background:#EDE6DA;color:#0F2A24}
.btn.sm{height:28px;font-size:12px;padding:0 10px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:12.5px}
.kv .v{overflow-wrap:anywhere}
.kv .k{color:#5C6B68}
.kv .v{font-family:'IBM Plex Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.foot{font-size:11px;color:#5C6B68;display:flex;justify-content:space-between;gap:20px;border-top:1px solid #EDE6DA;padding-top:8px}
.foot .mono{font-size:10.5px}
.note{font-size:12px;color:#5C6B68;line-height:1.45}
.lever{display:flex;flex-direction:column;gap:4px}
.lever label{font-size:12px;color:#0F2A24;display:flex;justify-content:space-between}
.lever label span{font-family:'IBM Plex Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lever input[type=range]{width:100%;accent-color:#0E7C6B;height:20px;margin:0}
.commit{font-family:'IBM Plex Mono',Menlo,monospace;font-size:11px;letter-spacing:.05em;border:1.5px solid #0E7C6B;color:#0A5A4E;padding:5px 10px;border-radius:3px;background:rgba(127,224,201,.18);display:inline-block}
.tab{font-size:12px;padding:6px 12px;border:1px solid #5C6B68;border-radius:4px;background:transparent;font-family:inherit;cursor:pointer;color:#0F2A24}
.tab.on{background:#0F2A24;color:#F6F2EB;border-color:#0F2A24}
.legend{display:flex;gap:14px;font-size:11px;color:#5C6B68;align-items:center}
.legend i{display:inline-block;width:14px;height:8px;margin-right:5px;vertical-align:middle}
.rc{font-family:'IBM Plex Mono',Menlo,monospace;font-size:10.5px;color:#0A5A4E;background:#E6F2EE;padding:1px 5px;border-radius:3px}

@keyframes draw{to{stroke-dashoffset:0}}
html,body{background:#0F2A24;margin:0;min-height:100%}
#wrap{width:100%;overflow:hidden}
#app{transform-origin:top left;width:1440px;margin:0 auto}
.rendered .steps .line{animation:none;transform:scaleY(1)}
.rendered path[marker-end]{animation:none!important;stroke-dashoffset:0!important}
#bar{font-family:'IBM Plex Mono',Menlo,monospace;font-size:11px;color:#7FE0C9;padding:8px 16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
#bar a{color:#7FE0C9;text-decoration:underline dotted}
</style>
</head>
<body>
<div id="bar"><span>PMABI · Precision Bid Intelligence · clickable prototype · Illustrative — fictional plan and members</span><span>Screens: <a href="#Main">1</a> · <a href="#Ingest">2</a> · <a href="#Pipeline">3</a> · <a href="#Profiles">4</a> · <a href="#Member">5</a> · <a href="#Cohorts">6</a> · <a href="#Forecast">7</a> · <a href="#RxPipeline">8</a> · <a href="#DxGap">9</a> · <a href="#Scenarios">10</a> · <a href="#Interventions">11</a> · <a href="#Bid">12</a> · <a href="#Export">13</a></span></div>
<div id="wrap"><div id="app"></div></div>
<script>
const SCREENS = {};
const TITLES = {"Main.dc.html": "Backtest read-out", "Ingest.dc.html": "Ingest & reconcile", "Pipeline.dc.html": "Pipeline overview", "Profiles.dc.html": "Member-month profiles", "Member.dc.html": "Member profile", "Cohorts.dc.html": "Cohorts", "Forecast.dc.html": "Population forecast", "RxPipeline.dc.html": "Rx pipeline", "DxGap.dc.html": "Diagnosis gap", "Scenarios.dc.html": "Scenario workbench", "Interventions.dc.html": "Intervention studio", "Bid.dc.html": "Bid comparison", "Export.dc.html": "Export to BPT"};
SCREENS["Main.dc.html"] = { tpl: "<div style=\"width: 1440px; height: 1080px; display: flex; flex-direction: row; background: #F6F2EB; overflow: hidden; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif; color: #0F2A24\">\n<div class=\"rail\">\n<div class=\"logo\"><div class=\"name\">PMABI</div><div class=\"tag\">Precision Bid Intelligence</div></div>\n<div class=\"steps\"><div class=\"line\"></div><a class=\"step done\" href=\"Ingest.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Ingest &amp; reconcile</span></a><a class=\"step done\" href=\"Profiles.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Member-month profiles</span></a><a class=\"step done\" href=\"Cohorts.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Cohorts</span></a><a class=\"step done\" href=\"Forecast.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Population forecast</span></a><div class=\"phi\"><span>PHI boundary \u00b7 public data only below</span></div><a class=\"step done\" href=\"RxPipeline.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Rx pipeline</span></a><a class=\"step done\" href=\"DxGap.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Dx gap</span></a><a class=\"step done\" href=\"Scenarios.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Scenario workbench</span></a><a class=\"step done\" href=\"Interventions.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Intervention studio</span></a><a class=\"step done\" href=\"Bid.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Bid comparison</span></a><a class=\"step done\" href=\"Export.dc.html\" style=\"text-decoration:none\"><span class=\"g\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"/></svg></span><span class=\"l\">Export to BPT</span></a></div>\n<div class=\"roadmap\"><b>Roadmap</b>Medicaid MCO \u00b7 Stop-loss<br/>(greyed: not in CY2028 scope)</div>\n</div>\n<div class=\"main\">\n<div class=\"top\">\n<div class=\"crumbs\"><span style=\"font-weight:600\">Meridian Health Plan</span><span class=\"dot\">\u00b7</span><span>CY2028 bid</span><span class=\"dot\">\u00b7</span><span>data as of <span class=\"mono\">Dec 31 2026</span> freeze</span><span class=\"dot\">\u00b7</span><span>model <span class=\"mono\">v2.3.1</span></span><span class=\"stamp\">deterministic \u00b7 v2.3.1</span></div>\n<span class=\"illus\">Illustrative \u2014 fictional plan and members</span>\n<a class=\"toplink\" href=\"Main.dc.html\">Backtest</a>\n<a class=\"toplink\" href=\"Pipeline.dc.html\">Pipeline overview</a>\n</div>\n<div class=\"content\">\n\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  <div><h1 class=\"h1\">Backtest read-out</h1><div class=\"sub\">Filed forecast vs. Challenger vs. actual PMPM for three past bid years, scored blind at each year's freeze date. Click a vintage for its calibration by cost decile; click a tail count to list the $100K+ members.</div></div>\n  <div class=\"legend\"><span><i style=\"background:#D99A2B\"></i>Filed forecast</span><span><i style=\"background:#0E7C6B\"></i>Challenger</span><span><i style=\"background:#0F2A24\"></i>Actual</span></div>\n</div>\n<div style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:16px\">\n  <div class=\"panel\"><div class=\"ph\">Filed PMPM error \u00b7 3-vintage avg</div><div class=\"big neg\">+163 bps</div><div class=\"note\">Aggregate miss vs. realized PMPM. At $2.52B of premium, 100 bps \u2248 <span class=\"mono\">$25.2M</span>.</div></div>\n  <div class=\"panel\"><div class=\"ph\">Challenger PMPM error \u00b7 3-vintage avg</div><div class=\"big pos\">+17 bps</div><div class=\"note\">Absolute error 30 bps; sign alternates across vintages, no systematic bias.</div></div>\n  <div class=\"panel\"><div class=\"ph\">$100K+ tail \u00b7 members missed by filed</div><div class=\"big\">275</div><div class=\"note\">Filed under-counted the tail in every vintage; Challenger within 4\u201318%.</div></div>\n  <div class=\"panel\"><div class=\"ph\">Interval coverage \u00b7 90% intervals</div><div class=\"big\">90%</div><div class=\"note\">88 / 91 / 90% of outcomes fell inside the stated 90% interval.</div></div>\n</div>\n<div style=\"display:grid;grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr);gap:16px;flex-grow:1;min-height:0\">\n  <div class=\"panel\">\n    <div class=\"ph\"><span>Trend ledger \u00b7 filed vs. Challenger vs. actual</span><span class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click a vintage \u2192 calibration \u00b7 click a tail \u2192 members</span></div>\n    <table class=\"t\">\n      <tr><th>Vintage</th><th class=\"r\">Filed PMPM</th><th class=\"r\">Challenger</th><th class=\"r\">Actual</th><th class=\"r\">Filed miss</th><th class=\"r\">Challenger err</th><th class=\"r\">Tail $100K+ filed \u2192 actual</th><th class=\"r\">Coverage</th></tr>\n      <sc-for list=\"{{vintages}}\" as=\"v\" hint-placeholder-count=\"3\">\n      <tr class=\"{{v.cls}}\" onClick=\"{{v.pick}}\"><td><span style=\"font-weight:600\">{{v.name}}</span><div style=\"font-size:11px;color:#5C6B68\">{{v.note}}</div></td><td class=\"num\">{{v.filed}}</td><td class=\"num\">{{v.chal}}</td><td class=\"num\">{{v.actual}}</td><td class=\"num neg\">{{v.fErr}}</td><td class=\"num pos\">{{v.cErr}}</td><td class=\"num\"><a href=\"#tail\" onClick=\"{{v.tail}}\" style=\"text-decoration:underline dotted\">{{v.tailTxt}}</a></td><td class=\"num\">{{v.cov}}</td></tr>\n      </sc-for>\n    </table>\n    <div class=\"note\">Errors are (forecast \u2212 actual) \u00f7 actual in bps of PMPM. \"Miss\" = realized PMPM exceeded the filed assumption. Backtest figures are illustrative; the pilot's success criterion (beat or match the filed forecast) is a contract term, not a product claim.</div>\n    <div class=\"foot\"><sp s 1/2/5 \u00b7 desk-review pack \u00b7 actuary signs</div></a>\n  <a href=\"Scenarios.dc.html\" style=\"position:absolute;left:436px;top:240px;width:168px;height:92px;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;background:#0E7C6B;color:#F6F2EB;border:1px solid #0E7C6B\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:600;font-size:13px\">Scenario layer</span><span style=\"opacity:.85\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M5 20V10M12 20V4M19 20v-7\"/></svg></span></div><div style=\"font-size:11px;opacity:.85;line-height:1.35\">benefit levers \u00b7 induced utilization \u00b7 TBC \u00b7 rebate reallocation</div></a>\n  <a href=\"Interventions.dc.html\" style=\"position:absolute;left:640px;top:240px;width:168px;height:92px;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;background:#FFFFFF;color:#0F2A24;border:1px solid #5C6B68\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:600;font-size:13px\">Intervention studio</span><span style=\"opacity:.85\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 12h8M8 9h5M8 15h6\"/></svg></span></div><div style=\"font-size:11px;opacity:.85;line-height:1.35\">programs priced back into the bid as disclosed assumptions</div></a>\n  <a href=\"DxGap.dc.html\" style=\"position:absolute;left:232px;top:240px;width:168px;height:92px;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;background:#FFFFFF;color:#0F2A24;border:1px solid #5C6B68\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:600;font-size:13px\">Evidence agents \u00b7 Dx gap</span><span style=\"opacity:.85\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 12h8M8 9h5M8 15h6\"/></svg></span></div><div style=\"font-size:11px;opacity:.85;line-height:1.35\">LLM reads charts: extracts, classifies, cites \u2014 never sets a number</div></a>\n  <a href=\"RxPipeline.dc.html\" style=\"position:absolute;left:964px;top:104px;width:156px;height:92px;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;background:#FFFFFF;color:#0F2A24;border:1px solid #5C6B68\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:600;font-size:13px\">External signal agents</span><span style=\"opacity:.85\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 12h8M8 9h5M8 15h6\"/></svg></span></div><div style=\"font-size:11px;opacity:.85;line-height:1.35\">Rx pipeline \u00b7 policy \u00b7 market \u2014 <b>public data only</b>, no PHI crosses out</div></a>\n  <a href=\"Interventions.dc.html\" style=\"position:absolute;left:964px;top:240px;width:156px;height:92px;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;background:#FFFFFF;color:#0F2A24;border:1px solid #5C6B68\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:600;font-size:13px\">Outreach agents</span><span style=\"opacity:.85\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 12h8M8 9h5M8 15h6\"/></svg></span></div><div style=\"font-size:11px;opacity:.85;line-height:1.35\">HRA \u00b7 GLP-1 persistence \u00b7 scheduling \u2014 inside BAA, human-in-the-loop</div></a>\n  <div style=\"position:absolute;left:28px;top:352px;font-size:12px;color:#0A5A4E;font-style:italic\">AI extracts evidence and tracks signals \u2014 it never sets a dollar. Statistical models compute the dollars.</div>\n</div>\n<div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:16px;flex-grow:1\">\n  <div class=\"panel\"><div class=\"ph\">What statistical stages do</div><div class=\"note\" style=\"color:#0F2A24\">Build member-month profiles from claims, fills and labs; fit cost distributions; aggregate to cohorts and service categories; credibility-blend small PBPs; reconcile to ledger; reprice scenarios. Every output is a range with a stated interval. Same inputs + same version = same numbers.</div><div><span class=\"stamp\">v2.3.1 \u00b7 deterministic \u00b7 seed 20261231</span></div></div>\n  <div class=\"panel\"><div class=\"ph\">What agents do \u2014 and never do</div><div class=\"note\" style=\"color:#0F2A24\">Extract conditions and evidence from charts with reason codes and citations; track FDA launches, indication expansions and CMS policy from public sources; contact members for HRAs, refills and scheduling with a human escalation path.<br/><br/><b>Never:</b> produce a dollar figure, make a diagnosis, decide a benefit, or send PHI to a third-party service outside the BAA.</div></div>\n  <div class=\"panel ink\"><div class=\"ph\">Reads</div><div class=\"note\" style=\"color:#F6F2EB\">Ingest is read-only, secure transfer, no core-system integration. Chart access via Datavant under Meridian's existing BAA. External signal agents see public data only. Human review queue on every agent finding. Full methodology and ASOP 23/25/41/56 mapping in the desk-review pack.</div><div style=\"display:flex;gap:8px\"><a class=\"btn sm\" href=\"Main.dc.html\">Start the walkthrough <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/></svg></a><a class=\"btn sm ghost\" href=\"Export.dc.html\" style=\"color:#F6F2EB;border-color:#7FE0C9\">Methodology memo</a></div></div>\n</div>\n\n</div>\n</div>\n</div>", make: function(DCLogic){

ap:4px\"><sc-for list=\"{{m.badges}}\" as=\"b\" hint-placeholder-count=\"3\"><span class=\"badge b{{b.s}}\">{{b.l}}</span></sc-for></div></td><td><a href=\"Member.dc.html\" aria-label=\"Open profile\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/></svg></a></td></tr>\n    </sc-for></table>\n    <div class=\"foot\"><span>Click a member \u2192 evidence chain. Cohort labels describe clinical or benefit status, never demographics.</span><span class=\"mono\">scale $0 \u2013 $150K</span></div>\n  </div>\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div class=\"panel sand\"><div class=\"ph\">Confidence follows evidence</div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span class=\"badge b3\">RX</span> <span class=\"badge b3\">LAB</span> <span class=\"badge b2\">DX\u00d73</span> <span class=\"badge b1\">DX\u00d71</span> <span class=\"badge b0\">SDOH</span></div>\n      <div class=\"note\">Badge fill darkens with evidence strength. Pharmacy fills are the most honest data a plan has; labs add the most; a single diagnosis on one claim earns the least.</div>\n    </div>\n    <div class=\"panel\"><div class=\"ph\">Confidence tiers \u00b7 book</div>\n      <table class=\"t\"><tr><th>Tier</th><th class=\"r\">Members</th><th class=\"r\">Share</th></tr>\n        <tr><td><span class=\"tier\" style=\"color:#0A5A4E\">HIGH</span> \u00b7 Rx + labs</td><td class=\"num\">71,040</td><td class=\"num\">48%</td></tr>\n        <tr><td><span class=\"tier\" style=\"color:#8a5f14\">MED</span> \u00b7 repeated dx</td><td class=\"num\">55,500</td><td class=\"num\">37.5%</td></tr>\n        <tr><td><span class=\"tier\" style=\"color:#B5482D\">LOW</span> \u00b7 thin history</td><td class=\"num\">21,460</td><td class=\"num\">14.5%</td></tr>\n      </table>\n      <div class=\"note\">Low-tier members widen their interval rather than shrink it, and are first in line for HRA outreach.</div>\n    </div>\n    <div class=\"panel\"><div class=\"ph\">Profile inputs</div><div class=\"note\" style=\"color:#0F2A24\">Claims (5 yrs) \u00b7 pharmacy fills \u00b7 labs (41% of members) \u00b7 834 status \u00b7 Medicaid LTSS \u00b7 ADI / ZIP proxy \u00b7 prior RAF. Each profile carries its as-of date and model version.</div></div>\n  </div>\n</div>\n\n</div>\n</div>\n</div>", make: function(DCLogic){ 
class Component extends DCLogic {

rb(lo, med, hi, mn, mx, W) {
  const s = v => Math.round((v - mn) / (mx - mn) * W);
  const l80 = med - (med - lo) * .7, h80 = med + (hi - med) * .7;
  const l50 = med - (med - lo) * .35, h50 = med + (hi - med) * .35;
  return { x95: s(lo), w95: s(hi) - s(lo), x80: s(l80), w80: s(h80) - s(l80), x50: s(l50), w50: s(h50) - s(l50), mx: s(med) };
}
fmt$(v) { return v >= 1000 ? '$' + Math.round(v / 1000) + 'K' : '$' + v; }

constructor(p){ super(p); this.state = { q: '' }; }
renderVals() {

  const q = this.state.q.toLowerCase();

    .map(m => ({ ...m, ...this.rb(m.lo, m.med, m.hi, 0, 150000, 150), loT: this.fmt$(m.lo), medT: this.fmt$(m.med), hiT: this.fmt$(m.hi), tierT: m.tier.toUpperCase(), tierCol: { high: '#0A5A4E', med: '#8a5f14', low: '#B5482D' }[m.tier] }));
  return { q: this.state.q, setQ: (e) => this.setState({ q: e.target.value }), rows, n: rows.length };
}

}

 return Component; } };

"140\" viewBox=\"0 0 440 140\" style=\"display:block\">\n<line x1=\"36\" x2=\"430\" y1=\"120\" y2=\"120\" stroke=\"#5C6B68\" stroke-opacity=\".4\"/><line x1=\"36\" x2=\"36\" y1=\"8\" y2=\"120\" stroke=\"#5C6B68\" stroke-opacity=\".4\"/>\n<text x=\"6\" y=\"14\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">100%</text><text x=\"14\" y=\"122\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">0</text>\n<path d=\"M36 120 C 90 110, 130 70, 200 48 S 340 28, 430 26\" fill=\"none\" stroke=\"#0E7C6B\" stroke-width=\"2\"/>\n<path d=\"M36 8 C 100 10, 150 50, 220 66 S 360 66, 430 68\" fill=\"none\" stroke=\"#D99A2B\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/>\n<text x=\"250\" y=\"42\" font-size=\"10\" fill=\"#0A5A4E\" font-family=\"IBM Plex Mono,Menlo,monospace\">uptake (cumulative starts)</text>\n<text x=\"250\" y=\"86\" font-size=\"10\" fill=\"#8a5f14\" font-family=\"IBM Plex Mono,Menlo,monospace\">persistence \u00b7 47% at 12 mo</text>\n<text x=\"36\" y=\"134\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">m0</text><text x=\"230\" y=\"134\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">m12</text><text x=\"416\" y=\"134\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">m24</text>\n</svg>\n  <div class=\"ph\">Eligible members \u00b7 highest projected effect (fictional)</div>\n  <table class=\"t\"><tr><th>Member</th><th class=\"r\">P(start)</th><th class=\"r\">\u0394 cost if persists</th><th>Evidence</th></tr>\n    <sc-for list=\"{{cur.members}}\" as=\"m\" hint-placeholder-count=\"4\"><tr><td><a href=\"Member.dc.html\">{{m.n}}</a></td><td class=\"num\">{{m.p}}</td><td class=\"num\">{{m.d}}</td><td class=\"mono\" style=\"font-size:10.5px\">{{m.ev}}</td></tr></sc-for>\n  </table>\n  <div class=\"note\">Clinical criteria applied to member profiles produce an auditable, member-level eligible cohort per drug and i     { name: 'GLP-1 · CKD indication expansion', kind: 'indication expansion', src: 'FDA label · Q1 2027 (pending)', status: 'tracking', n: 2900, uptake: .18, phase: 'Bridge → Part D 2028', base: 9, rc: 'RC-SIG-GLP-04', crit: 'T2DM with CKD 3a–4 (eGFR 15–59) and UACR ≥ 30.', iv: '+5 to +13 bps', members: [{n:'Dolores Whitfield',p:'34%',d:'+$3.6K',ev:'RX·LAB'},{n:'Walter Grayson',p:'52%',d:'+$3.9K',ev:'LAB·RX'},{n:'Mei-Ling Chow',p:'41%',d:'+$3.7K',ev:'LAB·SDOH'},{n:'Harold Pemberton',p:'29%',d:'+$3.5K',ev:'LAB·DX×3'}] },
    { name: 'Alzheimer\'s DMT · maintenance-dosing label change', kind: 'label change · Part B infusion', src: 'FDA label · CMS NCD', status: 'approved', n: 620, uptake: .15, phase: 'Part B', base: 6, rc: 'RC-SIG-ADT-02', crit: 'MCI or mild dementia dx with confirmed amyloid status; infusion-capable site within 40 mi.', iv: '+3 to +9 bps', members: [{n:'Gerald Fitzwilliam',p:'22%',d:'+$26K',ev:'DX×3'},{n:'Linda Tran',p:'9%',d:'+$26K',ev:'DX×1'},{n:'Beatrice Kowalczyk',p:'18%',d:'+$26K',ev:'DX×3'}] },
    { name: 'Biosimilar entry · anti-IL-12/23 class', kind: 'biosimilar · cost-reducing', src: 'FDA approval · launch Q2 2027', status: 'approved', n: 1140, uptake: .55, phase: 'catastrophic', base: -4, rc: 'RC-SIG-BIO-07', crit: 'Active fills of reference product; formulary preference assumed.', iv: '−2 to −6 bps', members: [{n:'Esther Nakamura',p:'70%',d:'−$9.1K',ev:'RX·DX×3'},{n:'Thomas Achterberg',p:'66%',d:'−$9.1K',ev:'RX·LAB'},{n:'Yolanda Reyes-Cruz',p:'58%',d:'−$9.1K',ev:'RX'}] },

;color:#5C6B68\">{{s.id}}</span><span class=\"mono\" style=\"font-size:11px\">{{s.margin}}</span></div><span style=\"font-weight:500;font-size:12.5px\">{{s.name}}</span><span style=\"font-size:11px;color:#5C6B68\">{{s.desc}}</span></div>\n    </sc-for>\n    <div class=\"note\">Scenarios and interventions combine: \"keep dental, fund it with deprescribing + LTSS staging\" is S-03.</div>\n  </div>\n  <div style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n    <div class=\"panel sand\">\n      <div class=\"ph\"><span>Benefit levers \u00b7 {{curName}}</span><span class=\"mono\" style=\"text-transform:none;letter-spacing:0\">every lever visible, every assumption overridable</span></div>\n      <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px 24px\">\n        <div class=\"lever\"><label for=\"dental\">Dental annual cap<span>{{dentalT}}</span></label><input id=\"dental\" type=\"range\" min=\"0\" max=\"3000\" step=\"250\" value=\"{{dental}}\" onChange=\"{{set_dental}}\"/></div>\n        <div class=\"lever\"><label for=\"otc\">OTC allowance \u00b7 per quarter<span>{{otcT}}</span></label><input id=\"otc\" type=\"range\" min=\"0\" max=\"200\" step=\"10\" value=\"{{otc}}\" onChange=\"{{set_otc}}\"/></div>\n        <div class=\"lever\"><label for=\"rides\">Transportation rides \u00b7 per year<span>{{ridesT}}</span></label><input id=\"rides\" type=\"range\" min=\"0\" max=\"48\" step=\"4\" value=\"{{rides}}\" onChange=\"{{set_rides}}\"/></div>\n        <div class=\"lever\"><label for=\"pbg\">Part B premium giveback \u00b7 per month<span>{{pbgT}}</span></label><input id=\"pbg\" type=\"range\" min=\"0\" max=\"50\" step=\"5\" value=\"{{pbg}}\" onChange=\"{{set_pbg}}\"/></div>\n      </div>\n    </div>\n    <div class=\"panel\" style=\"flex-grow:1\">\n      <div class=\"ph\"><span>Induced utilization \u00b7 per cohort, disclosed</span><span class=\"mono\" style=\"text-transform:none;letter-spacing:0\">assumptions from Meridian's 2024 /span><span class=\"v\">{{tbcT}}</span><span class=\"k\">Limit assumption</span><span class=\"v\">$36.00 \u00b7 [update on CY2028 Final Notice]</span><span class=\"k\">Status</span><span class=\"v {{tbcCls}}\">{{tbcS}}</span></div>\n    </div>\n    <sc-if value=\"{{cmpOn}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"panel sand\"><div class=\"ph\">Side by side \u00b7 vs. S-01 filed design</div>\n      <table class=\"t\" style=\"background:transparent\"><tr><th></th><th class=\"r\">S-01</th><th class=\"r\">{{curId}}</th></tr>\n        <tr><td>Dental cap</td><td class=\"num\">$2,000</td><td class=\"num\">{{dentalT}}</td></tr>\n        <tr><td>OTC / qtr</td><td class=\"num\">$100</td><td class=\"num\">{{otcT}}</td></tr>\n        <tr><td>Rides / yr</td><td class=\"num\">24</td><td class=\"num\">{{ridesT}}</td></tr>\n        <tr><td>Part B giveback</td><td class=\"num\">$0</td><td class=\"num\">{{pbgT}}</td></tr>\n        <tr><td>Margin</td><td class=\"num\">2.5%</td><td class=\"num\" style=\"font-weight:600\">{{marginT}}</td></tr>\n      </table></div>\n    </sc-if>\n    <div class=\"note\">Scenario margin is on the Challenger forecast. To fund a benefit with programs, open the <a href=\"Interventions.dc.html\">Intervention studio</a>; committed programs appear on the <a href=\"Bid.dc.html\">Bid comparison</a>.</div>\n  </div>\n</div>\n\n</div>\n</div>\n</div>", make: function(DCLogic){ 
class Component extends DCLogic {

constructor(p){ super(p); this.state = { cur: 0, cmp: false, sc: [
  { id: 'S-01', name: 'Filed benefit design', desc: 'baseline · as drafted for CY2028', dental: 2000, otc: 100, rides: 24, pbg: 0, prog: 0 },
  { id: 'S-02', name: 'Dental cap $2,000 → $1,500', desc: 'retrenchment option', dental: 1500, otc: 100, rides: 24, pbg: 0, prog: 0 },
  { id: 'S-03', name: 'Keep dental, fund with programs', desc: 'deprescribing + LTSS staging offsets', dental: 2000, otc: 100, rides: 24, pbg: 0, prog: 14 },
  { id: 'S-04', name: 'Drop Part B giveback, add rides', desc: 'shift rebate toward SDoH', dental: 2000, otc: 100, rides: 36, pbg: 0, prog: 0 },
] }; }
calc(sc) {
  const ben = sc.dental * .19 / 12 + sc.otc * 4 * .85 / 12 + sc.rides * 22 * .30 / 12 + sc.pbg;
  const base = 2000 * .19 / 12 + 100 * 4 * .85 / 12 + 24 * 22 * .30 / 12;
  const ind = sc.dental * .0021 + sc.otc * .012 + sc.rides * .04;
  const indB = 2000 * .0021 + 100 * .012 + 24 * .04;
  const off = sc.rides * .11 + sc.otc * .02;
  const offB = 24 * .11 + 100 * .02;
  const net = (ben - base) + (ind - indB) - (off - offB);
  const margin = 2.5 - net / 1525.08 * 100 + sc.prog / 100;
  return { ben, ind, off, net, margin, tbc: (ben - base) * -1 + (sc.pbg) };
}
renderVals() {
  const s = this.state, sc = s.sc[s.cur], c = this.calc(sc);
  const m = v => (v < 0 ? '−' : '') + '$' + Math.abs(v).toFixed(2);
  const set = k => e => { const arr = s.sc.map((x, i) => i === s.cur ? { ...x, [k]: +e.target.value } : x); this.setState({ sc: arr }); };
  const iu = [
    { n: 'LTSS ramp', m: '2,140', dw: .3, ow: 1.4, tw: 1.6 }, { n: 'New-to-plan duals', m: '5,200', dw: .9, ow: 1.2, tw: 1.1 }, { n: 'Polypharmacy + transport', m: '1,900', dw: .4, ow: 1.5, tw: 2.2 }, { n: 'GLP-1 eligible', m: '9,800', dw: 1.1, ow: .9, tw: .5 }, { n: 'Rest of book', m: '128,960', dw: 1.0, ow: 1.0, tw: .6 },
  ].map(r => { const d = sc.dental * .0021 * r.dw, o = sc.otc * .012 * r.ow, t = sc.rides * .04 * r.tw; return { ...r, d: m(d), o: m(o), t: m(t), ind: m(d + o + t), off: m(sc.rides * .11 * r.tw * .6 + sc.otc * .02 * r.ow * .5) }; });
  const dB = Math.round((c.margin - 2.5) * 100);
  return {
    list: s.sc.map((x, i) => ({ ...x, margin: this.calc(x).margin.toFixed(2) + '%', cls: i === s.cur ? 'sel' : '', pick: () => this.setState({ cur: i }) })),
    curName: sc.id + ' · ' + sc.name, curId: sc.id,
    dental: sc.dental, dentalT: '$' + sc.dental.toLocaleString(), set_dental: set('dental'),
    otc: sc.otc, otcT: '$' + sc.otc, set_otc: set('otc'),
    rides: sc.rides, ridesT: sc.rides + ' rides', set_rides: set('rides'),
    pbg: sc.pbg, pbgT: '$' + sc.pbg + '/mo', set_pbg: set('pbg'),
    iu, benT: m(c.ben), indT: m(c.ind), offT: '−' + m(c.off).replace('−', ''), netT: m(c.net) + ' PMPM', rebT: m(-(c.ben - (2000 * .19 / 12 + 100 * 4 * .85 / 12 + 24 * 22 * .30 / 12))) + ' available',
    marginT: c.margin.toFixed(2) + '%', mCls: c.margin >= 2.5 ? 'pos' : 'neg', dBps: (dB >= 0 ? '+' : '') + dB + ' bps',
    tbcT: m(c.tbc), tbcS: Math.abs(c.tbc) <= 36 ? 'within limit' : 'EXCEEDS · revise', tbcCls: Math.abs(c.tbc) <= 36 ? 'pos' : 'rust',
    turn: 4 + s.cur, dup: () => { const n = { ...sc, id: 'S-0' + (s.sc.length + 1), name: sc.name + ' (copy)', desc: 'duplicated · edit levers' }; this.setState({ sc: [...s.sc, n], cur: s.sc.length }); },
    cmp: () => this.setState({ cmp: !s.cmp }), cmpOn: s.cmp, cmpT: s.cmp ? 'Hide comparison' : 'Compare side by side',
  };
}

}

 return Component; } };

lass=\"l\">Export to BPT</span></a></div>\n<div class=\"roadmap\"><b>Roadmap</b>Medicaid MCO \u00b7 Stop-loss<br/>(greyed: not in CY2028 scope)</div>\n</div>\n<div class=\"main\">\n<div class=\"top\">\n<div class=\"crumbs\"><span style=\"font-weight:600\">Meridian Health Plan</span><span class=\"dot\">\u00b7</span><span>CY2028 bid</span><span class=\"dot\">\u00b7</span><span>data as of <span class=\"mono\">Dec 31 2026</span> freeze</span><span class=\"dot\">\u00b7</span><span>model <span class=\"mono\">v2.3.1</span></span><span class=\"stamp\">deterministic \u00b7 v2.3.1</span></div>\n<span class=\"illus\">Illustrative \u2014 fictional plan and members</span>\n<a class=\"toplink\" href=\"Main.dc.html\">Backtest</a>\n<a class=\"toplink\" href=\"Pipeline.dc.html\">Pipeline overview</a>\n</div>\n<div class=\"content\">\n\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  <div><h1 class=\"h1\">Intervention studio</h1><div class=\"sub\">Pick a program (it selects its cohort), set reach, engagement and adherence, and review the re-forecast. Commit the net effect to the bid as a disclosed assumption, or zero it. Switch views to see the same lines as the actuary sees them.</div></div>\n  <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"font-size:12px;color:#5C6B68\">View:</span><button class=\"tab {{tabOps}}\" onClick=\"{{viewOps}}\">Operator</button><button class=\"tab {{tabAct}}\" onClick=\"{{viewAct}}\">What the actuary sees</button></div>\n</div>\n<div style=\"display:grid;grid-template-columns:minmax(0, 1fr) 420px;gap:16px;flex-grow:1;min-height:0\">\n  <div style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n    <div class=\"panel\">\n      <div class=\"ph\"><span>1 \u00b7 Pick a program (selects its cohort)</span><span class=\"mono\" style=\"text-transform:none;letter-spacing:0\">library \u00b7 cost, reach, effect, evidence, confidence</span></div>\n      <table class=\"t\"><tr><th>Program  font-family=\"IBM Plex Mono,Menlo,monospace\">\u221260 bps</text>\n        <rect x=\"200\" y=\"{{wf.y3}}\" width=\"60\" height=\"{{wf.h3}}\" fill=\"#7FE0C9\"/><text x=\"230\" y=\"186\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">{{wf.l3}}</text>\n        <rect x=\"280\" y=\"{{wf.y4}}\" width=\"60\" height=\"{{wf.h4}}\" fill=\"#0F2A24\"/><text x=\"310\" y=\"186\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">{{wf.l4}}</text>\n        <text x=\"70\" y=\"{{wf.t1}}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0F2A24\" font-family=\"IBM Plex Mono,Menlo,monospace\">3.1%</text>\n        <text x=\"150\" y=\"{{wf.t2}}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0F2A24\" font-family=\"IBM Plex Mono,Menlo,monospace\">2.5%</text>\n        <text x=\"310\" y=\"{{wf.t4}}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0F2A24\" font-family=\"IBM Plex Mono,Menlo,monospace\">{{wf.l4b}}</text>\n      </svg>\n      <div class=\"note\">Ties exactly to the <a href=\"Bid.dc.html\">Bid comparison</a>: committed net = <span class=\"mono\">{{totT}}</span> ({{totUsd}}).</div>\n    </div>\n    <sc-if value=\"{{isOps}}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"panel\" style=\"flex-grow:1\">\n      <div class=\"ph\"><span>Committed to bid \u00b7 {{nCommitted}} programs</span><span class=\"mono\" style=\"text-transform:none;letter-spacing:0\">tracked actual vs. assumed monthly</span></div>\n      <table class=\"t\"><tr><th>Program</th><th class=\"r\">Net bps</th><th class=\"r\">80% CI</th><th>Reviewer</th></tr>\n      <sc-for list=\"{{committed}}\" as=\"c\" hint-placeholder-count=\"6\"><tr class=\"click\" onClick=\"{{c.pick}}\"><td style=\"white-space:normal\">{{c.short}}</td><td class=\"num {{c.ecls}}\" style=\"font-weight:600\">{{c.netT}}</td><td class=\"num\" style=\"color:#5C6B68\">{{c.ciT}}</td><td class=\"mono\" style=\"font-size:11px\">{{c.rev}}</ class Component extends DCLogic {

constructor(p){ super(p);

}
progs() { return [
  { id: 'hra', name: 'AI outreach agent: HRA and welcome calls', short: 'HRA agent · new-to-plan duals', cohort: 'New-to-plan duals', n: 5200, mech: 'Voice/text agent completes HRAs, confirms meds, identifies LTSS need early; warm-transfers to a nurse for clinical judgment; every call documented', cost: 4.10, base: -6, basis: 'HRA completion 35% → 80%; earlier LTSS staging', agent: true, rev: 'J. Alvarez', esc: 'RN care manager (warm transfer) · social worker for LTSS need', queue: '38 in queue', transcript: 'Agent: Hi, this is Meridian\'s automated assistant calling about your health assessment — it\'s okay to say stop at any time. Is this Linda?\nMember: Yes.\nAgent: Thank you. I\'ll ask a few questions about daily activities. Do you get help at home with bathing or dressing?\nMember: My daughter helps, but she works now.\nAgent: Understood — I\'m noting that you may need more support at home. A nurse will call you within two days to talk through options. [flag: LTSS-need · escalate]' },
  { id: 'glp', name: 'AI outreach agent: GLP-1 start and persistence', short: 'GLP-1 persistence agent', cohort: 'GLP-1 eligible + started', n: 9800, mech: 'Monthly check-ins on side effects, refills, titration; escalates to pharmacist; feeds persistence back into the Rx pipeline model', cost: 2.60, base: -4, basis: 'Persistence 47% → 58%; cost up year 1, avoided CV events net −4 bps in year 2', agent: true, rev: 'R. Patel, PharmD', esc: 'Pharmacist (side effects, titration) · PCP office for refills', queue: '112 in queue', transcript: 'Agent: This is Meridian\'s automated check-in — say stop anytime. Since your last refill, have you had nausea that kept you from taking your dose?\nMember: A little the first week.\nAgent: That\'s common early on. Your refill is due in 6 days; would a reminder text help?\nMember: Yes.\nAgent: Done. I\'ve also noted the nausea for your pharmacist to review. [flag: side-effect · pharmacist review]' },
  { id: 'dep', name: 'Polypharmacy deprescribing review', short: 'Deprescribing review', cohort: '≥10 meds + transport-insecure', n: 1900, mech: 'Pharmacist-led review, ranked and reason-coded from Rx evidence; agent schedules and reminds', cost: 6.80, base: -9, basis: 'Pilot read-out Q3 2027 (planned); literature ADE reduction', agent: true, rev: 'R. Patel, PharmD', esc: 'Pharmacist conducts the review; agent only schedules', queue: '17 in queue', transcript: 'Agent: Hi Dolores, this is Meridian\'s automated scheduling assistant. Your pharmacist would like a 20-minute call to go over your medications. Would Tuesday at 10 or Thursday at 2 work?\nMember: Thursday.\nAgent: Thursday at 2, confirmed. I\'ll text a reminder the day before. [no clinical content]' },
  { id: 'ckd', name: 'CKD progression program', short: 'CKD progression program', cohort: 'CKD 3b → 4', n: 1250, mech: 'Nephrology referral, home labs, dialysis-modality education before crash starts; agent handles scheduling and lab reminders', cost: 9.40, base: -5, basis: 'Fewer emergent dialysis starts; nephrology co-management evidence', agent: true, rev: 'Dr. K. Mbeki', esc: 'Nephrology nurse navigator', queue: '9 in queue', transcript: 'Agent: This is Meridian\'s automated assistant with a reminder: your home kidney lab kit arrives Monday. Would you like the courier to call first?\nMember: Yes please.\nAgent: Noted. Your nephrology visit is March 4; a ride is booked. [flag: none]' },
  { id: 'trn', name: 'Transport and SDoH concierge', short: 'Transport concierge', cohort: 'Transport-insecure ZIPs', n: 3400, mech: 'Ride benefit routed by the agent to members projected to miss care; reduces avoidable ED', cost: 3.20, base: -3, basis: 'Missed-visit → ED linkage in Meridian claims 2024–26', agent: true, rev: 'M. Osei, RN', esc: 'Member services for benefit questions', queue: '24 in queue', transcript: 'Agent: Hi, this is Meridian\'s automated ride assistant. You have a nephrology visit Thursday at 2. Would you like a ride booked?\nMember: Yes.\nAgent: Pickup at 1:15, confirmed. Reply STOP to end these messages.' },

calc(p, reach, eng, adh) {
  const f = (reach / 80) * (eng / 60) * (adh / 70);

  return { net, gross: net - (p.base > 0 ? -costBps : costBps) * Math.sign(p.base), costBps, lo: Math.round(net * .45 * 10) / 10, hi: Math.round(net * 1.45 * 10) / 10 };

renderVals() {

  const committed = s.committed.map(e => { const p = P.find(x => x.id === e.id); const k = this.calc(p, e.reach, e.eng, e.adh); return { ...p, netT: sg(k.net), ecls: k.net < 0 ? 'pos' : 'neg', ciT: sg(k.lo) + ' to ' + sg(k.hi), net: k.net, lo: k.lo, hi: k.hi, pick: () => { const i = P.findIndex(x => x.id === e.id); this.setState({ cur: i, reach: e.reach, eng: e.eng, adh: e.adh }); } }; });

  const memo = committed.map(x => `${x.short}: ${sg(x.net)}, 80% interval ${sg(x.lo)} to ${sg(x.hi)}, basis: ${x.basis}, reviewer: ${x.rev}`).join('\n') + `\n\nCare-management offset (expense side): −${committed.filter(x => x.net < 0).reduce((a, x) => a + Math.abs(x.net), 0).toFixed(0)} bps. Diagnosis-confirmation (revenue side): +${committed.filter(x => x.net > 0).reduce((a, x) => a + x.net, 0).toFixed(0)} bps. Combined effect on medical margin: +${tot.toFixed(0)} bps, 80% interval +${lo.toFixed(0)} to +${hi.toFixed(0)}. All lines subject to actuarial haircut; none guaranteed.`;

    grossT: sg(cur.base < 0 ? c.net - c.costBps : c.net + c.costBps), costT: '+' + c.costBps.toFixed(1) + ' bps ($' + cur.cost.toFixed(2) + ' PMPM)', netT: sg(c.net), ciT: sg(c.lo) + ' to ' + sg(c.hi),

    commit: () => { const rest = s.committed.filter(x => x.id !== cur.id); this.setState({ committed: [...rest, { id: cur.id, bps: c.net, reach: s.reach, eng: s.eng, adh: s.adh }] }); },

  };

}

class Component extends DCLogic {

constructor(p){ super(p); this.state = { hc: 0 }; }
renderVals() {
  const s = this.state, f = 1 - s.hc / 100;
  const exp = 31 * f, rev = 9 * f, tot = exp + rev, m = 2.5 + tot / 100;
  const H = 46, base = 190;
  const wf = { y1: base - 3.1 * H, h1: 3.1 * H, t1: base - 3.1 * H - 6, y2: base - 3.1 * H, h2: .6 * H, t2: base - 3.1 * H - 6, y3: base - m * H, h3: tot / 100 * H, t3: base - m * H - 6, y4: base - m * H, h4: m * H, t4: base - m * H - 6 };
  const usd = b => '$' + (b * .252).toFixed(1) + 'M';
  return { hc: s.hc, hcT: s.hc + '%', setHc: e => this.setState({ hc: +e.target.value }),
    expT: exp.toFixed(0), expUsd: '+' + usd(exp), expCi: '−' + (exp * .45).toFixed(0) + ' to −' + (exp * 1.45).toFixed(0) + ' bps', revT: rev.toFixed(0), revUsd: '+' + usd(rev), revCi: '+' + (rev * .45).toFixed(0) + ' to +' + (rev * 1.45).toFixed(0) + ' bps',
    trendT: (7.4 - exp / 100).toFixed(1) + '%', pmpmT: '$' + (1420 * (1 + (7.4 - exp / 100) / 100)).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','), marginT: m.toFixed(1) + '%', marginUsd: '$' + (2520 * m / 100).toFixed(1) + 'M', recT: '+' + tot.toFixed(0) + ' bps recovered', rawT: '40', ciT: (2.5 + tot * .45 / 100).toFixed(1) + '% – ' + (2.5 + tot * 1.45 / 100).toFixed(1) + '%', wf };
}

}

 return Component; } };

=\"font-size:11px\">reconciled \u22123 bps</td></tr>\n  </table>\n  <div class=\"mono\" style=\"font-size:11px;color:#5C6B68;margin-top:6px\">Worksheet 5 \u2014 Supplemental benefits: dental cap $2,000 \u00b7 OTC $100/qtr \u00b7 transportation 24 rides \u00b7 induced utilization disclosed per cohort (S-03). Intervention lines carried as separate assumption rows with intervals.</div>\n  </sc-if>\n  <sc-if value=\"{{is2}}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px\">\n    <div class=\"panel sand\"><div class=\"ph\">A \u00b7 Data quality (ASOP 23)</div><div class=\"note\">Source panel, profiling reports, 5 findings and handling, freeze manifest. <a href=\"Ingest.dc.html\">Ingest \u2192</a></div></div>\n    <div class=\"panel sand\"><div class=\"ph\">B \u00b7 Reconciliation</div><div class=\"note\">CY2026 rebuild vs. general ledger by service category, \u22123 bps, with reason codes.</div></div>\n    <div class=\"panel sand\"><div class=\"ph\">C \u00b7 Backtest read-out</div><div class=\"note\">Three vintages, calibration by decile, tail, interval coverage. <a href=\"Main.dc.html\">Backtest \u2192</a></div></div>\n    <div class=\"panel sand\"><div class=\"ph\">D \u00b7 Cohort definitions</div><div class=\"note\">Seven cohorts with definition basis and chief-actuary approval log.</div></div>\n    <div class=\"panel sand\"><div class=\"ph\">E \u00b7 Assumption memo</div><div class=\"note\">Committed interventions as memo lines with 80% intervals, basis, reviewer, and applied haircut. <a href=\"Interventions.dc.html\">Studio \u2192</a></div></div>\n    <div class=\"panel sand\"><div class=\"ph\">F \u00b7 Audit log</div><div class=\"note\">Model version, seed, as-of date, every commit and override, with user and time.</div></div>\n  </div>\n  <div class=\"note\">Delivered as PDF + XLSX bundle \u00b7 support on any Challenger-informed number in &lt; 48 hours.</div>\n  </sc-if>\n  <sc-if value=\"{{is3}}\" hint-placeholder-val=\"{{ false }}\">\n  <table class=\"t\"><tr><th>ASOP</th><th>Requirement</th><th>Where satisfied in the build</th><th>Artifact</th></tr>\n    <tr><td class=\"mono\">23</td><td>Data quality \u2014 review, reliance, limitations disclosed</td><td>Ingest profiling, DQ scan, freeze manifests; ADT coverage gap disclosed</td><td class=\"mono\" style=\"font-size:11px\">Pack A</td></tr>\n    <tr><td class=\"mono\">25</td><td>Credibility procedures</td><td>Small-PBP blending with manual rates (PBP 003: 87%, PBP 004: 62%)</td><td class=\"mono\" style=\"font-size:11px\">Forecast \u00b7 credibility panel</td></tr>\n    <tr><td class=\"mono\">41</td><td>Actuarial communications</td><td>Predictive intervals on every figure; traceable inputs; assumption memo lines</td><td class=\"mono\" style=\"font-size:11px\">Pack E</td></tr>\n    <tr><td class=\"mono\">56</td><td>Modeling \u2014 understanding, validation, reliance on others</td><td>Deterministic versioned engine; backtest validation; agent outputs classified as inputs, never as model results</td><td class=\"mono\" style=\"font-size:11px\">Pack C \u00b7 Pipeline overview</td></tr>\n  </table>\n  <div class=\"note\">Authored for the certifying actuary's file. PMABI does not certify; the memo documents reliance the way a consultant model's would.</div>\n  </sc-if>\n</div>\n<div class=\"foot\" style=\"font-size:11.5px\"><span>PHI boundary: external signal agents use public data only \u00b7 no PHI to third-party AI services outside the BAA \u00b7 <b>data returned and deleted at term</b> \u00b7 SOC 2 Type II: complete prior to pilot</span><span class=\"mono\">v2.3.1 \u00b7 deterministic \u00b7 seed 20261231 \u00b7 Illustrative \u2014 fictional plan and members</span></div>\n\n</div>\n</div>\n</div>", make: function(DCLogic){

}

 return Component; } };

const SVG = 'http://www.w3.org/2000/svg';
let current = null, firstPaint = true, inst = {};
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; } setState(s){ Object.assign(this.state, typeof s === 'function' ? s(this.state) : s); render(); } forceUpdate(){ render(); } }
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
function look(path, scope){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; if (/^-?\d+(\.\d+)?$/.test(path)) return +path; let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(s, scope){ return s.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
function build(node, scope, parent, svg){
  if (node.nodeType === 3) { if (node.nodeValue.trim() || !svg) parent.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName;
  if (tag === 'sc-if') { const v = look(WHOLE.exec(node.getAttribute('value'))[1], scope); if (v) for (const c of node.childNodes) build(c, scope, parent, svg); return; }
  if (tag === 'sc-for') { const list = look(WHOLE.exec(node.getAttribute('list'))[1], scope) || [], as = node.getAttribute('as'); list.forEach((it, i) => { const sc = Object.assign({}, scope, { [as]: it, $index: i }); for (const c of node.childNodes) build(c, sc, parent, svg); }); return; }
  const isSvg = svg || tag === 'svg';

    const n = a.name, v = a.value;
    if (n.startsWith('hint-')) continue;
    if (/^on[A-Z]/.test(n)) { const m = WHOLE.exec(v); const fn = m && look(m[1], scope); if (typeof fn === 'function') { const ev = n === 'onChange' ? (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' ? 'input' : 'change') : n.slice(2).toLowerCase(); el.addEventListener(ev, fn); } continue; }
    const m = WHOLE.exec(v);
    if (m) { const val = look(m[1], scope); if (val == null || val === false) continue; el.setAttribute(n, String(val)); }
    else el.setAttribute(n, interp(v, scope));
  }

window.addEventListener('resize', fit);
