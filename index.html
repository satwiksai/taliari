s. expected\u003c/span>\u003cspan class=\"modtag\">module\u003c/span>\u003c/a>\u003ca class=\"step\" href=\"Export.dc.html\" onClick=\"{{nav.Export}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003cpath d=\"M5 20V10M12 20V4M19 20v-7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Export to BPT\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"gov\">\u003cb>Governance layer · under every step\u003c/b>\u003ca class=\"step\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">\u003cspan class=\"g\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 20h16M6 16l9-9 3 3-9 9H6z\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"l\">Assumptions &amp; approvals\u003c/span>\u003c/a>\u003c/div>\n\u003cdiv class=\"roadmap\">\u003cb>Next modules\u003c/b>Revenue + admin engines at full depth (Phase 2) · MedEx engine reused for ACO / VBC · employer benefit simulation\u003c/div>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003cdiv class=\"top\">\n\u003cdiv class=\"crumbs\" style=\"flex-direction:column;align-items:flex-start;gap:5px;justify-content:center;min-width:0\">\u003cdiv style=\"display:flex;gap:10px;align-items:center;white-space:nowrap\">\u003cspan style=\"font-weight:600\">Meridian Health Plan\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan>CY2028 bid\u003c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan class=\"illus\">Illustrative · fictional plan, de-identified members\u003c/span>\u003cspan class=\"scope\">Scope · medical expense (Phase 1)\u003c/span>\u003c/div>\u003cdiv style=\"display:flex;gap:6px;align-items:center;white-space:nowrap\">\u003cspan class=\"stamp\">as of 12/31/26 · frozen 2/15/27\u003c/span>\u003cspan class=\"stamp\">v2.3.1 deterministic\u003c/span>\u003ca class=\"stamp\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">register r14 · #7f3ac91e\u003c/a>\u003ca class=\"stamp amber\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">sign-off 10/16\u003c/a>\u003ca class=\"stamp mint\" href=\"Ingest.dc.html\" onClick=\"{{nav.Ingest}}\" style=\"text-decoration:none\">GL gate · passed\u003c/a>\u003c/div>\u003c/div>\n\u003ca class=\"toplink\" href=\"Main.dc.html\" onClick=\"{{nav.Main}}\">Backtest\u003c/a>\n\u003ca class=\"toplink\" href=\"Pipeline.dc.html\" onClick=\"{{nav.Pipeline}}\">Architecture\u003c/a>\n\u003c/div>\n\u003cdiv class=\"content\">\n\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  \u003cdiv>\u003ch1 class=\"h1\">MA revenue &amp; risk adjustment\u003c/h1>\u003cdiv class=\"sub\">In Medicare Advantage the same population, trend and program changes that move claims also move risk scores, and so revenue. This overlay shows what moves risk-adjusted revenue, then the diagnosis gap that sits underneath it. Phase 1 holds revenue at the plan's filed projection and shows direction and size; the revenue engine reaches full depth in Phase 2.\u003c/div>\u003c/div>\n  \u003cspan class=\"scope\" style=\"background:#EDE6DA;color:#0F2A24;border:1px solid #5C6B68\">Revenue module · represented\u003c/span>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:16px\">\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Suspected conditions · book\u003c/div>\u003cdiv class=\"big\">4,300\u003c/div>\u003cdiv class=\"note\">Across 3,710 members; evidence from labs, fills, chart notes and repeated claims.\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Payment-eligible · CY2027 rules\u003c/div>\u003cdiv class=\"big pos\">2,900\u003c/div>\u003cdiv class=\"note\">Linked encounter available (or schedulable) — counts toward RAF if confirmed.\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Not eligible · unlinked / audio-only\u003c/div>\u003cdiv class=\"big neg\">1,400\u003c/div>\u003cdiv class=\"note\">Unlinked chart review or audio-only source only; excluded by CMS for CY2027 (except plan switchers).\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Projected RAF impact if confirmed\u003c/div>\u003cdiv class=\"big pos\">+0.9%\u003c/div>\u003cdiv class=\"note\">On affected members · V28 · revenue side of the bid, shown as its own line.\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"panel\">\n  \u003cdiv class=\"ph\">\u003cspan>What moves risk-adjusted revenue · CY2028 vs. the plan's filed projection\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">shares the forecast's member, scenario and assumption layer\u003c/span>\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Driver\u003c/th>\u003cth>Linked to\u003c/th>\u003cth class=\"r\">Risk-score effect\u003c/th>\u003cth class=\"r\">Revenue PMPM\u003c/th>\u003cth class=\"r\">Revenue $\u003c/th>\u003cth>Depth\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>Population mix: new-to-plan duals, aging\u003c/td>\u003ctd>\u003ca href=\"Profiles.dc.html\" onClick=\"{{nav.Profiles}}\">Member-month state\u003c/a>\u003c/td>\u003ctd class=\"num\">+0.6%\u003c/td>\u003ctd class=\"num pos\">+$8.40\u003c/td>\u003ctd class=\"num\">+$14.9M\u003c/td>\u003ctd>\u003cspan class=\"stamp\" style=\"font-size:11px\">represented\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Morbidity progression captured in coding (CKD 3b → 4, LTSS)\u003c/td>\u003ctd>\u003ca href=\"Cohorts.dc.html\" onClick=\"{{nav.Cohorts}}\">Cost drivers\u003c/a>\u003c/td>\u003ctd class=\"num\">+0.4%\u003c/td>\u003ctd class=\"num pos\">+$5.60\u003c/td>\u003ctd class=\"num\">+$9.9M\u003c/td>\u003ctd>\u003cspan class=\"stamp\" style=\"font-size:11px\">represented\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>CY2027 diagnosis-source rules (unlinked chart review, audio-only)\u003c/td>\u003ctd>CMS Rate Announcement\u003c/td>\u003ctd class=\"num\">−1.53%\u003c/td>\u003ctd class=\"num neg\">−$21.40\u003c/td>\u003ctd class=\"num\">−$38.0M\u003c/td>\u003ctd>\u003cspan class=\"stamp mint\" style=\"font-size:11px\">applied\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>HRA outreach: documentation completeness\u003c/td>\u003ctd>\u003ca href=\"Interventions.dc.html\" onClick=\"{{nav.Interventions}}\">Intervention scenarios\u003c/a>\u003c/td>\u003ctd class=\"num\">+0.1%\u003c/td>\u003ctd class=\"num pos\">+$1.40\u003c/td>\u003ctd class=\"num\">+$2.5M\u003c/td>\u003ctd>\u003cspan class=\"stamp\" style=\"font-size:11px\">represented\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Diagnosis confirmation (Tier D)\u003c/td>\u003ctd>\u003ca href=\"Interventions.dc.html\" onClick=\"{{nav.Interventions}}\">Intervention scenarios\u003c/a>\u003c/td>\u003ctd class=\"num\">+0.12% book\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">+$1.70\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">upside only\u003c/td>\u003ctd>\u003cspan class=\"stamp\" style=\"font-size:11px\">not in bid\u003c/span>\u003c/td>\u003c/tr>\n  \u003c/table>\n  \u003cdiv class=\"note\">An intervention that lowers claims can also change documented risk. Both effects come from the same assumption row, so they cannot drift apart. In Phase 1 these revenue effects are shown and logged but are not netted into the second-opinion margin.\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1fr) 340px;gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Diagnosis gap underneath · suspected conditions by V28 category\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click a condition → evidence and reviewer\u003c/span>\u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>Condition (V28 HCC family)\u003c/th>\u003cth class=\"r\">Suspected\u003c/th>\u003cth class=\"r\">Payment-eligible\u003c/th>\u003cth class=\"r\">Not eligible\u003c/th>\u003cth>Evidence mix\u003c/th>\u003cth class=\"r\">RAF Δ (affected)\u003c/th>\u003cth>Review queue\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{conds}}\" as=\"c\" hint-placeholder-count=\"7\">\n      \u003ctr class=\"{{c.cls}}\" onClick=\"{{c.pick}}\">\u003ctd style=\"font-weight:500\">{{c.name}}\u003c/td>\u003ctd class=\"num\">{{c.n}}\u003c/td>\u003ctd class=\"num pos\">{{c.el}}\u003c/td>\u003ctd class=\"num neg\">{{c.ne}}\u003c/td>\u003ctd>\u003cdiv style=\"display:flex;gap:4px\">\u003csc-for list=\"{{c.ev}}\" as=\"b\" hint-placeholder-count=\"2\">\u003cspan class=\"badge b{{b.s}}\">{{b.l}}\u003c/span>\u003c/sc-for>\u003c/div>\u003c/td>\u003ctd class=\"num\">{{c.raf}}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">{{c.q}}\u003c/td>\u003c/tr>\n    \u003c/sc-for>\n    \u003ctr>\u003ctd style=\"font-weight:600\">Total\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">4,300\u003c/td>\u003ctd class=\"num pos\" style=\"font-weight:600\">2,900\u003c/td>\u003ctd class=\"num neg\" style=\"font-weight:600\">1,400\u003c/td>\u003ctd>\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">+0.9%\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">312 pending\u003c/td>\u003c/tr>\n    \u003c/table>\n    \u003cdiv class=\"foot\">\u003cspan>Suspected ≠ coded. Confirmation requires a clinician in a compliant, linked encounter. The diagnosis-confirmation program schedules the encounter; it does not code.\u003c/span>\u003cspan class=\"mono\">chart-reader v1.9 · PPV audit 0.84\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv class=\"panel sand\">\u003cdiv class=\"ph\">CY2027 source rules · as applied\u003c/div>\n      \u003ctable class=\"t\" style=\"background:transparent\">\u003ctr>\u003cth>Source\u003c/th>\u003cth>Counts\u003c/th>\u003c/tr>\n        \u003ctr>\u003ctd>Linked encounter (face-to-face / video)\u003c/td>\u003ctd class=\"mono pos\">yes\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Unlinked chart review record\u003c/td>\u003ctd class=\"mono neg\">no · except MA switchers\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Audio-only encounter\u003c/td>\u003ctd class=\"mono neg\">no\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Risk model\u003c/td>\u003ctd class=\"mono\">2024 (V28) retained\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>CMS coding trend assumption\u003c/td>\u003ctd class=\"mono\">+2.50%\u003c/td>\u003c/tr>\n      \u003c/table>\u003cdiv class=\"note\">Source: CMS CY2027 Rate Announcement, Apr 6 2026. Rules are a visible assumption; update on the CY2028 Final Notice.\u003c/div>\u003c/div>\n    \u003cdiv class=\"panel ink\">\u003cdiv class=\"ph\">PHI boundary · human review\u003c/div>\u003cdiv class=\"note\" style=\"color:#F6F2EB\">Chart reads run inside Meridian's BAA. Agents cite the page and line; every finding enters a clinician queue before it reaches an outreach list.\u003c/div>\u003cdiv class=\"kv\" style=\"color:#F6F2EB\">\u003cspan class=\"k\" style=\"color:#7FE0C9\">Queue\u003c/span>\u003cspan class=\"v\">312 pending · 2 reviewers\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Median review\u003c/span>\u003cspan class=\"v\">3.4 min\u003c/span>\u003cspan class=\"k\" style=\"color:#7FE0C9\">Rejected (30d)\u003c/span>\u003cspan class=\"v\">14%\u003c/span>\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003csc-if value=\"{{show}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv class=\"drill\" style=\"width:520px\">\n  \u003cdiv class=\"dh\">\u003cdiv>\u003cdiv class=\"ph\">Suspected condition · for clinician confirmation\u003c/div>\u003cdiv class=\"dt\">{{cur.name}}\u003c/div>\u003c/div>\u003cbutton class=\"xbtn\" aria-label=\"Close\" onClick=\"{{close}}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cspan class=\"k\">Suspected members\u003c/span>\u003cspan class=\"v\">{{cur.n}} · {{cur.el}} payment-eligible\u003c/span>\u003cspan class=\"k\">Reason code\u003c/span>\u003cspan class=\"v\">{{cur.rc}}\u003c/span>\u003cspan class=\"k\">Typical evidence\u003c/span>\u003cspan style=\"font-size:13.5px\">{{cur.why}}\u003c/span>\u003cspan class=\"k\">Reviewer\u003c/span>\u003cspan class=\"v\">{{cur.rev}}\u003c/span>\u003c/div>\n  \u003cdiv class=\"ph\">Example member (fictional)\u003c/div>\n  \u003cdiv style=\"border:1px solid #EDE6DA;border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px\">\n    \u003cdiv style=\"display:flex;justify-content:space-between\">\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\" style=\"font-weight:600\">{{cur.ex}}\u003c/a>\u003cspan class=\"mono\" style=\"font-size:12.5px\">{{cur.exSrc}}\u003c/span>\u003c/div>\n    \u003cdiv class=\"mono\" style=\"font-size:13px;background:#F6F2EB;padding:8px;white-space:pre-line;line-height:1.5\">{{cur.excerpt}}\u003c/div>\n    \u003cdiv style=\"display:flex;gap:8px;align-items:center\">\u003cspan class=\"badge b2\">{{cur.elig}}\u003c/span>\u003cspan class=\"note\">{{cur.eligWhy}}\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px\">\u003ca class=\"btn sm\" href=\"Interventions.dc.html\" onClick=\"{{nav.Interventions}}\">Schedule linked encounter · Dx confirmation program \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003cbutton class=\"btn ghost sm\" onClick=\"{{assign}}\">Assign reviewer\u003c/button>\u003c/div>\n  \u003csc-if value=\"{{assigned}}\" hint-placeholder-val=\"{{ false }}\">\u003cspan class=\"commit\">QUEUED · reviewer: {{cur.rev}} · SLA 48h\u003c/span>\u003c/sc-if>\n  \u003cdiv class=\"note\">No automated diagnosis. The agent extracted and classified; a clinician decides.\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1280}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\n\nconstructor(p){ super(p); this.state = { c: -1, a: false }; }\n_rv() {\n  const C = [\n    { name: 'Diabetes with chronic complications', n: '1,120', el: '790', ne: '330', ev: [{l:'LAB',s:3},{l:'RX',s:3}], raf: '+0.22', q: '84 pending', rc: 'RC-DX-E11-04', why: 'A1c ≥ 6.5 on 2+ labs, insulin or SGLT2 fills, plus a complication marker (UACR, neuropathy agent) with only E11.9 coded.', rev: 'Dr. K. Mbeki', ex: 'M-509118, 74F', exSrc: 'linked encounter Dec 18 2026', excerpt: 'Coded: E11.9 (T2DM without complications)\\nEvidence: UACR 210 mg/g, eGFR 36, empagliflozin fills ×4\\nSuggests: E11.22 — T2DM with diabetic CKD', elig: 'PAYMENT-ELIGIBLE', eligWhy: 'Linked nephrology encounter on file (Dec 18 2026).' },\n    { name: 'Chronic kidney disease, stage 4', n: '640', el: '450', ne: '190', ev: [{l:'LAB',s:3},{l:'DX×1',s:1}], raf: '+0.19', q: '52 pending', rc: 'RC-DX-N18-02', why: 'Two eGFR values 15–29 ≥ 90 days apart with no N18.4 on any claim.', rev: 'Dr. K. Mbeki', ex: 'M-676134, 66M', exSrc: 'labs only · no linked visit in 6 mo', excerpt: 'Coded: N18.32 (stage 3b)\\nEvidence: eGFR 28 (Aug), 27 (Nov)\\nSuggests: N18.4 — CKD stage 4', elig: 'ELIGIBLE IF SCHEDULED', eligWhy: 'No linked encounter yet; AWV or video visit would qualify under CY2027 rules.' },\n    { name: 'Heart failure', n: '720', el: '520', ne: '200', ev: [{l:'RX',s:3},{l:'DX×3',s:2}], raf: '+0.17', q: '61 pending', rc: 'RC-DX-I50-03', why: 'Loop diuretic + beta-blocker + BNP elevation, echo on claims, HF coded only on ED visit.', rev: 'Dr. A. Lindqvist', ex: 'M-469146, 68M', exSrc: 'chart note Sep 2026 (linked)', excerpt: 'Coded: I10 only in 2026\\nEvidence: echo EF 58% with diastolic dysfunction, furosemide fills, BNP 410\\nSuggests: I50.32 — chronic diastolic HF', elig: 'PAYMENT-ELIGIBLE', eligWhy: 'Cardiology encounter linked to chart note.' },\n    { name: 'Morbid obesity', n: '580', el: '410', ne: '170', ev: [{l:'LAB',s:2},{l:'DX×1',s:1}], raf: '+0.09', q: '38 pending', rc: 'RC-DX-E66-01', why: 'BMI ≥ 40 recorded in vitals on a linked encounter with no E66.01.', rev: 'Dr. A. Lindqvist', ex: 'M-921549, 70F', exSrc: 'vitals · PCP visit (linked)', excerpt: 'Coded: none\\nEvidence: BMI 41.2 recorded Oct 2026 PCP visit\\nSuggests: E66.01 — morbid obesity', elig: 'PAYMENT-ELIGIBLE', eligWhy: 'Recorded in a linked face-to-face encounter.' },\n    { name: 'Major depressive disorder', n: '510', el: '300', ne: '210', ev: [{l:'RX',s:2},{l:'DX×1',s:1}], raf: '+0.11', q: '41 pending', rc: 'RC-DX-F33-02', why: 'Antidepressant fills ≥ 6 mo with PHQ-9 ≥ 10 in chart; coded only on an audio-only telehealth visit.', rev: 'Dr. S. Haddad', ex: 'M-118182, 72F', exSrc: 'audio-only visit Jun 2026', excerpt: 'Coded: F33.1 on audio-only encounter\\nEvidence: sertraline fills ×8, PHQ-9 = 14\\nSuggests: F33.1 — recurrent MDD, moderate', elig: 'NOT ELIGIBLE · AUDIO-ONLY', eligWhy: 'Audio-only source excluded for CY2027; a video or in-person visit would qualify.' },\n    { name: 'COPD', n: '430', el: '270', ne: '160', ev: [{l:'RX',s:3},{l:'DX×1',s:1}], raf: '+0.08', q: '22 pending', rc: 'RC-DX-J44-01', why: 'LAMA/LABA fills, spirometry on claims, J44 absent.', rev: 'Dr. S. Haddad', ex: 'M-261978, 69M', exSrc: 'PBM + pulmonology (linked)', excerpt: 'Coded: J42 (unspecified bronchitis)\\nEvidence: tiotropium fills ×5, FEV1/FVC 0.62\\nSuggests: J44.9 — COPD', elig: 'PAYMENT-ELIGIBLE', eligWhy: 'Pulmonology encounter linked.' },\n    { name: 'Vascular disease with complications', n: '300', el: '160', ne: '140', ev: [{l:'DX×1',s:1},{l:'LAB',s:1}], raf: '+0.05', q: '14 pending', rc: 'RC-DX-I70-05', why: 'ABI \u003c 0.9 and claudication on a single unlinked chart review record.', rev: 'Dr. K. Mbeki', ex: 'M-414681, 79M', exSrc: 'unlinked chart review 2025', excerpt: 'Coded: none since 2025\\nEvidence: ABI 0.71, rest pain noted (unlinked review)\\nSuggests: I70.222 — atherosclerosis w/ rest pain', elig: 'NOT ELIGIBLE · UNLINKED', eligWhy: 'Unlinked chart review excluded for CY2027 (member did not switch plans).' },\n  ];\n  const s = this.state;\n  return { conds: C.map((c, i) => ({ ...c, cls: 'click' + (i === s.c ? ' sel' : ''), pick: () => this.setState({ c: i, a: false }) })), show: s.c >= 0, cur: C[Math.max(0, s.c)], close: () => this.setState({ c: -1, a: false }), assign: () => this.setState({ a: true }), assigned: s.a };\n}\n\n\n_nav() { const g = this.props.go, o = {}; [\"Main\", \"Ingest\", \"Pipeline\", \"Profiles\", \"Member\", \"Cohorts\", \"Forecast\", \"RxPipeline\", \"DxGap\", \"Scenarios\", \"Interventions\", \"Variance\", \"Bid\", \"Register\", \"Export\"].forEach(k => { o[k] = e => { if (g) { if (e && e.preventDefault) e.preventDefault(); g(k); } }; }); return o; }\nrenderVals() { const v = this._rv(), nav = this._nav(); if (v.cur && v.cur.href) { const k = v.cur.href.replace('.dc.html', ''); v.cur = { ...v.cur, go: nav[k] }; } return { ...v, nav }; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>", "Variance.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Program variance tracker\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;font-fami c/span>\u003cspan class=\"dot\">·\u003c/span>\u003cspan class=\"illus\">Illustrative · fictional plan, de-identified members\u003c/span>\u003cspan class=\"scope\">Scope · medical expense (Phase 1)\u003c/span>\u003c/div>\u003cdiv style=\"display:flex;gap:6px;align-items:center;white-space:nowrap\">\u003cspan class=\"stamp\">as of 12/31/26 · frozen 2/15/27\u003c/span>\u003cspan class=\"stamp\">v2.3.1 deterministic\u003c/span>\u003ca class=\"stamp\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">register r14 · #7f3ac91e\u003c/a>\u003ca class=\"stamp amber\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"text-decoration:none\">sign-off 10/16\u003c/a>\u003ca class=\"stamp mint\" href=\"Ingest.dc.html\" onClick=\"{{nav.Ingest}}\" style=\"text-decoration:none\">GL gate · passed\u003c/a>\u003c/div>\u003c/div>\n\u003ca class=\"toplink\" href=\"Main.dc.html\" onClick=\"{{nav.Main}}\">Backtest\u003c/a>\n\u003ca class=\"toplink\" href=\"Pipeline.dc.html\" onClick=\"{{nav.Pipeline}}\">Architecture\u003c/a>\n\u003c/div>\n\u003cdiv class=\"content\">\n\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\">\n  \u003cdiv>\u003ch1 class=\"h1\">Actual vs. expected\u003c/h1>\u003cdiv class=\"sub\">Every bid assumption is measured against what actually happens. The locked bid stays exactly as filed; emerging experience feeds a revised forecast with its own version. Program results show the credited assumption next to what the evidence can actually attribute to the program.\u003c/div>\u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-end\">\u003cspan class=\"stamp amber\">contract year CY2028 · observed through Apr · illustrative\u003c/span>\u003cspan class=\"stamp\">optional module · skip if you already monitor programs\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:16px\">\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Credited in the bid\u003c/div>\u003cdiv class=\"big\">−13.75 bps\u003c/div>\u003cdiv class=\"note mono\">≈ $3.47M · six programs\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Projected year-end delivery\u003c/div>\u003cdiv class=\"big\">{{projT}}\u003c/div>\u003cdiv class=\"note mono\">{{projUsd}}\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Margin exposed\u003c/div>\u003cdiv class=\"big {{vCls}}\">{{varT}}\u003c/div>\u003cdiv class=\"note mono\">{{varUsd}} before vendor share\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Vendor carries\u003c/div>\u003cdiv class=\"big s\">{{vendT}}\u003c/div>\u003cdiv class=\"note\">50% of shortfall on the two vendor-run agent programs · 30% of fees at risk\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"panel\">\n  \u003cdiv class=\"ph\">\u003cspan>Credited programs · assumed vs. observed, year to date\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click a program → its monthly line and remediation ladder\u003c/span>\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Program\u003c/th>\u003cth>Responsible\u003c/th>\u003cth>Tier\u003c/th>\u003cth class=\"r\">Credited\u003c/th>\u003cth class=\"r\">Reach assumed / observed\u003c/th>\u003cth class=\"r\">Engagement assumed / observed\u003c/th>\u003cth>Early cost signal\u003c/th>\u003cth class=\"r\">Projected YE\u003c/th>\u003cth class=\"r\">Variance\u003c/th>\u003cth class=\"r\">$\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\n  \u003csc-for list=\"{{progs}}\" as=\"p\" hint-placeholder-count=\"6\">\n    \u003ctr class=\"{{p.cls}}\" onClick=\"{{p.pick}}\">\u003ctd style=\"font-weight:500\">{{p.n}}\u003c/td>\u003ctd style=\"font-size:13px\">{{p.org}}\u003c/td>\u003ctd>\u003cspan class=\"badge {{p.tCls}}\">{{p.tier}}\u003c/span>\u003c/td>\u003ctd class=\"num\">{{p.credT}}\u003c/td>\u003ctd class=\"num\">{{p.reach}}\u003c/td>\u003ctd class=\"num\">{{p.eng}}\u003c/td>\u003ctd style=\"font-size:13px\">{{p.signal}}\u003c/td>\u003ctd class=\"num\">{{p.projT}}\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">{{p.varT}}\u003c/td>\u003ctd class=\"num\">{{p.usd}}\u003c/td>\u003ctd>\u003cspan class=\"stamp {{p.sCls}}\" style=\"font-size:11.5px\">{{p.status}}\u003c/span>\u003c/td>\u003c/tr>\n  \u003c/sc-for>\n  \u003c/table>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.3fr) minmax(0, 1fr);gap:16px;flex-grow:1;min-height:0\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>{{cur.n}} · cumulative reach, % of cohort\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">click a month → the members behind it\u003c/span>\u003c/div>\n    \u003cdiv style=\"display:flex;gap:6px;align-items:flex-end;height:190px;border-bottom:1px solid #5C6B68;padding:0 4px\">\n      \u003csc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\">\n      \u003cbutton onClick=\"{{m.pick}}\" aria-label=\"{{m.label}}\" style=\"flex:1;height:100%;position:relative;background:{{m.selBg}};border:none;padding:0;cursor:pointer;min-width:0\">\n        \u003cdiv style=\"position:absolute;left:18%;right:18%;bottom:0;height:{{m.aH}};border:1.5px solid #D99A2B;box-sizing:border-box\">\u003c/div>\n        \u003cdiv style=\"position:absolute;left:30%;right:30%;bottom:0;height:{{m.oH}};background:{{m.oC}}\">\u003c/div>\n      \u003c/button>\n      \u003c/sc-for>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;gap:6px;padding:0 4px\">\u003csc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\">\u003cdiv class=\"mono\" style=\"flex:1;text-align:center;font-size:11.5px;color:#5C6B68\">{{m.n}}\u003c/div>\u003c/sc-for>\u003c/div>\n    \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"border:1.5px solid #D99A2B;height:8px;box-sizing:border-box\">\u003c/i>credited assumption\u003c/span>\u003cspan>\u003ci style=\"background:#0E7C6B\">\u003c/i>observed\u003c/span>\u003cspan>\u003ci style=\"background:#7FE0C9\">\u003c/i>projected\u003c/span>\u003c/div>\n    \u003cdiv class=\"note\">{{cur.note}}\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n    \u003cdiv class=\"panel sand\">\n      \u003cdiv class=\"ph\">\u003cspan>Remediation ladder · {{cur.short}}\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">expected recovery\u003c/span>\u003c/div>\n      \u003csc-for list=\"{{cur.ladder}}\" as=\"r\" hint-placeholder-count=\"3\">\n        \u003cbutton onClick=\"{{r.toggle}}\" class=\"tab {{r.on}}\" style=\"display:flex;justify-content:space-between;gap:12px;text-align:left;padding:8px 10px\">\u003cspan>{{r.step}}\u003c/span>\u003cspan class=\"mono\">{{r.recT}}\u003c/span>\u003c/button>\n      \u003c/sc-for>\n      \u003csc-if value=\"{{cur.noLadder}}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv class=\"note\">On track; no remediation needed.\u003c/div>\u003c/sc-if>\n      \u003cdiv class=\"note\" style=\"color:#0F2A24\">Selected steps change the projected variance above. Underdelivery has a response, not just a report.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Contract term\u003c/div>\u003cdiv class=\"note\" style=\"color:#0F2A24\">{{cur.contract}}\u003c/div>\u003ca class=\"btn ghost sm\" href=\"Bid.dc.html\" onClick=\"{{nav.Bid}}\" style=\"align-self:flex-start\">Shown as a line item on the bid comparison \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"panel\">\n  \u003cdiv class=\"ph\">\u003cspan>Recalibration · locked bid → emerging experience → revised forecast\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">bid r15 stays read-only\u003c/span>\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Assumption\u003c/th>\u003cth class=\"r\">Bid r15 · locked\u003c/th>\u003cth class=\"r\">Actual ÷ expected, Jan–Apr\u003c/th>\u003cth class=\"r\">Credibility of A/E\u003c/th>\u003cth class=\"r\">Revised forecast\u003c/th>\u003cth>Approval\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{recal}}\" as=\"r\" hint-placeholder-count=\"5\">\u003ctr>\u003ctd style=\"font-weight:500\">{{r.n}}\u003c/td>\u003ctd class=\"num\">{{r.bid}}\u003c/td>\u003ctd class=\"num {{r.cls}}\">{{r.ae}}\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">{{r.cr}}\u003c/td>\u003ctd class=\"num\" style=\"font-weight:600\">{{r.rev}}\u003c/td>\u003ctd>\u003cspan class=\"stamp {{r.sc}}\" style=\"font-size:11px\">{{r.st}}\u003c/span>\u003c/td>\u003c/tr>\u003c/sc-for>\n  \u003c/table>\n  \u003cdiv style=\"display:flex;gap:10px;align-items:center\">\u003cbutton class=\"btn sm\" onClick=\"{{mkRev}}\">{{revBtn}}\u003c/button>\u003cspan class=\"note\">Revised values blend A/E with the bid assumption by credibility; four months of LTSS experience earns 35% weight, not 100%. Each revision goes to its owner for approval in the register.\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr);gap:16px\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">\u003cspan>Attribution · {{cur.short}}\u003c/span>\u003cspan class=\"stamp {{cur.at.cCls}}\" style=\"font-size:11px\">{{cur.at.conf}} confidence\u003c/span>\u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px\">\n      \u003cdiv class=\"modc\">\u003cspan class=\"ph\" style=\"margin:0\">Credited in the bid\u003c/span>\u003cspan class=\"big s\">{{cur.credT}} bps\u003c/span>\u003cspan style=\"font-size:13px;color:#5C6B68\">an assumption, set before the year\u003c/span>\u003c/div>\n      \u003cdiv class=\"modc on\">\u003cspan class=\"ph\" style=\"margin:0\">Attributable to the program so far\u003c/span>\u003cspan class=\"big s\">{{cur.at.evid}}\u003c/span>\u003cspan style=\"font-size:13px;color:#5C6B68\">80% {{cur.at.ci}}\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>Step\u003c/th>\u003cth>How it is handled\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>Comparison group\u003c/td>\u003ctd style=\"font-size:13.5px\">{{cur.at.comp}}\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Regression to the mean\u003c/td>\u003ctd style=\"font-size:13.5px\">{{cur.at.rtm}}\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Secular trend\u003c/td>\u003ctd style=\"font-size:13.5px\">Removed using the same trend applied to the comparison group\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Overlapping programs\u003c/td>\u003ctd style=\"font-size:13.5px\">{{cur.at.ov}}\u003c/td>\u003c/tr>\n    \u003c/table>\n    \u003cdiv class=\"note\">Savings are never claimed from the cohort's cost going down alone. High-cost members selected into a program would get cheaper anyway.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"panel sand\">\n    \u003cdiv class=\"ph\">\u003cspan>Program hierarchy · set by each plan\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">Meridian's structure\u003c/span>\u003c/div>\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:5px;font-size:14px\">\n      \u003csc-for list=\"{{tree}}\" as=\"t\" hint-placeholder-count=\"9\">\u003cdiv style=\"padding-left:{{t.ind}};display:flex;gap:8px;align-items:baseline\">\u003cspan class=\"mono\" style=\"font-size:11.5px;color:#5C6B68;width:96px;flex-shrink:0\">{{t.lvl}}\u003c/span>\u003cspan style=\"font-weight:{{t.w}}\">{{t.n}}\u003c/span>\u003c/div>\u003c/sc-for>\n    \u003c/div>\n    \u003cdiv class=\"note\">Levels are the plan's own: enterprise → department → program or vendor → intervention → cohort. Another plan can add or rename levels without changing the engine.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003csc-if value=\"{{showMonth}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv class=\"drill\">\n  \u003cdiv class=\"dh\">\u003cdiv>\u003cdiv class=\"ph\">{{cur.short}} · {{mon.label}}\u003c/div>\u003cdiv class=\"dt\">The members behind this month\u003c/div>\u003c/div>\u003cbutton class=\"xbtn\" aria-label=\"Close\" onClick=\"{{close}}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cspan class=\"k\">Cohort\u003c/span>\u003cspan class=\"v\">{{cur.cohort}}\u003c/span>\u003cspan class=\"k\">Reached to date\u003c/span>\u003cspan class=\"v\">{{mon.reached}}\u003c/span>\u003cspan class=\"k\">Not yet reached\u003c/span>\u003cspan class=\"v\">{{mon.notReached}}\u003c/span>\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Member ID\u003c/th>\u003cth>Status\u003c/th>\u003cth>Reason code\u003c/th>\u003c/tr>\n    \u003csc-for list=\"{{cur.members}}\" as=\"x\" hint-placeholder-count=\"5\">\u003ctr>\u003ctd>\u003ca href=\"Member.dc.html\" onClick=\"{{nav.Member}}\">{{x.n}}\u003c/a>\u003c/td>\u003ctd style=\"font-size:13px\">{{x.s}}\u003c/td>\u003ctd>\u003cspan class=\"rc\">{{x.rc}}\u003c/span>\u003c/td>\u003c/tr>\u003c/sc-for>\n  \u003c/table>\n  \u003cdiv class=\"note\">{{mon.note}}\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1400}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\n\nconstructor(p){ super(p); this.state = { cur: 0, mon: -1, fix: {}, rev: false }; }\n_rv() {\n  const s = this.state;\n  const P = [\n    { k: 'hra', org: 'Enrollment team + outreach vendor', at: {\"comp\": \"Members not yet reached in the rollout order, matched on risk score and dual status\", \"rtm\": \"Applied: both groups selected on the same pre-period cost\", \"ov\": \"None: no other program touches new-to-plan duals in Q1\", \"evid\": \"+0.2 bps\", \"ci\": \"−0.2 to +0.6\", \"conf\": \"low\", \"cCls\": \"amber\"}, n: 'AI outreach agent · HRA and welcome calls', short: 'HRA agent', tier: 'C', cred: 1.5, rA: 80, rO: 52, eA: 60, eO: 48, signal: 'HRA completion 61% vs. 80% target', proj: .6, cohort: 'New-to-plan duals · 5,200', lower: .7,\n      ladder: [{ step: 'Text-first outreach + evening call hours', rec: .3 }, { step: 'Add live Haitian Creole and Vietnamese agents', rec: .2 }, { step: 'Nurse escalation on every LTSS flag', rec: .2 }],\n      contract: 'Pilot success criterion: HRA completion ≥ 70% by month 6. 30% of the vendor\\'s fee is at risk; the vendor carries 50% of any shortfall against the credited value.',\n      note: 'Reach is running 28 points behind the credited path. Members on prepaid phones and in two rural counties are the gap; this program is below its lower interval.',\n      members: [{ n: 'M-762213, 81F', s: '3 attempts · no answer', rc: 'RC-OUT-02 unreachable' }, { n: 'M-584027, 77M', s: 'reached · HRA done · LTSS flag', rc: 'RC-OUT-10 escalated RN' }, { n: 'M-297247, 73F', s: 'opted out', rc: 'RC-OUT-05 opt-out' }, { n: 'M-689829, 69M', s: 'language mismatch', rc: 'RC-OUT-07 language' }, { n: 'M-225637, 84F', s: 'reached · HRA partial', rc: 'RC-OUT-08 callback' }] },\n    { k: 'dep', org: 'Pharmacy department', at: {\"comp\": \"Eligible members in counties scheduled for Q3 rollout\", \"rtm\": \"Applied: selection on a high pre-period ED rate would overstate savings by about 30%\", \"ov\": \"Transport concierge overlaps 22% of the cohort; shared savings split by a joint model\", \"evid\": \"−1.1 bps\", \"ci\": \"−0.3 to −1.9\", \"conf\": \"medium\", \"cCls\": \"\"}, n: 'Polypharmacy deprescribing review', short: 'Deprescribing review', tier: 'B', cred: 4.5, rA: 70, rO: 61, eA: 75, eO: 72, signal: 'Avg. meds −1.4 per reviewed member', proj: 3.9, cohort: '≥10 meds + transport-insecure · 1,900', lower: 2.0,\n      ladder: [{ step: 'Add pharmacist telehealth slots', rec: .3 }, { step: 'Prescriber outreach letters', rec: .2 }],\n      contract: 'Pharmacist-led; no vendor fee at risk. Shortfall stays with the plan.', note: 'Slightly behind on reviews completed, within the interval. Effect per reviewed member is on target.',\n      members: [{ n: 'M-509118, 74F', s: 'review done · 2 meds stopped', rc: 'RC-RX-04 deprescribed' }, { n: 'M-712657, 80M', s: 'scheduled May 9', rc: 'RC-OUT-08 scheduled' }, { n: 'M-118182, 76F', s: 'no-show · ride booked', rc: 'RC-OUT-11 transport' }] },\n    { k: 'ckd', org: 'Care mgmt + kidney-care vendor', at: {\"comp\": \"Matched non-enrolled CKD 3b–4 members, two prior cycles\", \"rtm\": \"Applied\", \"ov\": \"Deprescribing overlaps 9%; split by joint model\", \"evid\": \"−1.5 bps\", \"ci\": \"−0.9 to −2.1\", \"conf\": \"high\", \"cCls\": \"mint\"}, n: 'CKD progression program', short: 'CKD program', tier: 'A', cred: 4.0, rA: 85, rO: 86, eA: 70, eO: 72, signal: 'Emergent dialysis starts 2 vs. 5 expected', proj: 4.1, cohort: 'CKD 3b → 4 · 1,250', lower: 2.8, ladder: [], contract: 'Meridian\\'s own program; no vendor term.', note: 'On track. Tier A: two prior cycles of Meridian results support the credit.', members: [{ n: 'M-414681, 79M', s: 'nephrology co-managed', rc: 'RC-CKD-02 referred' }, { n: 'M-509118, 74F', s: 'home labs monthly', rc: 'RC-CKD-05 labs' }] },\n    { k: 'onc', org: 'Oncology vendor', at: {\"comp\": \"Workups before program start (historical)\", \"rtm\": \"Applied\", \"ov\": \"None\", \"evid\": \"−0.6 bps\", \"ci\": \"−0.1 to −1.1\", \"conf\": \"medium\", \"cCls\": \"\"}, n: 'Oncology navigation', short: 'Oncology navigation', tier: 'B', cred: 2.0, rA: 90, rO: 92, eA: 80, eO: 81, signal: 'Site-of-care steering 64% vs. 60%', proj: 2.1, cohort: 'Workup in progress · 410', lower: .9, ladder: [], contract: 'Navigation vendor: 20% of fees at risk on site-of-care steering ≥ 55%.', note: 'On track.', members: [{ n: 'M-578458, 71M', s: 'navigator assigned before first chemo claim', rc: 'RC-ONC-01 navigated' }] },\n    { k: 'glp', org: 'Pharmacy + outreach vendor', at: {\"comp\": \"Starters not contacted (capacity-limited rollout)\", \"rtm\": \"Applied\", \"ov\": \"None\", \"evid\": \"−0.3 bps\", \"ci\": \"0.0 to −0.6\", \"conf\": \"low\", \"cCls\": \"amber\"}, n: 'AI outreach agent · GLP-1 persistence', short: 'GLP-1 agent', tier: 'C', cred: 1.0, rA: 75, rO: 71, eA: 58, eO: 55, signal: 'Persistence 55% at month 4 vs. 58% assumed', proj: .9, cohort: 'GLP-1 started · 3,140', lower: .45,\n      ladder: [{ step: 'Pharmacist call at first nausea flag', rec: .1 }], contract: '30% of the vendor\\'s fee at risk on persistence ≥ 55% at month 6; the vendor carries 50% of any shortfall against the credited value.', note: 'Slightly behind, within the interval.', members: [{ n: 'M-469146, 68M', s: 'started Mar · on titration', rc: 'RC-RX-09 titrating' }, { n: 'M-933917, 70F', s: 'stopped · GI side effects', rc: 'RC-RX-12 discontinued' }] },\n    { k: 'trn', org: 'Care management', at: {\"comp\": \"Comparable ZIPs without the concierge\", \"rtm\": \"Applied\", \"ov\": \"Overlaps deprescribing; split by joint model\", \"evid\": \"−0.2 bps\", \"ci\": \"+0.1 to −0.5\", \"conf\": \"low\", \"cCls\": \"amber\"}, n: 'Transport and SDoH concierge', short: 'Transport concierge', tier: 'C', cred: .75, rA: 60, rO: 63, eA: 50, eO: 49, signal: 'Avoidable ED visits −7% in target ZIPs', proj: .75, cohort: 'Transport-insecure ZIPs · 3,400', lower: .35, ladder: [], contract: 'Ride vendor paid per ride; no outcome term.', note: 'On track.', members: [{ n: 'M-118182, 76F', s: '4 rides booked', rc: 'RC-OUT-11 transport' }] },\n  ];\n  const usd = b => '$' + (Math.abs(b) * .252).toFixed(2) + 'M';\n  const progs = P.map((p, i) => { const fx = (s.fix[p.k] || []).reduce((a, j) => a + p.ladder[j].rec, 0); const proj = Math.min(p.cred, p.proj + fx); const v = p.cred - proj;\n    return { ...p, fx, projV: proj, varV: v, tCls: { A: 'b3', B: 'b2', C: 'b1', D: 'b0' }[p.tier], credT: '−' + p.cred.toFixed(2), reach: p.rA + '% / ' + p.rO + '%', eng: p.eA + '% / ' + p.eO + '%', projT: '−' + proj.toFixed(2), varT: v > .005 ? '+' + v.toFixed(2) + ' bps' : v \u003c -.005 ? '−' + Math.abs(v).toFixed(2) + ' bps' : '0', usd: v > .005 ? usd(v) : '—',\n      status: proj \u003c p.lower ? 'below interval' : v > .05 ? 'behind · in interval' : 'on track', sCls: proj \u003c p.lower ? 'amber' : v > .05 ? '' : 'mint', cls: 'click' + (i === s.cur ? ' sel' : ''), pick: () => this.setState({ cur: i, mon: -1 }) }; });\n  const projTot = progs.reduce((a, p) => a + p.projV, 0), varTot = 13.75 - projTot;\n  const below = progs.filter(p => p.k === 'hra' || p.k === 'glp').reduce((a, p) => a + Math.max(0, p.varV), 0);\n  const c = progs[s.cur];\n  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], K = 1.8;\n  const ratio = c.rO / c.rA, ratioF = Math.min(1, ratio + c.fx / Math.max(.1, c.cred));\n  const months = M.map((n, i) => { const a = c.rA * Math.min(1, (i + 1) / 6); const obs = i \u003c 4; const o = a * (obs ? ratio : ratioF);\n    return { n, label: n + ' 2028', aH: (a * K).toFixed(0) + 'px', oH: (o * K).toFixed(0) + 'px', oC: obs ? '#0E7C6B' : '#7FE0C9', selBg: i === s.mon ? '#E6F2EE' : 'transparent', pick: () => this.setState({ mon: i }), a, o }; });\n  const mm = months[Math.max(0, s.mon)], size = parseInt(c.cohort.split('·')[1].replace(/,/g, ''));\n  const toggle = j => () => { const cur = s.fix[c.k] || []; this.setState({ fix: { ...s.fix, [c.k]: cur.includes(j) ? cur.filter(x => x !== j) : [...cur, j] } }); };\n  const RC = [['LTSS ramp', '+38 bps', '1.08', '35%', '+39 bps'], ['High-cost specialty Rx', '+52 bps', '0.97', '50%', '+51 bps'], ['GLP-1 persistence at 12 months', '47%', '52% observed', '40%', '49%'], ['HRA agent, credited', '−1.50 bps', '0.40', '60%', '−0.87 bps'], ['New-to-plan duals PMPM', '$2,050', '1.12', '30%', '$2,124']];\n  const recal = RC.map(([n, bid, ae, cr, rev]) => ({ n, bid, ae, cr, rev, cls: parseFloat(ae) > 1.02 ? 'neg' : parseFloat(ae) \u003c .98 ? 'pos' : '', st: s.rev ? 'r16 · with owner' : 'not yet proposed', sc: s.rev ? 'amber' : '' }));\n  const tree = [['enterprise', 'Meridian Health Plan', 0, 600], ['department', 'Care management', 1, 500], ['vendor', 'Kidney-care vendor', 2, 400], ['intervention', 'CKD progression program', 3, 400], ['cohort', 'CKD 3b → 4 · 1,250', 4, 400], ['department', 'Pharmacy', 1, 500], ['program', 'Deprescribing review', 2, 400], ['vendor', 'Outreach vendor (AI agent)', 2, 400], ['intervention', 'GLP-1 persistence calls', 3, 400]].map(([lvl, n, d, w]) => ({ lvl, n, ind: (d * 18) + 'px', w }));\n  return { recal, tree, mkRev: () => this.setState({ rev: !s.rev }), revBtn: s.rev ? 'Revised forecast r16 created · bid r15 unchanged' : 'Create revised forecast r16', progs, cur: { ...c, ladder: c.ladder.map((r, j) => ({ ...r, recT: '+' + r.rec.toFixed(1) + ' bps', on: (s.fix[c.k] || []).includes(j) ? 'on' : '', toggle: toggle(j) })), noLadder: c.ladder.length === 0 },\n    projT: '−' + projTot.toFixed(2) + ' bps', projUsd: '≈ ' + usd(projTot), varT: (varTot >= 0 ? '+' : '−') + Math.abs(varTot).toFixed(2) + ' bps', varUsd: usd(varTot), vCls: varTot > 1 ? 'neg' : 'pos', vendT: usd(below * .5),\n    months, showMonth: s.mon >= 0, mon: { label: mm.label, reached: Math.round(size * mm.o / 100).toLocaleString() + ' (' + mm.o.toFixed(0) + '%)', notReached: Math.round(size * (1 - mm.o / 100)).toLocaleString(), note: s.mon > 3 ? 'Projected month: counts are the model\\'s path at current pace, plus any remediation selected.' : 'Observed month. Each member row opens the evidence chain (demo profile).' },\n    close: () => this.setState({ mon: -1 }) };\n}\n\n\n_nav() { const g = this.props.go, o = {}; [\"Main\", \"Ingest\", \"Pipeline\", \"Profiles\", \"Member\", \"Cohorts\", \"Forecast\", \"RxPipeline\", \"DxGap\", \"Scenarios\", \"Interventions\", \"Variance\", \"Bid\", \"Register\", \"Export\"].forEach(k => { o[k] = e => { if (g) { if (e && e.preventDefault) e.preventDefault(); g(k); } }; }); return o; }\nrenderVals() { const v = this._rv(), nav = this._nav(); if (v.cur && v.cur.href) { const k = v.cur.href.replace('.dc.html', ''); v.cur = { ...v.cur, go: nav[k] }; } return { ...v, nav }; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "Ingest.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Ingest and reconcile\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;background:#F6F2EB;color:#0F2A24;font-size:14.5px;line-height:1.4}\na{color:#0E7C6B;text-decoration:none}a:hover{color:#0A5A4E}\n*{box-sizing:border-box}\n.serif{font-family:Fraunces,'Source Serif 4',Georgia,serif;font-weight:600}\n.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}\n.rail{width:240px;height:100%;background:#0F2A24;color:#F6F2EB;display:flex;flex-direction:column;padding:20px 0 16px;position:relative;flex-shrink:0}\n.logo{padding:0 20px 18px;border-bottom:1px solid rgba(246,242,235,.12)}\n.logo .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;letter-spacing:.02em;color:#F6F2EB;line-height:1}\n.logo .tag{font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:#7FE0C9;margin-top:6px}\n.steps{position:relative;padding:16px 0 0 20px;flex-grow:1}\n.steps .line{position:absolute;left:31px;top:38px;width:1px;height:440px;background:#7FE0C9;transform-origin:top;animation:flow 2s ease-out 1}\n@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n.step{display:flex;align-items:center;gap:12px;height:44px;color:rgba(246,242,235,.72);position:relative}\n.step:hover{color:#F6F2EB}\n.step .g{width:24px;height:24px;border-radius:12px;border:1px solid rgba(127,224,201,.55);background:#0F2A24;display:flex;align-items:center;justify-content:center;color:#7FE0C9;flex-shrink:0;position:relative;z-index:1}\n.step.done .g{background:#0A5A4E;border-color:#0A5A4E;color:#7FE0C9}\n.step.cur{color:#F6F2EB;font-weight:600}\n.step.cur .g{background:#7FE0C9;color:#0F2A24;border-color:#7FE0C9;box-shadow:0 0 0 5px rgba(127,224,201,.22)}\n.step .l{font-size:14px}\n.phi{height:22px;margin:0 16px 0 0;border-top:1px dashed #D99A2B;padding-top:3px;box-sizing:border-box;display:flex;align-items:flex-start}\n.phi span{font-family:'IBM Plex Mono',Menlo,monospace;font-size:9px;letter-spacing:.06em;color:#D99A2B;text-transform:uppercase;line-height:1.3;background:#0F2A24;position:relative;z-index:1;padding-right:4px}\n.roadmap{padding:12px 20px 0;border-top:1px solid rgba(246,242,235,.12);font-size:12px;color:rgba(246,242,235,.38);line-height:1.5}\n.roadmap b{font-weight:500;color:rgba(246,242,235,.5);display:block;font-family:'IBM Plex Mono',Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}\n.top{height:68px;background:#F6F2EB;border-bottom:1px solid #5C6B68;display:flex;align-items:center;padding:0 32px;gap:20px;flex-shrink:0}\n.top .crumbs{font-size:14px;color:#0F2A24;display:flex;gap:10px;align-items:center;flex-grow:1}\n.top .crumbs .dot{color:#5C6B68}\n.stamp{font-family:'IBM Plex Mono',Menlo,monospace;font-size:12px;letter-spacing:.04em;border:1px solid #0F2A24;padding:3px 8px;border-radius:4px;color:#0F2A24}\n.stamp.mint{border-color:#0E7C6B;color:#0E7C6B}\n.stamp.amber{border-color:#D99A2B;color:#8a5f14}\n.illus{font-size:12.5px;color:#5C6B68;font-style:italic}\n.toplink{font-size:13px;color:#0E7 ope −5/yr · UACR\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Emergent dialysis start (tail of range)\u003c/td>\u003ctd class=\"num\">11%\u003c/td>\u003ctd class=\"num\">+$48K if occurs\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">progression model\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Hyperkalemia ED revisit\u003c/td>\u003ctd class=\"num\">31%\u003c/td>\u003ctd class=\"num\">+$3.1K\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">K 5.1 · prior ED\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Missed care (transport)\u003c/td>\u003ctd class=\"num\">—\u003c/td>\u003ctd class=\"num\">widens 80% band +$4K\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">SDoH proxy\u003c/td>\u003c/tr>\n      \u003c/table>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\u003cdiv class=\"ph\">Prior-year RAF · V28\u003c/div>\u003cdiv class=\"kv\">\u003cspan class=\"k\">CY2027 RAF\u003c/span>\u003cspan class=\"v\">1.842\u003c/span>\u003cspan class=\"k\">HCCs (V28)\u003c/span>\u003cspan class=\"v\">37 · 329 · 226 · 267\u003c/span>\u003cspan class=\"k\">Suspected, uncoded\u003c/span>\u003cspan class=\"v\">\u003ca href=\"DxGap.dc.html\" onClick=\"{{nav.DxGap}}\">N18.4 progression · payment-eligible (linked)\u003c/a>\u003c/span>\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{showSrc}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv class=\"drill\">\n  \u003cdiv class=\"dh\">\u003cdiv>\u003cdiv class=\"ph\">Source record\u003c/div>\u003cdiv class=\"dt\">{{cur.title}}\u003c/div>\u003c/div>\u003cbutton class=\"xbtn\" aria-label=\"Close\" onClick=\"{{close}}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cspan class=\"k\">Reason code\u003c/span>\u003cspan class=\"v\">{{cur.rc}}\u003c/span>\u003c elow. Second opinion 7.4% trend, $1,525.08 PMPM, built member by member.\u003c/span>\u003c/div>\n  \u003cdiv class=\"modc\">\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\">\u003cspan style=\"font-weight:600;font-size:15px\">Administrative expense\u003c/span>\u003cspan class=\"stamp\" style=\"font-size:11px\">represented · Phase 2\u003c/span>\u003c/div>\u003cspan style=\"font-size:13.5px;line-height:1.4\">Held at filed. Program and vendor fees from intervention scenarios ($0.71 PMPM) are booked here unless they qualify as quality improvement.\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"panel\">\n  \u003cdiv class=\"ph\">\u003cspan>Three versions of the CY2028 bid · medical expense · 148,000 members\u003c/span>\u003cspan class=\"mono\" style=\"text-transform:none;letter-spacing:0\">1 bps of trend ≈ $252K\u003c/span>\u003c/div>\n  \u003ctable class=\"t\">\u003ctr>\u003cth>Version\u003c/th>\u003cth class=\"r\">Trend assumption\u003c/th>\u003cth class=\"r\">CY2028 PMPM\u003c/th>\u003cth class=\"r\">Margin · MedEx view\u003c/th>\u003cth class=\"r\">Margin $\u003c/th>\u003cth class=\"r\">Δ vs. filed\u003c/th>\u003cth class=\"r\">80% interval (margin)\u003c/th>\u003cth>Certifying actuary\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>\u003cspan style=\"display:inline-block;width:10px;height:10px;background:#D99A2B;margin-right:8px\">\u003c/span>\u003cb>Filed forecast (status quo)\u003c/b>\u003c/td>\u003ctd class=\"num\">6.8%\u003c/td>\u003ctd class=\"num\">$1,516.56\u003c/td>\u003ctd class=\"num\">3.1%\u003c/td>\u003ctd class=\"num\">$78.1M\u003c/td>\u003ctd class=\"num\">—\u003c/td>\u003ctd class=\"num\" style=\"color:#5C6B68\">point estimate\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">reference only\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003cspan style=\"display:inline-block;width:10px;height:10px;background:#0E7C6B;margin-right:8px\">\u003c/span>\u003cb>PMABI second opinion\u003c/b>\u003c/td>\u003ctd class=\" \" y=\"{{wf.y3}}\" width=\"70\" height=\"{{wf.h3}}\" fill=\"#7FE0C9\">\u003c/rect>\u003ctext x=\"285\" y=\"208\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">Interventions\u003c/text>\u003ctext x=\"285\" y=\"{{wf.t3}}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0F2A24\" font-family=\"IBM Plex Mono,Menlo,monospace\">{{recT}}\u003c/text>\n      \u003crect x=\"350\" y=\"{{wf.y4}}\" width=\"70\" height=\"{{wf.h4}}\" fill=\"#0F2A24\">\u003c/rect>\u003ctext x=\"385\" y=\"208\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\">Result\u003c/text>\u003ctext x=\"385\" y=\"{{wf.t4}}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0F2A24\" font-family=\"IBM Plex Mono,Menlo,monospace\">{{marginT}}\u003c/text>\n      \u003ctext x=\"30\" y=\"{{wf.t1}}\" font-size=\"9.5\" fill=\"#5C6B68\" font-family=\"IBM Plex Mono,Menlo,monospace\" text-anchor=\"end\">\u003c/text>\n    \u003c/svg>\n    \u003cdiv class=\"note\">Ties exactly to the Intervention studio waterfall: credited +14 bps of a modeled +40. Every step is a disclosed assumption with an interval.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ph\">Audit log · CY2028 bid\u003c/div>\n    \u003ctable class=\"t\">\u003ctr>\u003cth>When\u003c/th>\u003cth>Event\u003c/th>\u003cth>By\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd class=\"mono\">Mar 04 15:20\u003c/td>\u003ctd>Override · induced utilization +31 → +25 bps · reason: Meridian 2025 dental experience\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">D. Hargrove\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd class=\"mono\">Mar 02 09:14\u003c/td>\u003ctd>Intervention set committed · modeled +40, credited +14 at tier defaults\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">J. Alvarez\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd class=\"mono\">Feb 27 16:40\u003c/td>\u003ctd>Scenario S-03 adopted as benefit design\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">CFO office\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd class=\"mono\">Feb 24 11:02\u003c/td>\u003ctd>Forecast v2.3.1 run · seed 20261231 · reconciled −3 bps\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">engine\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd class=\"mono\">Feb 21 14:55\u003c/td>\u003ctd>CKD 3b→4 cohort definition reviewed and approved\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">chief actuary\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd class=\"mono\">Feb 18 10:30\u003c/td>\u003ctd>Rx watchlist refreshed · 5 signals · public sources\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">signal agent\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd class=\"mono\">Jan 09 08:00\u003c/td>\u003ctd>Data freeze Dec 31 2026 · manifests verified\u003c/td>\u003ctd class=\"mono\" style=\"font-size:12.5px\">engine\u003c/td>\u003c/tr>\n    \u003c/table>\n    \u003cdiv class=\"note\">The log records the actuary's overrides, not the model's. Every number is stamped with model version, seed, as-of date and register version; the log ships in the desk-review pack.\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv class=\"panel sand\">\n      \u003cdiv class=\"ph\">Certifying actuary · further haircut\u003c/div>\n      \u003cdiv class=\"lever\">\u003clabel for=\"hc\">Haircut on credited interventions\u003cspan>{{hcT}}\u003c/span>\u003c/label>\u003cinput id=\"hc\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{hc}}\" onChange=\"{{setHc}}\">\u003c/div>\n      \u003cdiv class=\"kv\">\u003cspan class=\"k\">Modeled · credited\u003c/span>\u003cspan class=\"v\">+40 · +{{rawT}} bps\u003c/span>\u003cspan class=\"k\">After haircut\u003c/span>\u003cspan class=\"v\" style=\"font-weight:600\">{{recT}}\u003c/span>\u003cspan class=\"k\">Margin after haircut\u003c/span>\u003cspan class=\"v\">{{marginT}} · {{marginUsd}}\u003c/span>\u003c/div>\n      \u003cdiv class=\"note\">The actuary can haircut or zero any line. The haircut is itself logged and disclosed.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel ink\">\u003cdiv class=\"ph\">What the actuary signs\u003c/div>\u003cdiv class=\"note\" style=\"color:#F6F2EB\">Outputs land in Meridian's BPT structure (Worksheets 1/2/5) with a methodology memo mapped to ASOP 23/25/41/56 and a desk-review pack. PMABI does not certify; it is a certifying-actuary input, a documented second opinion with an evidence chain behind every dollar. Sign-off is the last step: freeze the register, then export.\u003c/div>\u003ca class=\"btn sm\" href=\"Register.dc.html\" onClick=\"{{nav.Register}}\" style=\"align-self:flex-start\">Assumption register &amp; sign-off \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\": {\"width\": 1440, \"height\": 1280}, \"go\": {\"editor\": null}}'>\nclass Component extends DCLogic {\n\nconstructor(p){ super(p); this.state = { hc: 0 }; }\n_rv() {\n  const s = this.state, f = 1 - s.hc / 100;\n  const exp = 13.75 * f, rev = 0, tot = exp + rev, m = 2.5 + tot / 100;\n  const H = 46, base = 190;\n  const wf = { y1: base - 3.1 * H, h1: 3.1 * H, t1: base - 3.1 * H - 6, y2: base - 3.1 * H, h2: .6 * H, t2: base - 3.1 * H - 6, y3: base - m * H, h3: tot / 100 * H, t3: base - m * H - 6, y4: base - m * H, h4: m * H, t4: base - m * H - 6 };\n  const usd = b => '$' + (b * .252).toFixed(1) + 'M';\n  return { hc: s.hc, hcT: s.hc + '%', setHc: e => this.setState({ hc: +e.target.value }),\n    expT: exp.toFixed(0), expUsd: '+' + usd(exp), expCi: '−' + (exp * .45).toFixed(0) + ' to −' + (exp * 1.45).toFixed(0) + ' bps', revT: rev.toFixed(0), revUsd: '+' + usd(rev), revCi: '+' + (rev * .45).toFixed(0) + ' to +' + (rev * 1.45).toFixed(0) + ' bps',\n    trendT: (7.4 - exp / 100).toFixed(1) + '%', pmpmT: '$' + (1420 * (1 + (7.4 - exp / 100) / 100)).toFixed(2).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ','), marginT: m.toFixed(1) + '%', marginUsd: '$' + (2520 * m / 100).toFixed(1) + 'M', recT: '+' + tot.toFixed(0) + ' bps recovered', rawT: '14', ciT: (2.5 + tot * .45 / 100).toFixed(1) + '% – ' + (2.5 + tot * 1.45 / 100).toFixed(1) + '%', wf };\n}\n\n\n_nav() { const g = this.props.go, o = {}; [\"Main\", \"Ingest\", \"Pipeline\", \"Profiles\", \"Member\", \"Cohorts\", \"Forecast\", \"RxPipeline\", \"DxGap\", \"Scenarios\", \"Interventions\", \"Variance\", \"Bid\", \"Register\", \"Export\"].forEach(k => { o[k] = e => { if (g) { if (e && e.preventDefault) e.preventDefault(); g(k); } }; }); return o; }\nrenderVals() { const v = this._rv(), nav = this._nav(); if (v.cur && v.cur.href) { const k = v.cur.href.replace('.dc.html', ''); v.cur = { ...v.cur, go: nav[k] }; } return { ...v, nav }; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>"};window.__resources={};window.__resourceBlobs={};Object.keys(F).forEach(function(k){var id='res-'+k;window.__resourceBlobs[id]=new Blob([F[k]],{type:'text/html'});window.__resources['./'+k]=id;});})();

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;background:#F6F2EB;color:#0F2A24;font-size:14.5px;line-height:1.4}
a{color:#0E7C6B;text-decoration:none}a:hover{color:#0A5A4E}
*{box-sizing:border-box}
.serif{font-family:Fraunces,'Source Serif 4',Georgia,serif;font-weight:600}
.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.rail{width:240px;height:100%;background:#0F2A24;color:#F6F2EB;display:flex;flex-direction:column;padding:20px 0 16px;position:relative;flex-shrink:0}
.logo{padding:0 20px 18px;border-bottom:1px solid rgba(246,242,235,.12)}
.logo .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;letter-spacing:.02em;color:#F6F2EB;line-height:1}
.logo .tag{font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:#7FE0C9;margin-top:6px}
.steps{position:relative;padding:16px 0 0 20px;flex-grow:1}
.steps .line{position:absolute;left:31px;top:38px;width:1px;height:440px;background:#7FE0C9;transform-origin:top;animation:flow 2s ease-out 1}
@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.step{display:flex;align-items:center;gap:12px;height:44px;color:rgba(246,242,235,.72);position:relative}
.step:hover{color:#F6F2EB}
.step .g{width:24px;height:24px;border-radius:12px;border:1px solid rgba(127,224,201,.55);background:#0F2A24;display:flex;align-items:center;justify-content:center;color:#7FE0C9;flex-shrink:0;position:relative;z-index:1}
.step.done .g{background:#0A5A4E;border-color:#0A5A4E;color:#7FE0C9}
.step.cur{color:#F6F2EB;font-weight:600}
.step.cur .g{background:#7FE0C9;color:#0F2A24;border-color:#7FE0C9;box-shadow:0 0 0 5px rgba(127,224,201,.22)}
.step .l{font-size:14px}
.phi{height:22px;margin:0 16px 0 0;border-top:1px dashed #D99A2B;padding-top:3px;box-sizing:border-box;display:flex;align-items:flex-start}
.phi span{font-family:'IBM Plex Mono',Menlo,monospace;font-size:9px;letter-spacing:.06em;color:#D99A2B;text-transform:uppercase;line-height:1.3;background:#0F2A24;position:relative;z-index:1;padding-right:4px}
.roadmap{padding:12px 20px 0;border-top:1px solid rgba(246,242,235,.12);font-size:12px;color:rgba(246,242,235,.38);line-height:1.5}
.roadmap b{font-weight:500;color:rgba(246,242,235,.5);display:block;font-family:'IBM Plex Mono',Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.top{height:68px;background:#F6F2EB;border-bottom:1px solid #5C6B68;display:flex;align-items:center;padding:0 32px;gap:20px;flex-shrink:0}
.top .crumbs{font-size:14px;color:#0F2A24;display:flex;gap:10px;align-items:center;flex-grow:1}
.top .crumbs .dot{color:#5C6B68}
.stamp{font-family:'IBM Plex Mono',Menlo,monospace;font-size:12px;letter-spacing:.04em;border:1px solid #0F2A24;padding:3px 8px;border-radius:4px;color:#0F2A24}
.stamp.mint{border-color:#0E7C6B;color:#0E7C6B}
.stamp.amber{border-color:#D99A2B;color:#8a5f14}
.illus{font-size:12.5px;color:#5C6B68;font-style:italic}
.toplink{font-size:13px;color:#0E7C6B;border:1px solid #0E7C6B;border-radius:4px;padding:4px 10px;font-weight:500}
.main{flex-grow:1;display:flex;flex-direction:column;min-width:0;height:100%}
.content{padding:20px 32px 24px;flex-grow:1;position:relative;overflow:auto;display:flex;flex-direction:column;gap:16px}
.h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:31px;line-height:1.1;margin:0;color:#0F2A24}
.sub{font-size:15px;line-height:1.45;max-width:1020px;color:#5C6B68;margin-top:4px}
.panel{background:#FFFFFF;border:1px solid #5C6B68;border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.panel.sand{background:#EDE6DA}
.panel.ink{background:#0F2A24;color:#F6F2EB;border-color:#0F2A24}
.ph{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#5C6B68;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.panel.ink .ph{color:#7FE0C9}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.big.s{font-size:26px}
.t{width:100%;border-collapse:collapse;font-size:14px;table-layout:auto}
.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#5C6B68;font-weight:500;height:30px;border-bottom:1px solid #5C6B68;padding:0 6px;white-space:normal;line-height:1.2;vertical-align:bottom;padding-bottom:4px}
.t td{height:38px;padding:2px 6px;border-bottom:1px solid #EDE6DA;white-space:normal;vertical-align:middle;line-height:1.25}
.t td.num,.t td.mono{white-space:nowrap}
.t tr:nth-child(even) td{background:#FAF7F1}
.t .r,.t th.r{text-align:right}
.t .num{font-family:'IBM Plex Mono',Menlo,monospace;font-variant-numeric:tabular-nums;text-align:right}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#E6F2EE}
.t tr.sel td{background:#E0F0EB;box-shadow:inset 3px 0 0 #0E7C6B}
.pos{color:#0E7C6B}.neg{color:#8a5f14}.rust{color:#B5482D}
.badge{font-family:'IBM Plex Mono',Menlo,monospace;font-size:11px;letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid #0F2A24;display:inline-block;line-height:1.3}
.b3{background:#0F2A24;color:#F6F2EB}.b2{background:#0E7C6B;color:#F6F2EB;border-color:#0E7C6B}.b1{background:#7FE0C9;color:#0F2A24;border-color:#7FE0C9}.b0{background:#EDE6DA;color:#5C6B68;border-color:#EDE6DA}
.tier{font-family:'IBM Plex Mono',Menlo,monospace;font-size:10.5px;letter-spacing:.04em}
.drill{position:absolute;top:0;right:0;bottom:0;width:540px;background:#FFFFFF;border-left:1px solid #5C6B68;padding:18px 20px;display:flex;flex-direction:column;gap:12px;animation:slide .28s ease-out 1;z-index:5;overflow:auto}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.drill .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drill .dt{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:23px;line-height:1.15}
.xbtn{background:none;border:1px solid #5C6B68;border-radius:4px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#0F2A24;cursor:pointer;flex-shrink:0}
.btn{background:#0E7C6B;color:#F6F2EB;border:1px solid #0E7C6B;border-radius:4px;padding:0 14px;height:34px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:#0A5A4E;color:#F6F2EB}
.btn.ghost{background:transparent;color:#0F2A24;border-color:#0F2A24}
.btn.ghost:hover{background:#EDE6DA;color:#0F2A24}
.btn.sm{height:32px;font-size:13.5px;padding:0 10px}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:5px 12px;font-size:14px}
.kv .v{overflow-wrap:anywhere}
.kv .k{color:#5C6B68}
.kv .v{font-family:'IBM Plex Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.foot{font-size:12.5px;color:#5C6B68;display:flex;justify-content:space-between;gap:20px;border-top:1px solid #EDE6DA;padding-top:8px}
.foot .mono{font-size:12px}
.note{font-size:14px;color:#5C6B68;line-height:1.45}
.lever{display:flex;flex-direction:column;gap:4px}
.lever label{font-size:14px;color:#0F2A24;display:flex;justify-content:space-between}
.lever label span{font-family:'IBM Plex Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lever input[type=range]{width:100%;accent-color:#0E7C6B;height:20px;margin:0}
.commit{font-family:'IBM Plex Mono',Menlo,monospace;font-size:12.5px;letter-spacing:.05em;border:1.5px solid #0E7C6B;color:#0A5A4E;padding:5px 10px;border-radius:3px;background:rgba(127,224,201,.18);display:inline-block}
.tab{font-size:13.5px;padding:6px 12px;border:1px solid #5C6B68;border-radius:4px;background:transparent;font-family:inherit;cursor:pointer;color:#0F2A24}
.tab.on{background:#0F2A24;color:#F6F2EB;border-color:#0F2A24}
.legend{display:flex;gap:14px;font-size:12.5px;color:#5C6B68;align-items:center}
.legend i{display:inline-block;width:14px;height:8px;margin-right:5px;vertical-align:middle}
.rc{font-family:'IBM Plex Mono',Menlo,monospace;font-size:12px;color:#0A5A4E;background:#E6F2EE;padding:1px 5px;border-radius:3px}

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1400}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { screen: 'Main' }; }
renderVals() {
  const s = this.state.screen, o = { go: k => this.setState({ screen: k }) };
  ["Main", "Ingest", "Pipeline", "Profiles", "Member", "Cohorts", "Forecast", "RxPipeline", "DxGap", "Scenarios", "Interventions", "Variance", "Bid", "Register", "Export"].forEach(k => { o['is' + k] = s === k; });
  return o;
}
}
</script>
